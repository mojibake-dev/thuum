- name: Main
  type_id: 1005
  holds: nothing in 1.6.1170 (the writer returns; the block is present with zero bytes)
  scope: none
  source: 36619 at 0x64a030 (CONFIRMED-STATIC: the body is a return)
- name: Form ID Array
