  scope: bookkeeping
  source: 43616 at 0x7c5150 (HYPOTHESIS, decompile)
- name: Magic Favorites
  type_id: 109
  holds: MagicFavorites' spells and hotkeys
  scope: player
  source: 52012 at 0x93ab90 (HYPOTHESIS, decompile)
- name: PlayerControls
