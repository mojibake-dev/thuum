[project]
name = "labapi"
version = "0.0.1"
description = "thuum lab-api: the scenario runner on sky-srv (docs/LAB.md)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2",
  "pyyaml>=6",
  "proxmoxer>=2",
  "requests>=2",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.scripts]
labapi = "labapi.app:main"
labapi-dev = "labapi.app:dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labapi"]
