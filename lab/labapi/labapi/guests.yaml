# The lab's tables, from docs/LAB.md and CONTRACT.md.
#
# guests: `managed: false` means lab-api never stops, rolls back, starts, or
# execs into the guest; it only waits for its heartbeat. `client:` names the
# scenario client a guest plays: c1 is sky-c1 and c2 is sky-c2 (since
# 2026-10-01, when sky-c2 got the GPU); fenestrate is Eli's desktop, a file
# source only, never a client.
# The clients' rollback target is clean-m1 from 2026-10-02: the M1 wire
# client (fork branch m1-wire), taken cold by thuum-mundus on top of the
# RakNet baseline clean-sp, which stays underneath. Proxmox rolls a ZFS disk
# back only to its newest snapshot, so lab-api must target clean-m1; the way
# back to RakNet is deleting clean-m1 and setting these two to clean-sp.
guests:
  - {name: sky-srv,    vmid: 700, ip: 10.10.70.10, kind: qemu, role: server, managed: true,  snapshot: clean}
  - {name: sky-re,     vmid: 701, ip: 10.10.70.11, kind: lxc,  role: re,     managed: true,  snapshot: clean}
  - {name: sky-ci,     vmid: 702, ip: 10.10.70.12, kind: qemu, role: ci,     managed: false}
  - {name: sky-c1,     vmid: 711, ip: 10.10.70.21, kind: qemu, role: client, managed: true,  snapshot: clean-m1, client: c1}
  - {name: sky-c2,     vmid: 712, ip: 10.10.70.22, kind: qemu, role: client, managed: true,  snapshot: clean-m1, client: c2}
  - {name: fenestrate, vmid: 220, ip: 10.10.60.20, kind: qemu, role: client, managed: false}

# clients: the profileId each scenario client logs in with (offlineMode on the
# server; skymp5-settings.txt on the machine that plays the client). The
# server keys actors by profileId, and lab-api asks the labState RPC by it.
clients:
  c1: {profile_id: 1}
  c2: {profile_id: 2}

# items: "<file>:<editor id>" to base form id, hand-maintained for the item
# names the m0 scenarios use until the ledger tooling generates it. A plain
# integer or 0x-hex form id in a scenario needs no entry here. Every id here
# needs a source (rule 1 in spirit): these two appear in upstream's own
# misc/tests/test_removeallitems.js. The m0-forge names (IronIngot,
# LeatherStrips, IronDagger, RecipeIronDagger) are added once verified
# against Skyrim.esm on rpool/sky/persist, not from memory.
items:
  "Skyrim.esm:IronSword": 0x00012EB7
  "Skyrim.esm:Gold001": 0x0000000F
  # read from the lab's Skyrim.esm by editor id (record scan on the host, 2026-09-29)
  "Skyrim.esm:IngotIron": 0x0005ACE4
  "Skyrim.esm:LeatherStrips": 0x000800E4
  "Skyrim.esm:IronDagger": 0x0001397E
  "Skyrim.esm:RecipeWeaponIronDagger": 0x000DA76A
  # a one-handed weapon the spawn kit does not carry (the kit holds IronSword,
  # IronDagger, IronWarAxe), for m0-inventory; same record scan, 2026-10-01
  "Skyrim.esm:SteelSword": 0x00013989

# cells: the places scenarios teleport to and measure from. A scenario's x, y, z
# are offsets from the cell's origin: lab-api adds the origin on the way to the
# server and subtracts it on the way back, and names the cell by this key when
# the server's descriptor matches. desc is FormDesc::ToString ("<hex id>:<file>",
# skymp5-server/cpp/server_guest_lib/FormDesc.cpp); worldOrCell is the form id
# lab-driver reports. lab-spawn is the server's default start point
# (skymp5-server/ts/settings.ts) in Tamriel until lab.esp (Track L4) provides a
# dedicated cell.
cells:
  lab-spawn: {desc: "3c:Skyrim.esm", worldOrCell: 0x3c, origin: [133857, -61130, 14662]}
