# Playtest twenty-nine's seats (thuum ADR-040 item 6: `just playtest-setup 29`; the checklist is
# docs/private/playtest-m2-29.md; M2's close, docs/M2-CLOSE.md): fork m2-train-31 on its stage under the
# merged essentials layer. Twenty-eight's world as saved after its report, in its cleaned copy (profile 2's
# dangling 'a86df:Cloaks.esp' learned spell removed, 2026-10-20): its records are formVersion 2 already, so
# slice one re-bases nothing at the load. Items top up to their counts (playtest-setup, main 485c4ee), so
# twenty-eight's piles do not grow; Survival is on in both records (828 = 1). Under the layer Apocalypse holds full slot 0x1A
# (lab-api's slots.py over the deployed settings, 2026-10-20 15:3x), so its ids are 0x1Axxxxxx; rotfern
# 0x2F, Cloaks.esp 0x0B, Winter Is Coming 0x0E. Everything here is server-side (labCommand through
# playtest-console, set-percentages); the one thing a seat types itself is test 1's `player.addperk 7934b`
# (Overdraw40, the headshot rule's perk, which lives in the shooter's game).
