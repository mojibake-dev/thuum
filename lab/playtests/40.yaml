# playtest-m3-39-paused-20261031T014638Z (rotfern profile 1, Prisoner profile 2), the clock 7.9, npcEnabled, bars full, no god
# mode (Eli toggles tgm). Both seats at the Riverwood guard camp, as 39. Spells: the records keep Raise Wall, Dead Thrall and
