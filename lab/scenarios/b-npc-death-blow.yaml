# b-npc-death-blow (thuum-magnus, 2026-10-27; train 54, npc-fate.md H-52b, ADR-050 decision 2): a hosted NPC's
# death whose report names no killer is credited to the hit the server numbered. Promoted unchanged from
# x-npc-death-blow v2 (GREEN 20261027-181507 on 54's stage of fork m3-npc-face 240a31de; the id and this header
# changed, steps and claims byte for byte). Shape: b-npc-death-engine's measured leg (the combat hold, six
# iron-sword swings, the one-number read), then the server path's death forced without a lethal blow: two more
# sword swings for a numbered hit within the server's 3 s window, then the host's own engine takes his health
# with no attacker (npc-damage, Actor.DamageActorValue, as the cause does when it brings the engine to zero), so
# deathStart names no killer and the report says cause 0; the server credits the hit it numbered ("the killer
# ff000000 credited from the server's own number", ActionListener::OnActorDeath case 0). The engine's own kill
# move takes the other path (cause 4, the killer named, x-npc-death-blow v1 174006); which path a lethal blow
# takes is the engine's dice (52's rest 153601, 160510, 161323 took the server's). Claims: b-npc-death-engine's
# nine plus the credit line. Its own commit (rule 13).
# 53's gate 052618: Sven held in place (npc-hold) before the measured swings, the walking-target premise; claims
# unchanged (its own commit, 22:31 PDT 2026-10-27).
id: b-npc-death-blow
milestone: M3
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
  npcEnabled: true
  gameHour: 7.9
timeout_s: 900
steps:
  - c1: connect
  - c2: connect
  - wait: 10
  - c1: close-menu {name: MessageBoxMenu}
  - c2: close-menu {name: MessageBoxMenu}
  - c1: server-console {name: TGM}
  - c2: server-console {name: TGM}
  - c2: teleport {cell: lab-spawn, x: 0, y: -300, z: 0, rot: [0, 0, 0]}
  - c1: teleport {cell: "3c:Skyrim.esm", x: 17225, y: -47204, z: -128, rot: [0, 0, 0]}
  - wait: 20
  - assert:
      - server.host(0x9732).hosted == true
      - server.host(0x9732).client == "c1"
  - c2: teleport {cell: "3c:Skyrim.esm", x: 17375, y: -47204, z: -128, rot: [0, 0, 180]}
  - wait: 20
  - c1: npc-state {formId: 0x13491}
  - c2: npc-state {formId: 0x13491}
  - assert:
      - server.host(0x9732).client == "c1"
      - c1.npc_state(0x13491).aiEnabled == true
      - c2.npc_state(0x13491).aiEnabled == false
      - server.ref(0x13491).isDead == false
  - c1: give {item: "Skyrim.esm:IronSword", count: 1}
  # the iron sword (WEAP 0x12eb7, esm.py; 7 a hit on his 50) for every swing, equipped through the console as
  # b-marksman arms its bow: six measured swings leave him alive and hurt for the one-number read, and the
  # kill legs' small blows end him through the engine's own death event, which names the killer. A Daedric
  # warhammer's 27-a-hit blow (rest2 160510, rest 153601) ended him with "died of unknown ..., killer 0":
  # after a lethal single blow the engine's deathStart names no killer and the server records the death on
  # its own evidence without crediting its pending aggressor; that credit is train 54's (npc-fate.md H-52b)
  - c1: console {text: "player.equipitem 12eb7"}
  - wait: 2
  - c1: draw-weapon
  # v5 (2026-10-27, after 092536: the hold before the approach did not take with c1 at the landing, 3700 units
  # from Sven (start-combat answered inCombat false, no target), c2's swings after each judged teleport drew
  # the sheathed blade instead of striking (a teleport sheathes; zero hits of thirty), and Sven's package took
  # him into the inn, where a Tamriel-framed approach read his interior coordinates as world ones). So: the
  # host approaches him first, in the frame of his record (cell: record, wherever his package has him), starts
  # his combat there and reads the hold before anything else; every approach draws the weapon again before
  # the swings; the claims as they were
  - c1: approach {formId: 0x13491, distance: 150, cell: record}
  # the measured swings under the combat hold, six of them (52's gate 20261027-140805 missed its one swing
  # on a moving combatant; the still hold did not hold him: with his AI off on the host he walked 260 units
  # in the rest's rerun 160214, 20430 to 20657, and look-at's setAngle never turns the player, its heading
  # reading the approach's every time). Six iron-sword swings at 1.5 s against an engaged Sven closing in
  # land at least one and at most 42 of his 50, so the one-number read finds him hurt and alive; his AI
  # stays on throughout, so the death below names its killer (a death under AI off names none, 153601)
  - c1: start-combat {formId: 0x13491}
  - wait: 3
  - c1: npc-state {formId: 0x13491}
  - assert:
      - c1.npc_state(0x13491).inCombat == true
  # 53's gate 20261028-052618 (death-engine): none of the measured swings landed, Sven working his distance in
  # combat (he hit c1 four times, c1 him never): the walking-target premise. He is held in place (npc-hold,
  # SetDontMove: his current leg ends within a few seconds, then he stands exactly, still in combat) before the
  # approach, so the swings find him; the claims are as they were
  - c1: npc-hold {formId: 0x13491, held: true}
  - wait: 5
  - c1: approach {formId: 0x13491, distance: 110, cell: record}
  - c1: draw-weapon
  - wait: 1
  # four measured swings, not six (55's gate 20261028-002258: all six landed, 42 of his 50, and the two swings
  # for the numbered hit then took him to zero, 56 in all; the eighth, lethal, rolled the engine's own kill
  # move, which named the killer itself and left the credit nothing to do). Four land at most 28, the two
  # after at most 14: 42 at most, never lethal, so the death is npc-damage's alone
  - c1: repeat {times: 4, gapMs: 1500, step: {hold-key: {code: 199, ms: 120}}}
  - wait: 2
  # the measured swings, then the one-number read: the engine's health on the host against the record
  - c1: npc-state {formId: 0x13491}
  - c2: npc-state {formId: 0x13491}
  - assert:
      - server.ref(0x13491).healthPercentage < 1
      - abs(c1.npc_state(0x13491).healthPercentage - server.ref(0x13491).healthPercentage) < 0.03
  # the kill (v2 after 20261027-174006, where the engine's own kill move ended him first, "ff000000 hit it
  # 537 ms before (the engine's number outran the server's)", the server's number still at 0.04, and the
  # credit had nothing to do; which path a lethal blow takes is the engine's dice, 160510 and 161323 took
  # the server's): the server path's report shape forced. Two more sword swings land at least one numbered
  # hit, never lethal (at most six hits of seven on his fifty: four measured, two after), then the host's own engine takes his
  # health with no attacker (npc-damage, Actor.DamageActorValue, as the cause does when it brings the engine
  # to zero): deathStart names no killer, the report says cause 0, and the server credits the hit it
  # numbered within its 3 s window (H-52b, m3-npc-face 240a31de)
  - c1: repeat {times: 2, gapMs: 700, step: {hold-key: {code: 199, ms: 120}}}
  - wait: 0.5
  - c1: npc-damage {formId: 0x13491, amount: 60}
  - until: {within: 40, expect: [server.ref(0x13491).isDead == true]}
  - wait: 6
  - c1: npc-state {formId: 0x13491}
  - c2: npc-state {formId: 0x13491}
  - c1: log-count {pattern: "cause on 13491: health"}
  - c1: log-count {pattern: "death report: 13491 died"}
  - c1: screenshot
  - c2: screenshot
  - assert:
      - 'c1.log_count("cause on 13491: health") >= 2'
      # the death is the engine's: either the server's number reaches zero first and the kill waits on the
      # host's report (death pending), or the host's engine ends him first (a kill move at low health decides
      # before the damage) and the server takes the report on its own evidence; both are the design's
      # (ADR-050 decision 2, ADR-048 B; x-npc-death-host v3 091759 took the second path)
      - 'server.log_count("death pending on 13491") >= 1 or server.log_count("death report: 13491 died") >= 1'
      - 'server.log_count("death report: 13491 died .* killer ff000000") >= 1'
      # H-52b's read: the killer came from the server's own number, the engine having named none
      - 'server.log_count("credited from the server.s own number") >= 1'
      - 'server.log_count("death by the server.s word on 13491") == 0'
      - server.ref(0x13491).isDead == true
      - c1.npc_state(0x13491).isDead == true
      - c2.npc_state(0x13491).isDead == true
      - abs(c1.npc_state(0x13491).x - c2.npc_state(0x13491).x) < 200
      - abs(c1.npc_state(0x13491).y - c2.npc_state(0x13491).y) < 200
  - c1: npc-hold {formId: 0x13491, held: false}
  - c1: dump-state
  - c2: dump-state
artifacts: [server.log, c1.log, c2.log, screenshots]
