# M0 smoke, one client: sky-c1 boots to connected, is placed, moves, is given
# an item the spawn kit does not contain, and both survive a server restart. The one-client floor of the lab
# loop (rollback, boot-to-connected, steps, assertions, artifacts) that can
# run before sky-c2 exists; smoke-two-players is the real smoke. Assertions
# are evaluated by lab-api only (ADR-009). Edit the code, not this file.
id: smoke-solo
milestone: M0
clients: [c1]
server:
  snapshot: clean
  netem: null
timeout_s: 600
steps:
  - c1: connect
  - c1: teleport {cell: lab-spawn, x: 0, y: 0, z: 0}
  - wait: 5
  - c1: dump-state
  - c1: screenshot
  - assert:
      - server.actor(c1).cell == "lab-spawn"
      - abs(server.actor(c1).x) < 50
      - abs(c1.state.x - server.actor(c1).x) < 50
  - c1: move {dx: 300, dy: 0, duration_s: 3}
  - wait: 3
  - assert:
      - abs(server.actor(c1).x - 300) < 50
  - c1: give {item: "Skyrim.esm:IngotIron", count: 1}   # server command, R0; not in the spawn kit
  - wait: 3
  - assert:
      - server.inventory(c1).count("Skyrim.esm:IngotIron") == 1
  - server: restart
  - wait: 20
  - c1: reconnect
  - wait: 5
  - c1: dump-state
  - assert:
      - abs(server.actor(c1).x - 300) < 50
      - server.inventory(c1).count("Skyrim.esm:IngotIron") == 1
      - abs(c1.state.x - server.actor(c1).x) < 50
artifacts: [server.log, c1.log, screenshots, world-diff]
