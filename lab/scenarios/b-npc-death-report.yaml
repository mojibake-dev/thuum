# b-npc-death-report (M3, docs/verbs/npc-fate.md, ADR-048 B; 2026-10-24, the subject fixed
# 2026-10-25): a death the server has no number for travels from the host's report when the
# server can check it. Every viewed actor carries the engine's deferred kill, so a fall
# leaves a hosted actor at or under zero health with no death event; the host's game reads
# the floor (DeathReportService's poll) and sends ActorDeath (cause 0), and the server
# accepts it by the drop in its own movement samples (200 units within 4 s) and kills the
# record: dead on the server and on both engines, the body the server's container, the
# respawn on the master's reset clock. The subject is a FIXED EncWolf, 0x82717 (ACHR, base
# 0x23abe EncWolf itself, Tamriel at 102871.5, -83986.3, 12369.7; numidium's esm.py read),
# so the server rolls nothing: the earlier subject 0x85547 was placed from the leveled
# template 0x1e7a0 and came up a skeever one run in five, and a lifted skeever never fell
# (nightly 20261025-124620). Grid by truncation toward zero: the subject's square is
# (25, -20); c1 parks at (22, -20), three squares west, where the fate pass's ring loads
# the subject's square and the rival predator 0x82718's (24, -21) while the engine attaches
# neither, and kill-refs the pair 0x82716 and 0x82718 so the subject stands alone; both
# seats land 470 units east of the wolf under god mode. The premises are read from the
# engine (c1 runs the wolf, c2 puppets it, raceId 78346). Then the lift (prid 82717, setpos
# z 16370: 4000 up, through skymp's console intercept: the server sets the record and
# teleports the host's engine actor, which then falls), two reads of the fall, the until on
# the record's death, dead on both seats, the host's report line counted. Refusals are the
# server log's "[verb:npc-fate] death report E_DEATH_*" lines. Measured as x-npc-fall-report
# v4 GREEN 20261025-195607 on parity 6cdc2b35 (the until at its first poll, dead on the
# server and both seats, the client's line counted); the leveled subject's run before it
# was v3 GREEN 20261025-012351 on train-44. The trap's evidence (a trigger's own
# activation) is the verb's open HYPOTHESIS and no claim here. Its own commit (rule 13).
id: b-npc-death-report
milestone: M3
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
  npcEnabled: true
  gameHour: 7.9
timeout_s: 420
steps:
  - c1: connect
  - c2: connect
  - wait: 10
  - c1: console {text: "tgm"}
  - c2: console {text: "tgm"}
  - wait: 2
  # the prelude: from the park three squares out the rivals die while nobody's engine has them
  - c1: teleport {cell: "3c:Skyrim.esm", x: 92160, y: -83968, z: 25000, rot: [0, 0, 0]}
  - wait: 8
  - c1: kill-ref {formId: 0x82716, killer: c1}
  - c1: kill-ref {formId: 0x82718, killer: c1}
  - wait: 2
  - c1: teleport {cell: "3c:Skyrim.esm", x: 103340, y: -83986, z: 12400, rot: [0, 0, 90]}
  - c2: teleport {cell: "3c:Skyrim.esm", x: 103540, y: -83986, z: 12400, rot: [0, 0, 90]}
  - wait: 25
  - c1: npc-state {formId: 0x82717}
  - c2: npc-state {formId: 0x82717}
  - assert:
      - server.ref(0x82717).isDead == false
      - server.ref(0x82716).isDead == true
      - c1.npc_state(0x82717).aiEnabled == true
      - c2.npc_state(0x82717).aiEnabled == false
      - c1.npc_state(0x82717).raceId == 78346
  - c1: npc-state {formId: 0x82717}
  - c2: npc-state {formId: 0x82717}
  # the lift: the host's engine takes the wolf 4000 units up and lets it fall
  - c1: console {text: "prid 82717"}
  - wait: 1
  - c1: console {text: "setpos z 16370"}
  # the read either way (numidium, after 20261025-004503): the wolf two and ten seconds after the
  # lift on the host, so the run says whether it fell, landed at the floor or never fell
  - wait: 2
  - c1: npc-state {formId: 0x82717}
  - wait: 8
  - c1: npc-state {formId: 0x82717}
  - until: {within: 10, expect: [server.ref(0x82717).isDead == true]}
  - wait: 5
  - c1: npc-state {formId: 0x82717}
  - c2: npc-state {formId: 0x82717}
  - c1: log-count {pattern: "death report: 82717 died"}
  - c1: screenshot
  - assert:
      - server.ref(0x82717).isDead == true
      - c1.npc_state(0x82717).isDead == true
      - c2.npc_state(0x82717).isDead == true
      - 'c1.log_count("death report: 82717 died") >= 1'
artifacts: [server.log, c1.log, c2.log, screenshots]
