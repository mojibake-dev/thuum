  - c2: log-count {pattern: "relayed activation 54b15 by 567f2"}
  - server: snapshot {name: c2Relayed0A, of: 'c2.log_count("relayed activation 54b15 by 567f2")'}
  - server: log-count {pattern: "567f2 activates 54b15 in cell 371de .its host ff000000 reports.: relayed to 1 game.s."}
  - server: snapshot {name: srvHost0A, of: 'server.log_count("567f2 activates 54b15 in cell 371de .its host ff000000 reports.: relayed to 1 game.s.")'}
  - server: log-count {pattern: "567f2 activates 54b15 in cell 371de .ff000001 reports with the cell loaded, its firing.: relayed to 1 game.s."}
  - server: snapshot {name: srvLoad0A, of: 'server.log_count("567f2 activates 54b15 in cell 371de .ff000001 reports with the cell loaded, its firing.: relayed to 1 game.s.")'}
