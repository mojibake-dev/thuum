id: b-bleak-traps
milestone: M4
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
  npcEnabled: false
  gameHour: 7.9
timeout_s: 900
artifacts: [server.log, c1.log, c2.log, screenshots]
steps:
  - c1: connect
  - c2: connect
  - wait: 10
  - c1: close-menu {name: MessageBoxMenu}
  - c2: close-menu {name: MessageBoxMenu}
  - c1: server-console {name: TGM}
  - c2: server-console {name: TGM}
  - c1: teleport {cell: "371de:Skyrim.esm", x: -4200, y: 850, z: 650, rot: [0, 0, 90]}
  - wait: 20
  - c2: teleport {cell: "371de:Skyrim.esm", x: -4100, y: 850, z: 650, rot: [0, 0, 90]}
  - wait: 20
  - assert:
      - server.host(0x371de).client == "c1"
  # A. the host walks onto the plate while the guest stands in the wall's swing (v3, promoted from x-trap-wall-both v1.2,
  # green 20261105-224256): both Health bases 300 through the server first; c1 at the stepper's start, 77 units short of
  # the plate's top; c2 in the swing, 199 units from the wall's hinge (a server teleport is placed, not glided)
  - c1: server-console {name: SetAV, args: [0x14, "Health", 300]}
  - c2: server-console {name: SetAV, args: [0x14, "Health", 300]}
  - c1: teleport {cell: "371de:Skyrim.esm", x: 8589, y: -5460, z: -2044, rot: [0, 0, 0]}
  - until: {within: 30, every: 1, expect: ['server.host(0x371de).client == "c1"']}
  - c2: teleport {cell: "371de:Skyrim.esm", x: 8589, y: -5538, z: -2044, rot: [0, 0, 0]}
  - wait: 8
  # v1.2: the fired counts once both have settled at their spots, against the walk's baseline
  - c1: log-count {pattern: "trap 54b15 fired here by 567f2"}
  - server: snapshot {name: c1FiredEntryA, of: 'c1.log_count("trap 54b15 fired here by 567f2")'}
  - c2: log-count {pattern: "trap 54b15 fired here by 567f2"}
  - server: snapshot {name: c2FiredEntryA, of: 'c2.log_count("trap 54b15 fired here by 567f2")'}
  - c1: log-count {pattern: "scriptNonOwnerSkip nonLatent: a non-owned state row"}
  - c2: log-count {pattern: "scriptNonOwnerSkip nonLatent: a non-owned state row"}
  - c1: log-count {pattern: "trap family ready: [0-9]+ root"}
  - c2: log-count {pattern: "trap family ready: [0-9]+ root"}
  - c1: log-count {pattern: ".verb:traps. world damage multipliers: the engine.s own for the difficulty in force .D-T4 B.: fDiffMultHPToPCVE"}
  - c2: log-count {pattern: ".verb:traps. world damage multipliers: the engine.s own for the difficulty in force .D-T4 B.: fDiffMultHPToPCVE"}
  # the walk toggle on, once on each seat (a new game starts running)
  - c1: tap-key {code: 58}
  - c2: tap-key {code: 58}
  # god mode off on both for the walks (the prelude's TGM put it on), on again after leg B's reads
  - c1: server-console {name: TGM}
  - c2: server-console {name: TGM}
  - c1: set-percentages {health: 1.0}
  - c2: set-percentages {health: 1.0}
  - wait: 2
  - c1: av-read {names: [health]}
  - server: snapshot {name: c1BaseA, of: "c1.av().health"}
  - server: snapshot {name: c1Hp0A, of: "c1.av().healthCurrent"}
  - c2: av-read {names: [health]}
  - server: snapshot {name: c2BaseA, of: "c2.av().health"}
  - server: snapshot {name: c2Hp0A, of: "c2.av().healthCurrent"}
  - server: snapshot {name: c1Rec0A, of: "server.actor(c1).healthPercentage"}
  - server: snapshot {name: c2Rec0A, of: "server.actor(c2).healthPercentage"}
  - c1: log-count {pattern: "trap 54b15 fired here by 567f2"}
  - server: snapshot {name: c1Fired0A, of: 'c1.log_count("trap 54b15 fired here by 567f2")'}
  - c2: log-count {pattern: "trap 54b15 fired here by 567f2"}
  - server: snapshot {name: c2Fired0A, of: 'c2.log_count("trap 54b15 fired here by 567f2")'}
  # v4 (D-W1): each seat's own firings, the host's report, the guest's relayed play and the server's two relay lines, counted
  # with the walk's baseline so a firing at the cell's entry (docs/engine/scripts.md S10) stays out of the claims; the
