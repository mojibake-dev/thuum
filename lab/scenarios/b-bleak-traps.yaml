  - c2: log-count {pattern: "trap 54b15 fired here by 567f2: the presser.s owner.s firing"}
  - server: snapshot {name: c2Own0A, of: 'c2.log_count("trap 54b15 fired here by 567f2: the presser.s owner.s firing")'}
  - c1: log-count {pattern: "Sent a linked activation of  54b15 by 567f2"}
