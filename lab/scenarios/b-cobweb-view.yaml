# notes 1 and 7 applied as written (ADR-064 amendment A). Note 1: leg 1's "E_ENTRY_ == 0", mid-run, went red on a correct build
# (c2's teleport out of the web is reported 1,500 to 2,000 units off it and refused E_ENTRY_REACH, and the run would end before
# rule 6's restart leg), so it names the entries alone, 'server.log_count("E_ENTRY_[A-Z_]+: ff000001 reports ff000001
