# (amendment B): x-cobweb-relay v1.5 (20261109-103725), x-cobweb-view v1.2 (20261107-232334); fresh-reviewed v1.3's claim
# changes, v1.4 the review's notes as written. Its own commit (rule 13).
# b-cobweb-view v1.4 DRAFT (r50 lab layer, 2026-11-09): v1.3's fresh review (GO WITH NOTES), its notes 1 to 4 applied as written
# (ADR-064 amendment A, so no second review). Note 1: the 800-unit reason was false (the grant serves the host's emitters,
