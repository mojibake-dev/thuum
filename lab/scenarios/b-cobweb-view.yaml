# the figure. No other step changes.
# b-cobweb-view v1.3 DRAFT (r50 lab layer, 2026-11-09): aligned with its parts for the merge gate (amendment B: assembled from
# green parts). (1) x-cobweb-relay v1.5's change (drafts, sha1 8e6084ef): its claim 6, c1's gate ignoring the figure's own entry,
# is RECORDED, since the gate's ignored line prints for the first three ignored events on one counter and the host spends them at
# its own Temple load (x-cobweb-relay v1.3's red 20261107-232023); leg 1's copy of it moves to RECORDED the same way, its count
# step kept. (2) The restart, leg 3: x-cobweb-view v1.2 (drafts, sha1 ce5072d5) read it GREEN on the 50 stage for 0x3758c
# (20261107-232334, its leg 4, the same steps as leg 3 here), so leg 3 claims 0x3758c alone, as that leg does; 0x37281's restart
# claims (its serve ahead of c2's grant and behind c1's create word, both applies, both variable lines, both broken reads) move to
