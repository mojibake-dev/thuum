# b-npc-death (M3, docs/verbs/npc-fate.md, the deaths; 2026-10-24): a
# game-file actor's death is the server's word on every seat and its body
# stays. Two seats under npcEnabled in god mode. The prelude parks c1 three
# squares from the forest cell, where the fate pass has loaded the ring's
# records before any engine attaches the cell, and kills the subject's rival
# predators there by kill-ref (the forest's predators fight each other
# within seconds of the cell loading); then both seats land and the subject
# 0x85547 stands alone, alive, c1 hosting. Legs: kill-ref the subject, dead
# on the record and both seats within 10 s (the host by the death container,
# the viewer by the isDead property); the viewer leaves five squares out and
# returns, the body still a body on its screen (the dead bind, the
# two-second read); the server restarts with the viewer held five squares out
# and the host alone reloading the cell (the restart's grant is a race between
# the games' own logins, and the record is its host's body: 52's gate
# 20261027-112539, where the viewer won it with a corpse its reload had
# re-settled 360 units down the slope), the record dead at its point where it
# fell, within 256 units each way (a ragdoll's settle on a slope, 65 measured;
# a death never teleports the record) and dead on both seats; the host's game is relaunched,
# the cell passes to the viewer (the stale rule) with the body in place, and
# the returning host finds it dead. No respawn inside the run (the master's
# 240 hours). Proved as x-npc-death v3 GREEN 080218 on train-43 d2210492
# (v2 070022 held every death leg, red on a one-unit body bound). Its own
# commit (rule 13).
id: b-npc-death
milestone: M3
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
  npcEnabled: true
  gameHour: 12.0
timeout_s: 1200
steps:
  - c1: connect
  - c2: connect
  - wait: 10
  - c1: console {text: tgm}
  - c2: console {text: tgm}
  - wait: 2
  # the prelude (v2, after 064426): the forest's predators fight each other within seconds of the
  # cell loading and 0x85549 killed the subject before any kill-ref. The fate pass loads the ring's
  # records three squares out, before any engine attaches the cell, so c1 parks there (the pin
  # probe's park, z 25000 in god mode) and the rivals 0x85548 and 0x85549 die by kill-ref while
  # nobody's engine has them; then both seats land and the subject stands alone
  - c1: teleport {cell: "3c:Skyrim.esm", x: 130336, y: -67584, z: 25000, rot: [0, 0, 0]}
  - wait: 8
  - c1: kill-ref {formId: 0x85548, killer: c1}
  - c1: kill-ref {formId: 0x85549, killer: c1}
  - wait: 2
  - c1: teleport {cell: lab-spawn, x: -10457, y: -19170, z: -3957, rot: [0, 0, 0]}
  - c2: teleport {cell: lab-spawn, x: -10300, y: -19170, z: -3957, rot: [0, 0, 180]}
  - wait: 25
  - assert:
      - server.host(0x9810).client == "c1"
      - server.ref(0x85547).isDead == false
      - server.ref(0x85549).isDead == true
  # leg 1: the kill is the server's word on both seats
  - c1: kill-ref {formId: 0x85547, killer: c1}
  - wait: 10
  - server: snapshot {name: body, of: "server.ref(0x85547)"}
  - c1: npc-state {formId: 0x85547}
  - c2: npc-state {formId: 0x85547}
  - c1: screenshot
  - c2: screenshot
  - assert:
      - server.ref(0x85547).isDead == true
      - c1.npc_state(0x85547).isDead == true
      - c2.npc_state(0x85547).isDead == true
  # leg 2: the viewer leaves (the lab spawn, five squares out) and returns: the body is still a
  # body on its screen (the dead bind, the two-second re-check)
  - c2: teleport {cell: lab-spawn, x: 0, y: -300, z: 0, rot: [0, 0, 0]}
  - wait: 12
  - c2: teleport {cell: lab-spawn, x: -10300, y: -19170, z: -3957, rot: [0, 0, 180]}
  - wait: 15
  - c2: npc-state {formId: 0x85547}
  - assert:
      - c2.npc_state(0x85547).isDead == true
      - server.ref(0x85547).isDead == true
  # leg 3: the server restarts; the record loads dead at its point and arms no 25 s timer (rule 6).
  # The premise (52's gate 20261027-112539): the record after the restart is its HOST's body (R2), and
  # both games log in again within the same tenth of a second, so the grant is a race (c2 won it in
  # 004553 and 112539, c1 in 061658). In 112539 c2's own game had re-settled the corpse on the cell's
  # reload in leg 2 (360 units down the slope and 104 lower, the engine's physics; no line of ours,
  # and a dead ragdoll takes no setPosition) and the record followed c2's body, 360 from the snapshot.
  # So c2 waits five squares out through the restart, c1 alone reloads the cell and holds it (the grant
  # within a tenth of a second of its login, as b-cell-host reads it) and c2 comes back once c1 has it;
  # the claims below are unchanged
  - c2: teleport {cell: lab-spawn, x: 0, y: -300, z: 0, rot: [0, 0, 0]}
  - wait: 8
  - server: restart {gameHour: 12.0}
  - c1: reconnect
  # god mode again, the server's lever straight after each login: the server's tgm is a session flag a
  # restart forgets (52's gate 20261027-141823: predator 86117 hit c1 for real damage after the restart,
  # ten hits, c1 died at 14:22:30 and the grace passed its cells to c2 at 14:22:35, long before leg 4; the
  # prelude's console tgm had set it before the restart; b-cell-host's lever)
  - c1: server-console {name: TGM}
  - until: {within: 45, expect: [server.host(0x9810).client == "c1"]}
  - c2: reconnect
  - c2: server-console {name: TGM}
  # a move within a second of a seat's login never settled (52's restage 20261027-125354: the record
  # written at the landing, c2's game unmoved at the away point for 60 s while the server corrected it
  # every 3.5 s); the lab's own shape gives a login ten seconds before its first move (the prelude's
  # connects), so c2 gets fifteen here before its way back
  - wait: 15
  - c2: teleport {cell: lab-spawn, x: -10300, y: -19170, z: -3957, rot: [0, 0, 180]}
  - wait: 20
  - c1: npc-state {formId: 0x85547}
  - c2: npc-state {formId: 0x85547}
  - c1: screenshot
  - assert:
      - server.ref(0x85547).isDead == true
      # the body where it fell, within a ragdoll's settle each way: the host reports the corpse's
      # physics after the kill, 5.8 units in 070022 and 64.9 in 093324 (a slope); the claim is
      # that a death never teleports the record (a teleport is a cell's 4096 or more), so the
      # bound is 256, the exit's bound (cell-host.md), measured up by the runs, not guessed down
      - server.ref(0x85547).x - snapshot("body").x < 256
      - snapshot("body").x - server.ref(0x85547).x < 256
      - server.ref(0x85547).y - snapshot("body").y < 256
      - snapshot("body").y - server.ref(0x85547).y < 256
      - c1.npc_state(0x85547).isDead == true
      - c2.npc_state(0x85547).isDead == true
  # leg 4: the host relaunches; the cell passes to c2 and the body stays; the host's return finds it
  - c1: relaunch {until: gone}
  - wait: 20
  - c2: npc-state {formId: 0x85547}
  - assert:
      - server.host(0x9810).client == "c2"
      - c2.npc_state(0x85547).isDead == true
      - server.ref(0x85547).isDead == true
  - c1: connect
  # a relaunch loses the server's tgm as well (lab-relaunch-loses-god-mode): on again before the wait
  - c1: server-console {name: TGM}
  - wait: 25
  - c1: npc-state {formId: 0x85547}
  - assert:
      - c1.npc_state(0x85547).isDead == true
artifacts: [server.log, c1.log, c2.log, screenshots]
