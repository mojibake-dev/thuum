# b-npc-caster (thuum-magnus, 2026-10-27; train 53, docs/verbs/npc-stream.md slice 6, spells on hosted NPCs): a
# hosted mage's cast on the other screen is the host's cast. Promoted unchanged from x-npc-caster (GREEN
# 20261028-032625 on 53's stage of fork m3-npc-cast bf133744, and GREEN 024159 on ecec018e before it; the id and
# this header changed, steps and claims byte for byte). The mage EncBandit01MagicNordM 0x39d37 (the playtest's
# "mage") is placed at c1's own actor by the server console and opens combat on its own. In 032625 the puppet on c2
# cast the relayed spell five times and took three cast ends (H-53b confirmed), the server recorded zero
# E_CAST_UNKNOWN (the mage's casts all in the record's hands through the template chain) and two
# E_EQUIP_UNKNOWN_SPELL lines (two entries of the hands report recorded alone, the report kept), zero
# E_SPELL_NO_CAST and no E_EQUIP_REFUSED naming the mage, and 68 of its spell hits on c1's player landed through the
# record. Claims: c1 hosts 0x9732, the host's hand action lines, no E_EQUIP_REFUSED naming the mage, no "not found
# in equipment" cast line (the player's own since train 53), no E_CAST_FORM, no E_HIT_WEAPON naming a hosted spell,
# the puppet's cast and cast end on c2. Recorded: the spell projectiles in flight (ten polls), c2's hand actions
# taken, the E_CAST_UNKNOWN and E_EQUIP_UNKNOWN_SPELL counts, screenshots. Its own commit (rule 13).
# (refs-near filters a cell's references by their BASE form's type, lab-driver: a projectile in flight is found under
# PROJ 50, never under its reference class 64, 63 or 67, which read 0 by construction in 235808 and 000211)
id: b-npc-caster
milestone: M3
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
  npcEnabled: true
  gameHour: 7.9
timeout_s: 900
steps:
  - c1: connect
  - c2: connect
  - wait: 10
  - c1: close-menu {name: MessageBoxMenu}
  - c2: close-menu {name: MessageBoxMenu}
  - c1: server-console {name: TGM}
  - c2: server-console {name: TGM}
  - c2: teleport {cell: lab-spawn, x: 0, y: -300, z: 0, rot: [0, 0, 0]}
  - c1: teleport {cell: "3c:Skyrim.esm", x: 17225, y: -47204, z: -128, rot: [0, 0, 0]}
  - wait: 20
  - assert:
      - server.host(0x9732).hosted == true
      - server.host(0x9732).client == "c1"
  - c2: teleport {cell: "3c:Skyrim.esm", x: 17375, y: -47204, z: -128, rot: [0, 0, 180]}
  - wait: 20
  - c1: npc-state {formId: 0x13483}
  - c2: npc-state {formId: 0x13483}
  - assert:
      - server.host(0x9732).client == "c1"
      - c1.npc_state(0x13483).aiEnabled == true
      - c2.npc_state(0x13483).aiEnabled == false
  - c1: server-console {name: PlaceAtMe, args: [0x14, 0x39d37]}
  - wait: 3
  - c1: refs-near {radius: 4096, formTypes: [50]}
  - c2: refs-near {radius: 4096, formTypes: [50]}
  - wait: 1
  - c1: refs-near {radius: 4096, formTypes: [50]}
  - c2: refs-near {radius: 4096, formTypes: [50]}
  - wait: 1
  - c1: refs-near {radius: 4096, formTypes: [50]}
  - c2: refs-near {radius: 4096, formTypes: [50]}
  - wait: 1
  - c1: refs-near {radius: 4096, formTypes: [50]}
  - c2: refs-near {radius: 4096, formTypes: [50]}
  - wait: 1
  - c1: refs-near {radius: 4096, formTypes: [50]}
  - c2: refs-near {radius: 4096, formTypes: [50]}
  - wait: 1
  - c1: refs-near {radius: 4096, formTypes: [50]}
  - c2: refs-near {radius: 4096, formTypes: [50]}
  - wait: 1
  - c1: refs-near {radius: 4096, formTypes: [50]}
  - c2: refs-near {radius: 4096, formTypes: [50]}
  - wait: 1
  - c1: refs-near {radius: 4096, formTypes: [50]}
  - c2: refs-near {radius: 4096, formTypes: [50]}
  - wait: 1
  - c1: refs-near {radius: 4096, formTypes: [50]}
  - c2: refs-near {radius: 4096, formTypes: [50]}
  - wait: 1
  - c1: refs-near {radius: 4096, formTypes: [50]}
  - c2: refs-near {radius: 4096, formTypes: [50]}
  - wait: 1
  - wait: 12
  - c2: log-count {pattern: "cast [0-9a-f]+ on puppet [0-9a-f]+ hand [0-9] at [0-9a-f]+"}
  - c2: log-count {pattern: "cast end [0-9a-f]+ on puppet [0-9a-f]+ hand [0-9]"}
  - c2: log-count {pattern: "performAction on ff[0-9a-f]+: .* event '[Mm][RL]h_[A-Za-z_]*' .* taken 1"}
  - c1: log-count {pattern: "action [0-9a-f]+ idle [0-9a-f]+ [Mm][RL]h_[A-Za-z_]* type [0-9]+ on ff[0-9a-f]+"}
  - c1: screenshot
  - c2: screenshot
  - assert:
      - server.host(0x9732).client == "c1"
      - 'c1.log_count("action [0-9a-f]+ idle [0-9a-f]+ [Mm][RL]h_[A-Za-z_]* type [0-9]+ on ff[0-9a-f]+") >= 1'
      - 'server.log_count("E_EQUIP_REFUSED: ff000002") == 0'
      - 'server.log_count("OnSpellCast - spell [0-9a-f]+ not found in equipment") == 0'
      - 'server.log_count("E_CAST_FORM") == 0'
      - 'server.log_count("E_HIT_WEAPON: hosted ff000002 hits [0-9a-f]+ with [0-9a-f]+, which its record") == 0'
      - 'c2.log_count("cast [0-9a-f]+ on puppet [0-9a-f]+ hand [0-9] at [0-9a-f]+") >= 1'
      - 'c2.log_count("cast end [0-9a-f]+ on puppet [0-9a-f]+ hand [0-9]") >= 1'
  - c1: refs-near {radius: 2000, formTypes: [43]}
  - c1: dump-state
  - c2: dump-state
artifacts: [server.log, c1.log, c2.log, screenshots]
