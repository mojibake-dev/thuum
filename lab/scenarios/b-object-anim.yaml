# does); it says c2 never reports the plate's own activation, which the cell's host alone does (activationService.ts:104). KEPT
# as they were: no E_OBJANIM_ in A and B, A's E_TRAP_ claim, B's recorded health read (its question is x-trap-dodge's now).
# The wall's own animation events (180For, its Back, Rearm, by name on 54b15) are no longer claimable on either seat: the seam
# runs a family reference's PlayAnimation and PlayAnimationAndWait under the script action's mark, so the sendAnimationEvent
# hooks never note them, and never queues them, so no ScriptCall, no "native ... on 54b15" line and no "reported" line follow
