# b-object-anim v4 (thuum-cf, 2026-11-05; ADR-062's flip on fork m4-scripts-1-flip, the scripting ladder's rung 1, ADR-068): the two
# relaunch writes of activationUnblockedBases are deleted (the client lifts activation in a hosted cell by the cell's state; no
# list of bases). No claim changed. The headers below are the previous versions'.
# b-object-anim v3 (thuum-cf, 2026-11-03 night; the same correction Eli approved, one id short: v2's run 20261104-055038 on THE CANON
# read a fourth by-design refusal, "E_TRAP_NO_REF: ff000000 reports 38098 activating 380b9, no such reference", the plate's link to a
# fourth ambush draugr (LvlDraugrAmbushMelee1HHelmetMale at (8033, -5040)); every other claim held. The subtraction now names the
# plate's whole link block, the ambush draugr placed as one run of ids 380b0 to 380bf (380b3, 380b4, 380b5 and 380b9 seen), so the
# claim reads E_TRAP_ less the NO_REF lines for 38098's draugr links == 0; any other refusal, NO_REF included, still counts.
# v2 (thuum-cf, 2026-11-03 night; Eli's W4 word via numidium, "Yes, both"): leg A's 'server.log_count("E_TRAP_") == 0'
# read 4 on THE CANON (20261104-044647, the other five claims held): all four lines were "E_TRAP_NO_REF: ff000000 reports 38098
# activating 380b[345], no such reference", the plate's links to the ambush draugr, references the server never loads (the
# informational branch of OnLinkedActivation, the same by-design refusal as the pillars' XMarker 0x4fcdf in b-puzzle-relay). The claim
# now reads E_TRAP_ less those three ids' NO_REF lines == 0: every other E_TRAP_ code and any other NO_REF stays at zero. No other
# claim or step changed.
# v1 (thuum docs/verbs/traps.md, ADR-059 decisions 1 and 3; promoted 05:08 PST 2026-11-02 from probe x-object-anim v4, green
# 20261102-063627 on fork m4-object-animation ad1aa50a over the host-scoped layer, MERGED to parity ad1aa50a and main 482f157b
# the same night). Under the hosted-cell gate the cell's host runs Bleak Falls Temple's scripts and the guest's engine runs none;
# what the guest sees is what the host's engine shows, relayed as ObjectAnimation. A) the host c1 on the plate 0x567f2: its
# engine's PressurePlate fires ("567f2 activates 54b15"), the wall 0x54b15's events (180For, 180Back, Rearm) and the plate's Down
# are reported by c1 and played by c2. B) the guest c2 on the plate: c2's own engine fires nothing ("Sent a trigger's own
# activation" stays 0 on c2) while the host's engine fires for the figure, and c2 plays the wall again. C) the host turns the
# first puzzle pillar 0xaa8cb: its Trigger01 is reported, recorded as the pillar's lastAnimation and played on c2; the pillars'
# XMarker 0x4fcdf is E_TRAP_NO_REF by design (b-puzzle-relay). Claimed: the lines above, c2's silent plate, no E_OBJANIM_ and no
# E_TRAP_ refusal in A, no E_ACTIVATE_REACH in C. Spots are b-bleak-traps' and x-bleak-traps v4's.
id: b-object-anim
milestone: M4
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
timeout_s: 900
steps:
  - c1: connect
  - c2: connect
  - wait: 10
  - c1: close-menu {name: MessageBoxMenu}
  - c2: close-menu {name: MessageBoxMenu}
  - c1: server-console {name: TGM}
  - c2: server-console {name: TGM}
  - c1: teleport {cell: "371de:Skyrim.esm", x: -4200, y: 850, z: 650, rot: [0, 0, 90]}
  - wait: 20
  - c2: teleport {cell: "371de:Skyrim.esm", x: -4100, y: 850, z: 650, rot: [0, 0, 90]}
  - wait: 20
  - assert:
      - server.host(0x371de).client == "c1"
  # A. the host onto the plate; the guest 200 units back, facing it
  - c2: teleport {cell: "371de:Skyrim.esm", x: 8589, y: -5538, z: -2054, rot: [0, 0, 0]}
  - wait: 6
  - c1: teleport {cell: "371de:Skyrim.esm", x: 8589, y: -5338, z: -2054, rot: [0, 0, 0]}
  - until: {within: 5, every: 0.5, expect: ['server.log_count("567f2 activates 54b15 in cell 371de") >= 1']}
  - wait: 4
  - c1: screenshot
  - c2: screenshot
  - c1: log-count {pattern: "object animation 54b15 .* reported"}
  - c2: log-count {pattern: "object animation 54b15 .* played"}
  - c2: log-count {pattern: "Sent a trigger.s own activation"}
  - assert:
      - 'c1.log_count("object animation 54b15 .* reported") >= 1'
      - 'c2.log_count("object animation 54b15 .* played") >= 1'
      - 'c2.log_count("Sent a trigger.s own activation") == 0'
      - 'server.log_count("54b15 animates 54b15") >= 1'
      - 'server.log_count("E_OBJANIM_") == 0'
      # v2 (W4, Eli): the plate's links to the ambush draugr 380b3, 380b4 and 380b5 are references the server never loads, refused
      # E_TRAP_NO_REF by design (OnLinkedActivation's marker branch); every other E_TRAP_ code and any other NO_REF stays at zero
      - 'server.log_count("E_TRAP_") - server.log_count("E_TRAP_NO_REF: .* reports 38098 activating 380b[0-9a-f], no such reference") == 0'
  # the host off the plate, the wall resets; B. the guest onto it: the host's engine fires for the figure, the guest's engine
  # runs no script of its own under the gate. (v3 carried decision 4's trap-hit trace here; read 20261102-051618: fourteen
  # Actor::DamageActor calls on the figure, none through RestoreActorValue, the figure's health kept by the platform's cut.)
  - c1: teleport {cell: "371de:Skyrim.esm", x: 8589, y: -5738, z: -2054, rot: [0, 0, 0]}
  - wait: 6
  - c2: teleport {cell: "371de:Skyrim.esm", x: 8589, y: -5338, z: -2054, rot: [0, 0, 0]}
  - until: {within: 5, every: 0.5, expect: ['server.log_count("567f2 activates 54b15 in cell 371de") >= 2']}
  - wait: 4
  - c1: screenshot
  - c2: screenshot
  - c2: log-count {pattern: "Sent a trigger.s own activation"}
  - c2: log-count {pattern: "object animation 54b15 .* played"}
  # decision 4's read, recorded not claimed: the wall swung at c2's FIGURE on c1's engine (god mode is c2's own game's, not
  # the figure's); whether the figure's health dropped there says which path a trap's harm takes (TrapHitBase on the host)
  - c1: av-read {other: true, names: [health]}
  - c2: av-read {names: [health]}
  - assert:
      - 'c2.log_count("Sent a trigger.s own activation") == 0'
      - 'c2.log_count("object animation 54b15 .* played") >= 2'
      - 'server.log_count("E_OBJANIM_") == 0'
  # C. the puzzle room: the host turns the first pillar once, the guest watches it
  - c1: teleport {cell: "371de:Skyrim.esm", x: 5400, y: -900, z: -768, rot: [0, 0, 90]}
  - c2: teleport {cell: "371de:Skyrim.esm", x: 5300, y: -1200, z: -768, rot: [0, 0, 90]}
  - wait: 8
  - c2: look-at {formId: 0xaa8cb}
  - wait: 2
  - c1: screenshot
  - c2: screenshot
  - c1: activate {refId: 0xaa8cb}
  - wait: 4
  - c1: screenshot
  - c2: screenshot
  - c1: log-count {pattern: "object animation aa8cb .* reported"}
  - c2: log-count {pattern: "object animation aa8cb .* played"}
  - assert:
      - 'c1.log_count("object animation aa8cb .* reported") >= 1'
      - 'c2.log_count("object animation aa8cb .* played") >= 1'
      - 'server.log_count("aa8cb animates aa8cb") >= 1'
      - 'server.log_count("E_OBJANIM_") == 0'
      - 'server.log_count("E_ACTIVATE_REACH") == 0'
artifacts: [server.log, c1.log, c2.log, screenshots]
