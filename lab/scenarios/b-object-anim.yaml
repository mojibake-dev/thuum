  - server: snapshot {name: c1RelayBeforeA, of: 'c1.log_count("trap 54b15 fired here by 567f2: the relay.s own play")'}
  - c2: log-count {pattern: "trap 54b15 fired here by 567f2: the relay.s own play"}
  - server: snapshot {name: c2RelayBeforeA, of: 'c2.log_count("trap 54b15 fired here by 567f2: the relay.s own play")'}
