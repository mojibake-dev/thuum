# b-global-default (thuum-magnus, promoted 14:07 PST 2026-11-02 from x-global-default d8f5cd9b, GREEN on its first run
# 20261102-220306 on the deployed c9177cbc settings: both seats 1 at login, c1 0 after the MCM-style set with c2 still 1, c1 0 after
# the relaunch, c1 0 and c2 1 after the restart; docs/verbs/player-globals.md, "A default for everyone"). Eli via numidium
# 2026-11-02: "a default setting id like turned for everyone and new players in MCM is the legacy resurrection FX for the
# reanimation fx mod", the plugin raw. A listed player global may carry a default (wire-rules player_globals, an object entry
# {"global", "default"}), which the login sends where the record is silent; a player's own MCM change reports through the watch and
# the record keeps it. The lab's settings list Undead FX 4.2's US_Setting_Decay_UseOld (GLOB 05178e:UndeadFX.esp, plugin default 0,
# the MCM's "Use Old Decay FX") with default 1. Claims, each with what it proves:
# 1. The login: both seats read 1 (the default sent to every record silent on it; the plugin's own 0 overwritten by the login).
# 2. The MCM's change: c1 sets 0 (the driver's global step, as the toggle would); after a report c1 reads 0 and c2 still 1.
# 3. A relaunch of c1 keeps 0 (the record's value wins over the default at login); 4. a server restart keeps both: c1 0, c2 1.
# Assertions are evaluated by lab-api only (ADR-009). Its own commit (rule 13).
id: b-global-default
milestone: M2
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
  npcEnabled: false
  gameHour: 7.9
timeout_s: 600
steps:
  - c1: connect
  - c2: connect
  - wait: 12
  - c1: close-menu {name: MessageBoxMenu}
  - c2: close-menu {name: MessageBoxMenu}
  # 1. the login's default
  - c1: globals {forms: ["05178e:UndeadFX.esp"]}
  - c2: globals {forms: ["05178e:UndeadFX.esp"]}
  - assert:
      - c1.globalValue("05178e:UndeadFX.esp") == 1
      - c2.globalValue("05178e:UndeadFX.esp") == 1
  # 2. the MCM's change on c1
  - c1: global {form: 0x05178e, file: "UndeadFX.esp", value: 0}
  - wait: 4
  - c1: globals {forms: ["05178e:UndeadFX.esp"]}
  - c2: globals {forms: ["05178e:UndeadFX.esp"]}
  - assert:
      - c1.globalValue("05178e:UndeadFX.esp") == 0
      - c2.globalValue("05178e:UndeadFX.esp") == 1
  # 3. a relaunch keeps the record's value over the default
  - c1: relaunch {until: gone}
  - c1: connect
  - wait: 15
  - c1: close-menu {name: MessageBoxMenu}
  - c1: globals {forms: ["05178e:UndeadFX.esp"]}
  - assert:
      - c1.globalValue("05178e:UndeadFX.esp") == 0
  # 4. a server restart keeps both
  - server: restart
  - wait: 20
  - c1: reconnect
  - c2: reconnect
  - wait: 15
  - c1: close-menu {name: MessageBoxMenu}
  - c2: close-menu {name: MessageBoxMenu}
  - c1: globals {forms: ["05178e:UndeadFX.esp"]}
  - c2: globals {forms: ["05178e:UndeadFX.esp"]}
  - c1: dump-state
  - c2: dump-state
  - assert:
      - c1.globalValue("05178e:UndeadFX.esp") == 0
      - c2.globalValue("05178e:UndeadFX.esp") == 1
artifacts: [server.log, c1.log, c2.log]
