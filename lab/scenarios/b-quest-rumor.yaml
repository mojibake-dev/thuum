# b-quest-rumor v2 DRAFT (thuum-fa, 00:5x PST 2026-11-10): the claim rewrite Eli approved as W1 B (14:4x PST 2026-11-09 in
# numidium's session, ADR-068's "Rung 5's words", docs/DECISIONS.md :4868-4874; ADR-064 decision 4; the plan's section 6 W1 and
# read 3), whose condition ("once x-quest-runs v1 names the vampire castle controller's lines inside its window") x-quest-runs v1
# 20261110-071422 met: DLC1VCController 0x0201a428 started once on each seat at its login (c1 07:14:58.262, c2 07:14:58.156 by the
# seats' clocks) and never started or stopped again in either 150 s window, and the server's only lines for it were the two login
# OWN_START refusals. Rung 5 retires D62 and D69's rule (IsSeatsOwnQuest, QuestStageIsEngineStart and the OWN_START refusal:
# OnQuestStage at fork m4-scripts-5-quests 90601f16 prints no E_QUEST_OWN_START, nor since 155c12fa; its codes are ACTING, CHURN,
# DENIED, FULL, PLAYER, RUNS_FULL, STAGE, UNKNOWN and UNLISTED), so v1's last block cannot hold, and v1's mode-all pattern never
# matched the server's line (read 3; red at step 11 in apocrypha's layer sweep 20261109-225901, 035739, gate.yaml pending since
# 8d3cfb78).
# It changes exactly what W1 names, line by line:
# (1) v1's step 11 claim 'server.log_count("QuestStage: actor ff[0-9a-f]+ sent .* mode all") >= 1' becomes b-quest-stage's
#     approved form, 'server.log_count("QuestStage: actor ff[0-9a-f]+ sent mode 1 with [0-9]+ denied quests") >= 2' (the server's
#     login line, ActionListener.cpp :7678-7681 at 90601f16, prints the mode's number; both seats);
# (2) the DB01Misc, MQ102 and HeartwoodMill steps and claims byte for byte, each with a comment saying why it holds under the new
#     rule;
# (3) v1's OWN_START block (its until on "E_QUEST_OWN_START ... reported stage 0 of 1a428:Dawnguard.esm" and its assert) becomes
#     the new rule's: 'server.log_count("set 1a428:Dawnguard.esm stage") == 0' kept, 'server.log_count("starts
#     1a428:Dawnguard.esm") <= 1' added, read at once where v1's until passed on its first poll (the line it waited on printed at
#     each seat's login, and rung 5 never prints it). W1's third clause, each seat's churn-hold line at least once "when
#     x-quest-runs v1 reads the bursts inside the window", DROPS: that read saw no burst of the controller (above), so there is
#     nothing for a hold to hold and the clause's own condition is not met. The read's one churner, RL_DetectionQuest 0x30002859
#     of RLAiO.esp (1,514 and 1,559 run flips in about ten minutes on c1 and c2), is a client-only plugin's quest, which the
#     client fix pass on the stage's head stops reporting (the coordinator's word, 2026-11-10);
# (4) added: c2's own gold unchanged across DB01Misc 10 (an inventory {ref: 0x14} read on c2 before c1's set and after it, the
#     count compared); and c2's acting line where the fragment names the player: none here, so nothing is added for it. The census
#     index on sky-srv (/tmp/r5-census, read 2026-11-10) shows DB01Misc's stage 10 fragment, QF_DB01Misc_0001EA4F Fragment_4,
#     and FreeformHeartwoodMill's stage 20 fragment, Fragment_1 (its only call SetObjectiveDisplayed), calling no Game.GetPlayer,
#     so no "acting player <id> returned" line can print for either; the gold claim then holds by the fragment's content (it
#     pays nobody), the outcome W1 names. The acting claims live in x-acting-player v1 and b-quest-stage-two-seats v1, whose
#     fragment names the player.
# Nothing else changed: the relaunches with the chain trace, the connects, the stages read and set, every other claim and the
# recorded reads (step 13's "fragment of 1ea4f stage 10 skipped" among them: a recorded count, unchanged, whose pattern lacks the
# platform's "entry <n>" and so counts nothing on canon or on the stage's head; for the reviewer, not this rewrite). Run words are
# read at the lab's default (on), no lever: questRuns on unless false (questStageService.ts runsEnabled :1446-1449), the default
# the lab keeps under every answer to D-Q4 (D-Q4 A would turn the words off only in playtest 51's own profile; the coordinator's
# word, 2026-11-10). The one run word claim here, the controller's start at most once, reads the first seat's start recorded and a
# second seat's start of a running quest folded (wire-rules quest_runs); a stage-0 report is judged the start word's too
# (ActionListener.cpp OnQuestStage's quest_report_word, :3488-3499 at 90601f16), so it adds no second line.
# Depends on a server fix for one kept claim, byte for byte, said at its comment: HeartwoodMill's stage 10 never set on the
# server. Fork ef9215c9 (the coordinator's word, 2026-11-10) judges a report of a quest's start-up stage (QUST INDX
# StartUpStage, e3ea5's stage 10) as the start, not as a world stage, as a stage-0 report already is (read 5).
# Commits alone (rule 13) after its fresh review and its green on the stage; leaves gate.yaml's pending list with that green.
#
# b-quest-rumor v1 (thuum-magnus, 22:19 PDT 2026-10-30; docs/verbs/quest-stage.md, ADR-056, memo D69 B): a start-game-enabled quest's
# later stages are the world's and its own start stays each seat's. Playtest 38's finding 76 ("prisoner picked up the aventus rumor
# misc quest and it didn't propagate"): under D62 every start-game-enabled quest's stage was each seat's own; D69 B refuses only the
# engine's own start (stage 0 and the record's start-up stages, QUST INDX) and relays the rest. Promoted unchanged from x-quest-rumor
# v2 (GREEN 20261031-051455 on m3-quest-sge-stages 6dbabc7a's stage; the id and this header changed, steps and claims byte for byte).
# Shape: the chain trace armed on both seats at a relaunch, both connect in mode all; c1's console sets stage 10 of DB01Misc 0x1ea4f
# (the rumor's quest, start-game-enabled, in no list): recorded, relayed, c2's game applies it; c1 sets MQ102's stage 10 (denied):
# kept per seat, no server line; FreeformHeartwoodMill 0xe3ea5's start-up stage 10 reads done on both seats by the quest's own start
# (the engine refuses a console set of a done stage, so no report follows), its stage 20 (no flag) is recorded and relayed once and c2
# has it done; the server's OWN_START refusal is reached through the reports the engine makes by itself, the vampire controller
# DLC1VCController 1a428:Dawnguard.esm restarting in bursts (its stage 0 refused within 150 s, never recorded). Pending in
# lab/gate.yaml until D69's train merges: on parity (D62) the HeartwoodMill relay is refused.
id: b-quest-rumor
milestone: M3
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
  npcEnabled: true
  gameHour: 7.9
timeout_s: 300
steps:
  # v2: the chain trace armed on both seats while their games are stopped (c1 sets, c2 applies the relayed stage)
  - c1: relaunch {until: gone, frida: {script: quest-stage-chain.js}}
  - c2: relaunch {until: gone, frida: {script: quest-stage-chain.js}}
  - c1: connect
  - c2: connect
  - wait: 10
  - c1: close-menu {name: MessageBoxMenu}
  - c2: close-menu {name: MessageBoxMenu}
  - c1: quest-stage {quests: [0x1ea4f, 0x4e50d], stages: [10]}
  - c2: quest-stage {quests: [0x1ea4f, 0x4e50d], stages: [10]}
  - c1: log-count {pattern: "the server shares .* mode all"}
  - c2: log-count {pattern: "the server shares .* mode all"}
  - assert:
      - c1.quest(0x1ea4f).stageDone(10) == false
      - c2.quest(0x1ea4f).stageDone(10) == false
      - 'c1.log_count("the server shares .* mode all") >= 1'
      - 'c2.log_count("the server shares .* mode all") >= 1'
      # the server's login send in mode all (mode 1, with its denied list) to both seats: a claim, not a read (the gate audit,
      # 2026-11-02; v2, W1 (1): the pattern is the server's real line, which prints the mode's number, b-quest-stage's approved
      # form of 50de1f6b)
      - 'server.log_count("QuestStage: actor ff[0-9a-f]+ sent mode 1 with [0-9]+ denied quests") >= 2'
  # an undeclared quest's stage is the world's in mode all
  # v3: the game's own console (setstage, 22151 over the setter): the driver's Papyrus Quest.Start then SetCurrentStageID answered
  # false to both on MS13Intro in 131512 (started false, ok false; no setter, no stage event, nothing to report)
  # v2 (rung 5, W1 (2)): DB01Misc 0x1ea4f is start-game-enabled and Run Once (esm.py quests flags 0x0111) and the world's by D-Q1
  # (none of its five aliases is the player's: two guards and Cicero's road marker by forced reference, Curwe and Loreius by unique
  # actor; QuestScopeTest's World case), so every stage of it crosses under rung 5 as D69 B let its later stages cross: recorded,
  # relayed, applied on c2, unchanged
  # v2 (W1 (4)): c2's own gold before c1's set of DB01Misc 10
  - c2: inventory {ref: 0x14}
  - server: snapshot {name: c2GoldBefore1ea4f, of: 'c2.inventory(0x14).count("Skyrim.esm:Gold001")'}
  - c1: console {text: "setstage 1ea4f 10"}
  - until: {within: 15, expect: ['server.log_count("\\[verb:quest-stage\\] ff[0-9a-f]+ set 1ea4f:Skyrim.esm stage 10: recorded, relayed to 1") >= 1']}
  - wait: 5
  - c1: quest-stage {quests: [0x1ea4f], stages: [10]}
  - c2: quest-stage {quests: [0x1ea4f], stages: [10]}
  - c2: log-count {pattern: "the world.s stage 10 of quest 1ea4f set"}
  - c2: log-count {pattern: "fragment of 1ea4f stage 10 skipped"}
  - c2: inventory {ref: 0x14}
  - assert:
      - c1.quest(0x1ea4f).stageDone(10) == true
      - c2.quest(0x1ea4f).stageDone(10) == true
      - c2.quest(0x1ea4f).stage() == 10
      - 'c2.log_count("the world.s stage 10 of quest 1ea4f set") >= 1'
      - 'server.log_count("E_QUEST_UNLISTED") == 0'
      # the fragment's skip on the applying seat (m3-quest-fragment) is read by its own scenario when it rides a
      # build; the literal >= 0 read is gone (the gate audit, 2026-11-02)
      # v2 (W1 (4)): c2's own gold unchanged across DB01Misc 10, whose fragment (Fragment_4) pays nobody and names no player
      - 'c2.inventory(0x14).count("Skyrim.esm:Gold001") == snapshot("c2GoldBefore1ea4f")'
  # a denied quest stays each seat's own
  # v2 (rung 5, W1 (2)): MQ102 0x4e50d stays on the deploy's denied list, which the login names in mode all beside the player
  # class (SendQuestStages, ActionListener.cpp :7593-7635 at 90601f16), so the client never reports it (questStageService.ts
  # reports() :1377-1382) and the server hears nothing of it: unchanged
  - c1: console {text: "setstage 4e50d 10"}
  - wait: 5
  - c2: quest-stage {quests: [0x4e50d], stages: [10]}
  - assert:
      # v6: the denied quest stays per seat at the client (QuestStageService reports every stage event but the denied, so the
      # server never hears of it: no line about 4e50d's stage, neither a set nor a refusal); the server's E_QUEST_DENIED is the
      # backstop for a client that does not filter, which T2's fakeclient exercises
      - 'server.log_count("set 4e50d:Skyrim.esm stage") == 0'
      - 'server.log_count("reported stage 10 of 4e50d:Skyrim.esm") == 0'
      - c2.quest(0x4e50d).stageDone(10) == false
  # the engine's own start of a start-game-enabled quest stays per seat: FreeformHeartwoodMill 0xe3ea5's stage 10 carries the
  # start-up flag (QUST INDX) and is DONE on both seats by the quest's own start at login (v1's read: the engine refuses a console
  # set of a done stage, so no report follows); its stage 20 carries no flag and crosses like any other quest's (D69 B)
  # v2 (rung 5, W1 (2)): QuestStageIsEngineStart is retired, so at 155c12fa a start-up stage a seat reports is recorded like any
  # other (QuestStageTest v2's case), and each seat's engine sets e3ea5's stage 10 at the quest's own start in its login. The kept
  # claim below, 'server.log_count("set e3ea5:Skyrim.esm stage 10") == 0', depends on fork ef9215c9 (the coordinator's
  # word, 2026-11-10): a report of a quest's start-up stage (QUST INDX StartUpStage, e3ea5's stage 10) judged as the start, not
  # as a world stage, as a stage-0 report already is (read 5). Without it the login's report of stage 10 is recorded and the
  # claim reads red; the engine still refuses c1's console set of a done stage; stage 20 crosses as before, now as every stage
  # of a world quest does
  - c1: quest-stage {quests: [0xe3ea5], stages: [10, 20]}
  - c2: quest-stage {quests: [0xe3ea5], stages: [10, 20]}
  - assert:
      - c1.quest(0xe3ea5).stageDone(10) == true
      - c2.quest(0xe3ea5).stageDone(10) == true
      - c1.quest(0xe3ea5).stageDone(20) == false
  - c1: console {text: "setstage e3ea5 20"}
  - until: {within: 15, expect: ['server.log_count("\\[verb:quest-stage\\] ff[0-9a-f]+ set e3ea5:Skyrim.esm stage 20: recorded, relayed to 1") >= 1']}
  - wait: 4
  - c1: quest-stage {quests: [0xe3ea5], stages: [10, 20]}
  - c2: quest-stage {quests: [0xe3ea5], stages: [10, 20]}
  - assert:
      - 'server.log_count("set e3ea5:Skyrim.esm stage 10") == 0'
      - 'server.log_count("set e3ea5:Skyrim.esm stage 20: recorded, relayed to 1") == 1'
      - c2.quest(0xe3ea5).stageDone(20) == true
  # v2 (rung 5, W1 (3)): the new rule in place of D62 and D69's. A stage-0 report is the start word's and never a stage
  # (OnQuestStage's quest_report_word, ActionListener.cpp :3488-3499), so the vampire castle's controller DLC1VCController
  # 1a428:Dawnguard.esm records no stage; its start is recorded at most once for the world (the first seat's; a second seat's
  # start of a running quest folds, wire-rules quest_runs, ActionListener.cpp :3595-3606), read at once: v1's until met its
  # condition at the first poll (each seat's OWN_START line for 1a428 printed at its login, x-quest-runs v1's server log
  # 07:14:59.924 and 07:15:00.373), so v1 read its claims here, and a 150 s wait would pass the scenario's 300 s budget. No
  # churn-hold claim: x-quest-runs v1 20261110-071422 read no burst of the controller in two 150 s windows (header, (3))
  - assert:
      - 'server.log_count("set 1a428:Dawnguard.esm stage") == 0'
      - 'server.log_count("starts 1a428:Dawnguard.esm") <= 1'
  - c1: screenshot
  - c2: screenshot
artifacts: [server.log, c1.log, c2.log, screenshots]
