# M0 regression floor: attributes. Health, magicka, and stamina are server
# state: the server lowers c1's health, c1 sees it, c2 sees it on c1, and it
# survives a restart. Assertions are evaluated by lab-api only (ADR-009).
# Needs: gamemode labCommand set-percentages (mp.set percentages), lab-driver
# dump-state (own actor values, healthPercentage of nearby actors).
id: m0-attributes
milestone: M0
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
timeout_s: 900
steps:
  - c1: connect
  - c2: connect
  - c1: teleport {cell: lab-spawn, x: 0, y: 0, z: 0}
  - c2: teleport {cell: lab-spawn, x: 0, y: -450, z: 0}
  - wait: 5
  - c1: set-percentages {health: 0.5, magicka: 0.25, stamina: 0.75}
  - wait: 1    # magicka and stamina regenerate (about 1.4 %/s magicka at +3.5 s, run 20261001-232457); sample before regeneration eats the tolerance
  - c1: dump-state
  - c2: dump-state
  # The client regenerates from the moment the values arrive, and the assert
  # takes its own fresh dump about half a second after the one above. Measured
  # at the dump above (runs 20261002-221030 and -222038 on the wire, 1.1 s
  # after the set): health 0.508, magicka 0.269, stamina 0.781; stamina then
  # climbs about 5 %/s, so a band of 0.05 around the set value failed at the
  # assert's own dump in both runs. Each client bound allows the set value
  # plus about three seconds of regeneration and nothing below it, and every
  # bound excludes the untouched 1.0.
  - assert:
      - abs(server.actor(c1).healthPercentage - 0.5) < 0.05
      - 0.45 <= c1.state.healthPercentage < 0.55
      - 0.2 <= c1.state.magickaPercentage < 0.35
      - 0.7 <= c1.state.staminaPercentage < 0.9
      - abs(c2.view(c1).healthPercentage - 0.5) < 0.05
  - server: restart
  - wait: 20
  - c1: reconnect
  - c2: reconnect
  - wait: 5
  - c1: dump-state
  # After the relog the client regenerates health from the record's 0.5 (about
  # 0.7 %/s) for the seconds between login and this sample, and reports it, so
  # the record follows. A reset reads 1.0; the bound allows 40 s of
  # regeneration and excludes it.
  - assert:
      - 0.45 <= server.actor(c1).healthPercentage < 0.8
      - 0.45 <= c1.state.healthPercentage < 0.8
artifacts: [server.log, c1.log, c2.log, world-diff]
