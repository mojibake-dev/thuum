# b-npc-death-engine (thuum-magnus, 2026-10-27; train 52, ADR-050 decision 2, docs/verbs/npc-fate.md): the host
# kills its own hosted NPC and the death is the engine's, from the server's number. Promoted unchanged from
# x-npc-death-host v5 (GREEN 20261027-095847 on 52's stage of fork m3-npc-death cc1d9025; the id and this header
# changed, steps and claims byte for byte). The host approaches Sven in his record's frame and holds him still
# there (the host's npc-ai lever, read by an aiEnabled assert; 52's gate 20261027-140805: under the combat hold
# he fought c1 and moved, and the one swing before the one-number read missed where the stage's 123746 had
# landed, so a swing on a combatant is luck; then his AI back and his combat with c1 started for the swings that
# end him, since with his AI off the engine's death names no killer, the rest's 153601: "died of unknown ...,
# killer 0"), swings an iron sword up to three times for the one-number read (none of them lethal; the rest's
# rerun 155405 missed its single swing: an approach faces the RECORD, and the engine's 35-degree hit cone wants
# the body, so every approach is followed by look-at, head to head in c1's own game, b-npc-headshot-host's aim)
# and then the Daedric warhammer for the swings that end him: the one-number read after the measured swings
# (the engine's health on the host within 0.03 of the record), the death by either order (the server's number
# first with the kill waiting on the report, or the engine's kill move first with the report taken on the
# server's evidence), dead on the record and both seats, the bodies within 200 units on both axes.
id: b-npc-death-engine
milestone: M3
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
  npcEnabled: true
  gameHour: 7.9
timeout_s: 900
steps:
  - c1: connect
  - c2: connect
  - wait: 10
  - c1: close-menu {name: MessageBoxMenu}
  - c2: close-menu {name: MessageBoxMenu}
  - c1: server-console {name: TGM}
  - c2: server-console {name: TGM}
  - c2: teleport {cell: lab-spawn, x: 0, y: -300, z: 0, rot: [0, 0, 0]}
  - c1: teleport {cell: "3c:Skyrim.esm", x: 17225, y: -47204, z: -128, rot: [0, 0, 0]}
  - wait: 20
  - assert:
      - server.host(0x9732).hosted == true
      - server.host(0x9732).client == "c1"
  - c2: teleport {cell: "3c:Skyrim.esm", x: 17375, y: -47204, z: -128, rot: [0, 0, 180]}
  - wait: 20
  - c1: npc-state {formId: 0x13491}
  - c2: npc-state {formId: 0x13491}
  - assert:
      - server.host(0x9732).client == "c1"
      - c1.npc_state(0x13491).aiEnabled == true
      - c2.npc_state(0x13491).aiEnabled == false
      - server.ref(0x13491).isDead == false
  - c1: give {item: "Skyrim.esm:IronSword", count: 1}
  # v6 (2026-10-27, after 095425: the hold took, six guest hits landed at 7 on Sven's 50 and he fled into his
  # house at 0.16, two hits short): a Daedric warhammer (WEAP 0x139ba, esm.py; 27 a hit), given and equipped
  # through the console as b-marksman arms its bow, so two landed hits end him before he turns
  - c1: console {text: "player.additem 139ba 1"}
  # the measured swings use the iron sword (WEAP 0x12eb7, esm.py; 7 a hit on his 50), so up to three can land
  # before the one-number read with none of them lethal, since a death under the still hold names no killer
  # (the rest's 153601); the warhammer is equipped for the kill legs below
  - c1: console {text: "player.equipitem 12eb7"}
  - wait: 2
  - c1: draw-weapon
  # v5 (2026-10-27, after 092536: the hold before the approach did not take with c1 at the landing, 3700 units
  # from Sven (start-combat answered inCombat false, no target), c2's swings after each judged teleport drew
  # the sheathed blade instead of striking (a teleport sheathes; zero hits of thirty), and Sven's package took
  # him into the inn, where a Tamriel-framed approach read his interior coordinates as world ones). So: the
  # host approaches him first, in the frame of his record (cell: record, wherever his package has him), starts
  # his combat there and reads the hold before anything else; every approach draws the weapon again before
  # the swings; the claims as they were
  - c1: approach {formId: 0x13491, distance: 150, cell: record}
  # 52's gate 20261027-140805: the combat hold kept him in reach but moving (he fought c1), and the one swing
  # before the one-number read missed where the stage's 123746 had landed; a swing on a combatant is luck, so
  # the still hold stands him for the first swing (x-npc-headshot-host v9's lever, the host's npc-ai off);
  # his AI comes back before the swings that end him (below) and the claims are as they were
  - c1: npc-ai {formId: 0x13491, enabled: false}
  - wait: 1
  - c1: npc-state {formId: 0x13491}
  - assert:
      - c1.npc_state(0x13491).aiEnabled == false
  - c1: approach {formId: 0x13491, distance: 110, cell: record}
  # the rest's rerun 155405: the single swing missed him standing still, since the approach faces his record
  # and the engine's hit cone (fCombatHitConeAngle, 35 degrees) wants the body; look-at aims head to head in
  # c1's own game (b-npc-headshot-host's aim), before the draw because the angle set sheathes
  - c1: look-at {formId: 0x13491}
  - c1: draw-weapon
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - wait: 1
  # the measured swings, then the one-number read: the engine's health on the host against the record
  - c1: npc-state {formId: 0x13491}
  - c2: npc-state {formId: 0x13491}
  - assert:
      - server.ref(0x13491).healthPercentage < 1
      - abs(c1.npc_state(0x13491).healthPercentage - server.ref(0x13491).healthPercentage) < 0.03
  # the kill legs under the combat hold: with his AI off the engine's death names no killer (52's gate's
  # rest, 20261027-153601: "13491 died of unknown ..., killer 0", the report claim read 0), so his AI
  # comes back and his combat with c1 starts before the swings that end him, as the stage's 123746 killed
  # him; the swings re-approach him, a moving target is theirs to find
  - c1: npc-ai {formId: 0x13491, enabled: true}
  - wait: 1
  - c1: start-combat {formId: 0x13491}
  - wait: 3
  - c1: npc-state {formId: 0x13491}
  - assert:
      - c1.npc_state(0x13491).inCombat == true
  # the warhammer (WEAP 0x139ba, 27 a hit) for the swings that end him, two landed hits
  - c1: console {text: "player.equipitem 139ba"}
  - wait: 1
  - c1: approach {formId: 0x13491, distance: 110, cell: record}
  - c1: look-at {formId: 0x13491}
  - c1: draw-weapon
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: approach {formId: 0x13491, distance: 110, cell: record}
  - c1: look-at {formId: 0x13491}
  - c1: draw-weapon
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: approach {formId: 0x13491, distance: 110, cell: record}
  - c1: look-at {formId: 0x13491}
  - c1: draw-weapon
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: approach {formId: 0x13491, distance: 110, cell: record}
  - c1: look-at {formId: 0x13491}
  - c1: draw-weapon
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - c1: hold-key {code: 199, ms: 120}
  - wait: 1
  - until: {within: 40, expect: [server.ref(0x13491).isDead == true]}
  - wait: 6
  - c1: npc-state {formId: 0x13491}
  - c2: npc-state {formId: 0x13491}
  - c1: log-count {pattern: "cause on 13491: health"}
  - c1: log-count {pattern: "death report: 13491 died"}
  - c1: screenshot
  - c2: screenshot
  - assert:
      - 'c1.log_count("cause on 13491: health") >= 2'
      # the death is the engine's: either the server's number reaches zero first and the kill waits on the
      # host's report (death pending), or the host's engine ends him first (a kill move at low health decides
      # before the damage) and the server takes the report on its own evidence; both are the design's
      # (ADR-050 decision 2, ADR-048 B; x-npc-death-host v3 091759 took the second path)
      - 'server.log_count("death pending on 13491") >= 1 or server.log_count("death report: 13491 died") >= 1'
      - 'server.log_count("death report: 13491 died .* killer ff000000") >= 1'
      - 'server.log_count("death by the server.s word on 13491") == 0'
      - server.ref(0x13491).isDead == true
      - c1.npc_state(0x13491).isDead == true
      - c2.npc_state(0x13491).isDead == true
      - abs(c1.npc_state(0x13491).x - c2.npc_state(0x13491).x) < 200
      - abs(c1.npc_state(0x13491).y - c2.npc_state(0x13491).y) < 200
  - c1: dump-state
  - c2: dump-state
artifacts: [server.log, c1.log, c2.log, screenshots]
