# M0 smoke: two clients connect, see each other, move, and survive a server restart.
# Assertions are evaluated by lab-api only (ADR-009). Edit the code, not this file.
# Client rollback is disk-only (no RAM snapshots with a passed-through GPU): stop,
# rollback, cold boot, autologon, scheduled task launches SKSE + lab-driver. Budget
# 90 to 120 s per client; the timeout below already covers it.
id: smoke-two-players
milestone: M0
clients: [c1, c2]
server:
  snapshot: clean
  netem: null            # M2+ scenarios set {delay_ms: 60, jitter_ms: 15, loss_pct: 0.5}
timeout_s: 600
steps:
  - c1: connect
  - c2: connect
  - c1: teleport {cell: lab-spawn, x: 0, y: 0, z: 0}
  - c2: teleport {cell: lab-spawn, x: 200, y: 0, z: 0}
  - wait: 5
  - c1: screenshot
  - assert:
      - server.actor(c2).cell == "lab-spawn"
      - c1.sees(c2) == true
      - c2.sees(c1) == true
  - c1: move {dx: 300, dy: 0, duration_s: 3}
  - wait: 3
  - assert:
      - abs(server.actor(c1).x - 300) < 50
      - abs(c2.view(c1).x - server.actor(c1).x) < 50
  - c1: give {item: "Skyrim.esm:IronSword", count: 1}   # server command, R0
  - assert:
      - server.inventory(c1).count("Skyrim.esm:IronSword") == 1
  - server: restart
  - wait: 20
  - c1: reconnect
  - c2: reconnect
  - assert:
      - abs(server.actor(c1).x - 300) < 50
      - server.inventory(c1).count("Skyrim.esm:IronSword") == 1
      - c2.sees(c1) == true
artifacts: [server.log, c1.log, c2.log, screenshots, world-diff, pcap]
