# GREEN 20261109-091807-b-container-rest on the 50 build (fork m4-train-50 4bd07f33), by path from lab/.cache/drafts/fifty
# (sha1 61b29016). v3, the claim rewrite Eli approved (2026-11-09 ~01:1x PST in numidium's session, option A; ADR-064 decision
# 4): the out-of-reach take is sent without the menu (the driver's inventory then transfer steps, a forged message), since
# Skyrim Souls RE, in main's mod layer since 11-04 (32459beb), closes a container menu past 400 units, inside the server's
# 524 reach (v2's reds 20261107-221540, 223516 and 223900). Committed alone (rule 13).
# b-container-rest v3 (drafted 2026-11-07 from the reds 20261107-221540, 223516 and 223900 on rung 4's stage, fork m4-scripts-4-rows
# 1acb834f; a step and premise change, every assertion as v2 wrote it): claim 2's take from afar is the driver's transfer (a Papyrus
# RemoveItem out of the chest, which the client's ContainersService sends as the menu's TakeItem), not R in an open menu. Since main's
# layer took Skyrim Souls RE 3.2.0 (32459beb, 2026-11-04; v1's last green 20261102-080532 and x-container-hold 20261104-003449 ran
# without it), its auto-close (SkyrimSoulsRE.ini [AUTOCLOSE] bAutoCloseMenus true, fAutoCloseDistance 400, the gap between the two
# bounding boxes; its AutoCloseManager::CheckAutoClose) shuts the ContainerMenu once the chest is 400 units off, inside the server's
# reach of 524: all three reds read c2's SkyrimSoulsRE.log "Closing ContainerMenu: Target moved out of range." and its console
# "onOpenContainerMesage - menu closed" 0.17 to 0.21 s after the teleport, the closing activation shutting the chest (the second
# "shut with 0 occupant"), so the tap of R met no menu and no TakeItem reached the server. A playing seat can no longer hold the menu
# open past the reach; the reach rule guards the forged message alone, and that is the take claim 2 now makes. Claim 3's close is
# the auto-close's (its close-menu kept, closing nothing, as in v1's green after R); its assertions read the same lines.
# b-container-rest v2 (thuum-cf, 2026-11-03; ADR-067 decisions 1 and 6, Eli's word: one occupant per container, no live view; fork
# m3-turbo3-sys2-container): claim 2 is rewritten from the shared view (two occupants, D52) to the hold: c2's activation while c1 is in
# the chest is REFUSED (the server's E_CONTAINER_BUSY line once, c2's ContainerMenu closed, c1's open), c1 closes (the first shut), c2
# opens alone and its take from afar is refused as before; claim 3's and 4's shut counts and claim 5's lid counts move by the one
# extra open and shut this adds (c2 hears four opens: claims 1, 2, 4 and 5). No other claim changed; the reach, the disconnect, the
# saved-open restart and the lids stand as v1 wrote them. v1 (thuum-magnus, drafted 2026-10-31 from x-container-rest 69f2ad68;
# docs/verbs/containers.md, M4's row; fork m4-containers-rest): the rest of the container row on two seats. The frame is x-shared-chest's (c1 hosts Bleak Falls Temple
# 0x371de, c2 beside), the subject the bandit camp's chest TreasBanditChest 0x371e9 at (-3420, 732, 575) (lab/esm.py cellrefs), a
# CONT with a lid. The server's lines: "[verb:containers] 371e9 open with N occupant(s)" and "371e9 shut with 0 occupant(s)" at
# SetOpen, "<player> released from 371e9 by its disconnect", "371e9 saved open came back shut at load", "E_CONTAINER_REACH: <player>
# takes 371e9" at a take from beyond the occupation reach; the client's: "container 371e9 lid Open played for the server's isOpen"
# and "lid Close played" on a change of the applied state. server.ref carries no open state, so the claims read the lines; the lids
# are in the screenshots. The lab's teleport is the server's; under Skyrim Souls RE the engine's menu closes at a landing more than
# 400 units off (v3), so the take from beyond the reach is the driver's transfer after a teleport of 100 units past the reach.
# Claims (the verb doc's Tests), each with what it proves:
# 1. c1 opens: its ContainerMenu, the server's "open with 1 occupant", no reach refusal, c2's "lid Open played" once within 3 s: the
#    open is the server's state and the watcher's engine plays it (R0 the state, the lid native from the property).
# 2. c2's E while c1 is in the chest is refused (ADR-067 decision 6): "E_CONTAINER_BUSY: <c2> activates 371e9 held by <c1>; refused"
#    once, c2's ContainerMenu closed, c1's still open, no "doesn't occupy" line; c1 closes ("shut with 0 occupant" once), c2 opens
#    alone ("open with 1 occupant" a second time); c2 moved 100 units past the reach (its menu shut there by the auto-close, v3)
#    takes one of the chest's gold without the menu (transfer, v3): the take is refused from beyond the reach (E_CONTAINER_REACH),
#    the chest's items stay.
# 3. c2's menu is closed (by the auto-close at claim 2's move, v3): the server's second "shut with 0 occupant" and c2's "lid Close
#    played": the lid follows the occupant out.
# 4. c1 opens and relaunches with its menu open: the disconnect releases it ("released from 371e9 by its disconnect"), the chest shuts,
#    c2's lid Close line again within 5 s.
# 5. c1 back and the chest open again, the server restarted (5 s after the open, past the save tick): "saved open came back shut at
#    load" once and no NEW "lid Open played" on either seat at the reconnect (a reconnect keeps the logs: c2's count stays at the
#    run's four opens, c1's at the one since its relaunch, the opener's game playing the line too; a shut chest at creation plays
#    nothing). The reloot's moment across a restart is the T0's (the lab has
#    no lever for a looted chest with a short reloot here); not claimed.
# Recorded, not claimed: both seats' screenshots at each lid state, both dumps. Assertions are evaluated by lab-api only (ADR-009).
# Its own commit (rule 13).
id: b-container-rest
milestone: M4
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
  npcEnabled: false
  gameHour: 7.9
timeout_s: 900
steps:
  - c1: connect
  - c2: connect
  - wait: 10
  - c1: close-menu {name: MessageBoxMenu}
  - c2: close-menu {name: MessageBoxMenu}
  - c1: server-console {name: TGM}
  - c2: server-console {name: TGM}
  # the chest holds something to take (its leveled list may roll nothing): ten gold into its server inventory by the console's
  # AddItem on the reference, so the take from afar has a move to refuse
  - c1: server-console {name: AddItem, args: [0x371e9, 0xf, 10]}
  # the chest is a Novice lock in the game files, which the locks verb stands since parity 487e1262 (2026-11-01): the activation
  # below met E_ACTIVATE_LOCKED and the Lockpicking Menu instead of the open (20261101-171504), so the premise unlocks it first
  # through the server's console, as b-locks' claim 2 does; the lock itself is b-locks' claim, not this scenario's
  - c1: server-console {name: Unlock, args: [0x371e9]}
  - wait: 2
  - c1: teleport {cell: "371de:Skyrim.esm", x: -4200, y: 850, z: 650, rot: [0, 0, 90]}
  - wait: 20
  - c2: teleport {cell: "371de:Skyrim.esm", x: -4100, y: 850, z: 650, rot: [0, 0, 90]}
  - wait: 20
  - assert:
      - server.host(0x371de).client == "c1"
  # the chest's spot by teleport, not approach: approach reads its target through the driver's npc-state, an actor's read, so a
  # container has no position for it (x-lockpick 20261031-134255, E_RUN_APPROACH); these are the numbers approach would have
  # computed from the landing spots: 90 and 110 units from TreasBanditChest 0x371e9 at (-3420, 732, 575) on each seat's line to
  # it, facing it (the engine's angle Z, 0 north, clockwise)
  - c1: teleport {cell: "371de:Skyrim.esm", x: -3509.0, y: 745.5, z: 575, rot: [0, 0, 98.6]}
  - c2: teleport {cell: "371de:Skyrim.esm", x: -3528.4, y: 750.8, z: 575, rot: [0, 0, 99.8]}
  - wait: 3
  # 1. the host opens; the watcher's lid
  - c1: activate {refId: 0x371e9}
  - wait: 3
  - c2: screenshot
  - c1: screenshot
  - c2: log-count {pattern: "container 371e9 lid Open played"}
  - assert:
      - 'c1.state.menuOpen("ContainerMenu") == true'
      - 'server.log_count("371e9 open with 1 occupant") == 1'
      - 'server.log_count("E_ACTIVATE_REACH") == 0'
      - 'c2.log_count("container 371e9 lid Open played") == 1'
  # 2. the hold: c2's activation refused while c1 is in the chest; c1 closes; c2 opens alone; then the move and the take from afar
  - c2: activate {refId: 0x371e9}
  - wait: 3
  - c2: dump-state
  - c1: dump-state
  - c2: screenshot
  - assert:
      - 'server.log_count("E_CONTAINER_BUSY: ff[0-9a-f]+ activates 371e9 held by ff[0-9a-f]+; refused") == 1'
      - 'c2.state.menuOpen("ContainerMenu") == false'
      - 'c1.state.menuOpen("ContainerMenu") == true'
      - 'server.log_count("371e9 open with 1 occupant") == 1'
      - 'server.log_count("doesn.t occupy") == 0'
  - c1: close-menu {name: ContainerMenu}
  - wait: 3
  - assert:
      - 'server.log_count("371e9 shut with 0 occupant") == 1'
  - c2: activate {refId: 0x371e9}
  - wait: 3
  - c2: dump-state
  - assert:
      - 'c2.state.menuOpen("ContainerMenu") == true'
      - 'server.log_count("371e9 open with 1 occupant") == 2'
      - 'server.log_count("doesn.t occupy") == 0'
  # v3: the move past the reach; Skyrim Souls RE's auto-close shuts c2's menu at the landing and the closing activation releases
  # the hold. Then the take from afar without the menu (the forged message's path, the reach check before the occupant's), c2's
  # own copy of the chest read first (recorded, not claimed)
  - c2: teleport {cell: "371de:Skyrim.esm", x: -4200, y: 850, z: 650, rot: [0, 0, 90]}
  - wait: 2
  - c2: inventory {ref: 0x371e9}
  - c2: transfer {from: 0x371e9, item: 0xf, count: 1}
  - wait: 3
  - c2: screenshot
  - c1: screenshot
  - c2: dump-state
  - assert:
      - 'server.log_count("E_CONTAINER_REACH: ff[0-9a-f]+ takes 371e9") >= 1'
  # 3. c2's menu closed (the auto-close at claim 2's move, v3; this close-menu closes nothing): the lid follows the occupant out
  - c2: close-menu {name: ContainerMenu}
  - wait: 3
  - c2: log-count {pattern: "container 371e9 lid Close played"}
  - c2: screenshot
  - assert:
      - 'server.log_count("371e9 shut with 0 occupant") >= 2'
      - 'c2.log_count("container 371e9 lid Close played") >= 2'
  # 4. the host's disconnect with its menu open releases it; the watcher's lid shuts again
  - c1: teleport {cell: "371de:Skyrim.esm", x: -3509.0, y: 745.5, z: 575, rot: [0, 0, 98.6]}
  - wait: 2
  - c1: activate {refId: 0x371e9}
  - wait: 3
  - assert:
      - 'c1.state.menuOpen("ContainerMenu") == true'
      - 'server.log_count("371e9 open with 1 occupant") == 3'
  - c1: relaunch {until: gone}
  - until: {within: 15, every: 1, expect: ['server.log_count("released from 371e9 by its disconnect") >= 1']}
  - wait: 5
  - c2: log-count {pattern: "container 371e9 lid Close played"}
  - c2: screenshot
  - assert:
      - 'server.log_count("371e9 shut with 0 occupant") >= 3'
      - 'c2.log_count("container 371e9 lid Close played") >= 3'
  # 5. the restart with the chest open
  - c1: connect
  - wait: 10
  - c1: close-menu {name: MessageBoxMenu}
  - c1: server-console {name: TGM}
  - c1: teleport {cell: "371de:Skyrim.esm", x: -3509.0, y: 745.5, z: 575, rot: [0, 0, 98.6]}
  - wait: 3
  - c1: activate {refId: 0x371e9}
  - wait: 3
  - assert:
      - 'c1.state.menuOpen("ContainerMenu") == true'
  # the lid counts before the restart (a reconnect keeps both seats' logs, so the claim after it is "no new line"); the open saved
  # before the restart (the save storage ticks every server tick, the write is asynchronous)
  - c1: log-count {pattern: "container 371e9 lid Open played"}
  - c2: log-count {pattern: "container 371e9 lid Open played"}
  - wait: 5
  - server: restart
  - wait: 20
  - c1: reconnect
  - c2: reconnect
  - wait: 15
  - c1: close-menu {name: MessageBoxMenu}
  - c2: close-menu {name: MessageBoxMenu}
  - c1: log-count {pattern: "container 371e9 lid Open played"}
  - c2: log-count {pattern: "container 371e9 lid Open played"}
  - c1: screenshot
  - c2: screenshot
  - assert:
      - 'server.log_count("371e9 saved open came back shut at load") == 1'
      # no new lid Open on either seat at the reconnect: c2 heard four opens (claims 1, 2, 4 and 5's: under the hold claim 2's c2 opens a
      # shut chest after c1's close, so isOpen changes and its own game plays the line, the opener's game running the apply too; under
      # v1's shared view the second occupant joined an open chest and played nothing, x-container-rest v4 195055) and c1 one since its
      # relaunch (claim 5's own); one more would be the saved-open chest playing at creation
      - 'c2.log_count("container 371e9 lid Open played") == 4'
      - 'c1.log_count("container 371e9 lid Open played") == 1'
  - c1: dump-state
  - c2: dump-state
artifacts: [server.log, c1.log, c2.log, screenshots]
