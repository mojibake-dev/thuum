# b-cell-host (M3, docs/verbs/cell-host.md, ADR-035): one player's game runs
# a cell's NPCs and the server decides which. The cell is Tamriel (30,-20),
# 0x9810, two squares east of the hunters' camp flat (b-figure-values'
# ground): its placed creature is the leveled forest predator ACHR 0x85547
# (LvlAnimalForestPredator, Skyrim.esm, at (123592, -80301, 10705)), which
# the server spawns under npcEnabled (a creature passes AttachEspmRecord's
# filters; docs/research/m3/skymp-hosting.md). c1 arrives first: it hosts
# the cell at epoch 1 (server.host(cell), lab-api's fact from the gamemode's
# labState cellHost). c2 arrives beside it: still c1. c1 teleports two cells
# east (out of its 3x3 reach while its game still has the cell loaded) and
# back inside the grace: still c1, epoch 1 (the grace disarmed; a teleport
# step returns about 3.2 s after it starts, when the record has landed, so
# the away time is that landing plus the half-second wait between, about
# 3.7 s against the 5 s grace: run 20261021-192314 waited 3 s there, was
# away 6.3 s, 19:25:16.6 to 19:25:22.9, and c2 rightly took the cell at
# epoch 2). c1 away for 8 s:
# the grace runs out, c2 hosts at epoch 2 and c1's game logs the release.
# c2's game relaunches with c1 still away: the cell goes unhosted at the
# kept epoch (the disconnect's path); the relaunched game logs in where it
# stood and takes the cell at epoch 3; c2 out of reach too: nobody has it
# and the predator's record (server.ref), snapshotted after the last host
# left, does not move over 10 s, the freeze. c1 back: epoch 4. A server
# restart and both reconnecting: a grant within 10 s,
# at epoch 1 again (the table is in memory). Both teleport in from outside
# in one step: one grant. The npcEnabled setting is the run's own (ADR-035
# point 9: lab-api's server.npcEnabled overlay on the version's settings).
id: b-cell-host
milestone: M3
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
  npcEnabled: true
timeout_s: 900
steps:
  - c1: connect
  - c2: connect
  - wait: 10
  # god mode on both seats (the server's, as x-npc-cleaner-hold has it):
  # under npc-puppet the host runs the predators' AI live and their hits
  # land, and the cell's second predator killed c2 1.6 s after it arrived
  # (b-npc-puppet's sibling run 20261022-081903: 129.92 unarmed damage, a
  # power attack at the race's number); a dead player's loaded set unloads
  # at the respawn, so step 17's handoff found no second loader. The
  # measurement here is the hosting, not survival
  - c1: console {text: "tgm"}
  - c2: console {text: "tgm"}
  # c2 far away first, so c1 is the first loader
  - c2: teleport {cell: lab-spawn, x: 0, y: -300, z: 0, rot: [0, 0, 0]}
  - c1: teleport {cell: lab-spawn, x: -10457, y: -19170, z: -3957, rot: [0, 0, 0]}
  - wait: 15
  - assert:
      - server.host(0x9810).hosted == true
      - server.host(0x9810).client == "c1"
      - server.host(0x9810).epoch == 1
  # c2 beside c1: a hosted cell gives it nothing
  - c2: teleport {cell: lab-spawn, x: -10457, y: -19020, z: -3957, rot: [0, 0, 180]}
  - wait: 15
  - assert:
      - server.host(0x9810).client == "c1"
      - server.host(0x9810).epoch == 1
  # two cells east and back inside the grace: still c1 (the away time is the
  # second teleport's own 3.2 s landing plus this wait)
  - c1: teleport {cell: lab-spawn, x: -2265, y: -19170, z: -3957, rot: [0, 0, 0]}
  - wait: 0.5
  - c1: teleport {cell: lab-spawn, x: -10457, y: -19170, z: -3957, rot: [0, 0, 0]}
  - wait: 4
  - assert:
      - server.host(0x9810).client == "c1"
      - server.host(0x9810).epoch == 1
  # away past the grace: c2 takes it at epoch 2, c1's game is told
  - c1: teleport {cell: lab-spawn, x: -2265, y: -19170, z: -3957, rot: [0, 0, 0]}
  - wait: 8
  - assert:
      - server.host(0x9810).client == "c2"
      - server.host(0x9810).epoch == 2
  - c1: console {text: "getglobalvalue gamehour", match: "released cell 9810"}
  - assert:
      - c1.printed("released cell 9810")
  # the host's game gone (the relaunch step returns once c2 is off the
  # online list; its game is back about 14 s later): the grace runs out with
  # nobody in reach, unhosted at the kept epoch (run 194846 showed it in
  # server.log at 19:51:35.8 and the returning game took epoch 3 before the
  # old step could look)
  - c2: relaunch {until: gone}
  - wait: 6
  - assert:
      - server.host(0x9810).hosted == false
      - server.host(0x9810).epoch == 2
  # the relaunched game logs in where it stood and takes the cell again
  - c2: connect
  - wait: 8
  - assert:
      - server.host(0x9810).client == "c2"
      - server.host(0x9810).epoch == 3
  # c2 out of reach too: nobody has the cell, and its record, snapshotted
  # after the last host left it, stands still
  - c2: teleport {cell: lab-spawn, x: 0, y: -450, z: 0, rot: [0, 0, 0]}
  - wait: 7
  - server: snapshot {name: predator, of: "server.ref(0x85547)"}
  - assert:
      - server.host(0x9810).hosted == false
      - server.host(0x9810).epoch == 3
  - wait: 10
  - assert:
      - server.host(0x9810).hosted == false
      - server.ref(0x85547).x == snapshot("predator").x
      - server.ref(0x85547).y == snapshot("predator").y
  # c1 back: the next epoch
  - c1: teleport {cell: lab-spawn, x: -10457, y: -19170, z: -3957, rot: [0, 0, 0]}
  - wait: 15
  - assert:
      - server.host(0x9810).client == "c1"
      - server.host(0x9810).epoch == 4
  # a restart: the table starts over, a grant within 10 s of the reconnects
  - server: restart
  - wait: 20
  - c1: reconnect
  - c2: reconnect
  - wait: 10
  - assert:
      - server.host(0x9810).hosted == true
      - server.host(0x9810).epoch == 1
  # both in from outside in one step: one grant
  - c1: teleport {cell: lab-spawn, x: 0, y: -300, z: 0, rot: [0, 0, 0]}
  - c2: teleport {cell: lab-spawn, x: 0, y: -450, z: 0, rot: [0, 0, 0]}
  - wait: 10
  - c1: teleport {cell: lab-spawn, x: -10457, y: -19170, z: -3957, rot: [0, 0, 0]}
  - c2: teleport {cell: lab-spawn, x: -10457, y: -19020, z: -3957, rot: [0, 0, 180]}
  - wait: 15
  - assert:
      - server.host(0x9810).hosted == true
      - server.host(0x9810).epoch == 2
  - c1: dump-state
  - c2: dump-state
artifacts: [server.log, c1.log, c2.log, screenshots]
