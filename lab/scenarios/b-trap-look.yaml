  # RECORDED, all before the claims
  - c1: log-count {pattern: "its firing seat.s look, queued .D-W2."}
  - c2: log-count {pattern: "its firing seat.s look, queued .D-W2."}
  - server: log-count {pattern: "E_SCRIPTCALL_[A-Z_]+"}
  - c1: dump-state
  - c2: dump-state
  - assert:
      # B1: c2's own alarm fired (the premise) and its four looks were reported; c1 ignored the figure, fired
      # nothing of its own, and played all four
      - 'snapshot("B1Own") > snapshot("B1Own0")'
      - 'snapshot("B1RepSetMotionType") > snapshot("B1Rep0SetMotionType")'
      - 'snapshot("B1PlaySetMotionType") > snapshot("B1Play0SetMotionType")'
      - 'snapshot("B1RepApplyHavokImpulse") > snapshot("B1Rep0ApplyHavokImpulse")'
      - 'snapshot("B1PlayApplyHavokImpulse") > snapshot("B1Play0ApplyHavokImpulse")'
      - 'snapshot("B1RepPlayAnimation") > snapshot("B1Rep0PlayAnimation")'
      - 'snapshot("B1PlayPlayAnimation") > snapshot("B1Play0PlayAnimation")'
      - 'snapshot("B1RepSound") > snapshot("B1Rep0Sound")'
      - 'snapshot("B1PlaySound") > snapshot("B1Play0Sound")'
      - 'snapshot("B1WatcherOwn") == snapshot("B1WatcherOwn0")'
      # (v1.2) c1's gate line for the figure, or two or more of its lines spent before B1 (x-trigger-owner v2.4's escape)
      - 'snapshot("B1Gate") > snapshot("B1Gate0") or snapshot("B1GateAll0") >= 2'
      # B2: c1's own alarm fired (the premise); as the cell's host its PlayAnimation went out as an action (the
      # server's 'animates' line, the code review's note 4) and its three other calls as looks; c2 ignored the
      # figure, fired nothing of its own, and played the three looks
      - 'snapshot("B2Own") > snapshot("B2Own0")'
      - 'snapshot("B2RepSetMotionType") > snapshot("B2Rep0SetMotionType")'
      - 'snapshot("B2PlaySetMotionType") > snapshot("B2Play0SetMotionType")'
      - 'snapshot("B2RepApplyHavokImpulse") > snapshot("B2Rep0ApplyHavokImpulse")'
      - 'snapshot("B2PlayApplyHavokImpulse") > snapshot("B2Play0ApplyHavokImpulse")'
      - 'snapshot("B2Anim") > snapshot("B2Anim0")'
      - 'snapshot("B2RepSound") > snapshot("B2Rep0Sound")'
      - 'snapshot("B2PlaySound") > snapshot("B2Play0Sound")'
      - 'snapshot("B2WatcherOwn") == snapshot("B2WatcherOwn0")'
      # (v1.2) c2's gate line for the figure, or two or more of its lines spent before B2
      - 'snapshot("B2Gate") > snapshot("B2Gate0") or snapshot("B2GateAll0") >= 2'
      - 'server.log_count("claims prop 1048(1e|1f) by touch") == 0'
      - 'server.log_count("E_SCRIPTCALL_(OWNER|FAR|ROW): ff00000[01] reports [A-Za-z]+.[A-Za-z]+ on (1048(1e|1f))") == 0'
      # the wire: c1's own player fired it on c1 (the host) once; c2 played the root once and its own copy fired nothing; the
      # host's root relayed once; c1's rope look reported and played on c2; both ropes dropped; the rocks c1's; no prop wire
      - 'snapshot("wireH0c1") == 0'
      - 'snapshot("wireH0c2") == 0'
      - 'c1.log_count("trap b6d3e fired here by b6d3f: the presser.s owner.s firing") == 1'
      - 'c2.log_count("trap b6d3e fired here by b6d3f: the presser.s owner.s firing") == 0'
      - 'c2.log_count("trap b6d3e fired here by b6d3f: the relay.s own play") == 1'
      - 'server.log_count("b6d3f activates b6d3e in cell b6be6 .its host ff000000 reports.: relayed to 1 game.s.") == 1'
      - 'c1.log_count("trigger look b6d3f ObjectReference.SetMotionType reported .D-W2.") >= 1'
      - 'c2.log_count("trigger look b6d3f ObjectReference.SetMotionType played here") >= 1'
      - 'c1.node_rotation(0xb6d3f, "RopeBreakPoint01", "after").angle_to(c1.node_rotation(0xb6d3f, "RopeBreakPoint01", "before")) > 20'
      - 'c2.node_rotation(0xb6d3f, "RopeBreakPoint01", "after").angle_to(c2.node_rotation(0xb6d3f, "RopeBreakPoint01", "before")) > 20'
      - 'server.log_count("ff000000 claims prop b6d4[589abcd] by touch 3: granted") >= 7'
      - 'server.log_count("claims prop b6d3f by touch") == 0'
      - 'server.log_count("E_SCRIPTCALL_(OWNER|FAR|LOOK_RATE|ROW): ff00000[01] reports [A-Za-z]+.[A-Za-z]+ on b6d3f") == 0'
      # TA: c2's plate look reported; c1 played its Down and then its Up through the look
      - 'snapshot("TARep") > snapshot("TARep0")'
      - 'snapshot("TADown") > snapshot("TADown0")'
      - 'snapshot("TAUp") > snapshot("TAUp0")'
      - 'snapshot("TAPlay") > snapshot("TAPlay0")'
      # TB: c1, the cell's host, pressed: its PlayAnimation calls went out as actions (the server's 'animates'
      # lines, the code review's note 4); c2 played its Down and then its Up
      - 'snapshot("TBAnimDown") > snapshot("TBAnimDown0")'
      - 'snapshot("TBAnimUp") > snapshot("TBAnimUp0")'
      - 'snapshot("TBDown") > snapshot("TBDown0")'
      - 'snapshot("TBUp") > snapshot("TBUp0")'
