# b-weather (thuum-magnus, 2026-10-31, from x-weather v2 9f7c2cfd's read, run 20261031-171309 GREEN on m4-weather a1c203df; docs/verbs/weather.md, M4; fork m4-weather): one sky
# per worldspace, the server's. The server pools the game files' weather regions per worldspace (REGN's RDWT lists; the lab's deploy
# settings pin a pool of two over Tamriel, SkyrimClear 0x81a and SkyrimCloudy 0x12f89, with a slot of ten game minutes: 30 s real at
# the clock's scale of 20) and draws each slot's weather from a chain seeded by the worldspace and the slot (splitmix64 over the seed,
# never repeating the previous when the pool has two), so the pick is the clock's and a restart keeps it. Each seat hears SetWeather
# 66 (a cut at its login, a transition at a slot's turn, a release in an interior) and forces it (weatherService: Weather.setActive);
# the lab reads the engine's sky with the `weather {read: true}` step as c.weather(): current, outgoing, transition (lab-api's weather
# fact, thuum main 8be1fbdd). The server's lines: "[verb:weather] user U hears W for P slot S (cut|transition|release)"; the client's:
# "weather applied W to P (cut|transition, ...)", "weather released in P".
# Claims (the verb doc's Tests), each with what it proves:
# 1. Both seats at lab-spawn read the same current weather within 8 s of the login's word, one of the pool's two: the login cut
#    reaches both and the engine holds it (R0 the pick, the apply native).
# 2. After a slot's turn (the server's transition word to both, within 45 s), both seats read the same current weather within 10 s of
#    it and the server's words name a transition twice: one change, two skies alike.
# 3. c1 in Bleak Falls Temple reads a release (the interior's own sky, the engine's) and, back outside, the same weather as c2 again
#    within 10 s: the override is released indoors and re-imposed outdoors.
# 3b. c1 at Riverwood (another exterior cell of Tamriel) reads the same sky as c2 with no release: the override survives a cell
#    change inside the worldspace (weather.md's Impose hypothesis, unread by x-weather, whose seats never left lab-spawn's cell).
# 3c. A drift forced on c1's engine alone (the driver's weather step forces SkyrimOvercastRain 0xc821f, accelerated) is re-forced to
#    the server's word within 10 s, once, and c1 reads c2's sky again: the client leaves a blend alone and re-forces only a settled
#    drift (weather.md's Impose hypothesis; x-weather saw no drift, so its re-force path never ran).
# 4. c2 relaunched reads c1's weather after its login: a late joiner gets the current sky, not a roll of its own.
# 5. After a server restart both seats read the same weather again, one of the pool: the pick is the slot's and no seat rolled. The
#    lab's restart re-pins the hour (runner.py writes the clock's epoch anew for server.gameHour), so the slot rewinds and the sky
#    before the restart need not be the sky after it (x-weather 171309: slot 201 before, 192 after); the slot's determinism is the
#    rule's T0.
# Each equality is read outgoing-aware: the two seats' reads sit 1 to 3 s apart and a slot turns every 30 s, so a read that
# straddles a turn shows one seat's new sky as the other's outgoing one (the reviewer's note on the draft, 2026-10-31).
# Recorded, not claimed: both seats' screenshots at each read, the transition's progress (the blend's length is the engine's), both
# dumps. Assertions are evaluated by lab-api only (ADR-009). Its own commit (rule 13).
id: b-weather
milestone: M4
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
  npcEnabled: false
  gameHour: 7.9
timeout_s: 900
steps:
  - c1: connect
  - c2: connect
  - wait: 12
  - c1: close-menu {name: MessageBoxMenu}
  - c2: close-menu {name: MessageBoxMenu}
  - c1: teleport {cell: lab-spawn, x: 0, y: 0, z: 0, rot: [0, 0, 0]}
  # c2 south of the origin on the summit's strip (east of it is an edge, docs/LAB.md's summit note; x-skill-use v1 to v3 fell north)
  - c2: teleport {cell: lab-spawn, x: 0, y: -120, z: 0, rot: [0, 0, 0]}
  - wait: 8
  # 1. the login's cut on both
  - c1: weather {read: true}
  - c2: weather {read: true}
  - c1: screenshot
  - c2: screenshot
  - c1: log-count {pattern: "weather applied"}
  - c2: log-count {pattern: "weather applied"}
  - assert:
      - 'c1.log_count("weather applied") >= 1'
      - 'c2.log_count("weather applied") >= 1'
      - 'server.log_count("verb:weather. user [0-9]+ hears .* \\(cut\\)") >= 2'
      # the two reads sit 1 to 3 s apart and a slot turns every 30 s: a seat read mid-blend names the previous sky as outgoing
      - c1.weather().current == c2.weather().current or c1.weather().current == c2.weather().outgoing or c1.weather().outgoing == c2.weather().current
      - c1.weather().current == 0x81a or c1.weather().current == 0x12f89
  # 2. the slot turns within 45 s; both seats read the same sky within 10 s of the server's word
  - until: {within: 45, every: 1, expect: ['server.log_count("verb:weather. user [0-9]+ hears .*transition") >= 2']}
  - wait: 10
  - c1: weather {read: true}
  - c2: weather {read: true}
  - c1: screenshot
  - c2: screenshot
  - c1: log-count {pattern: "weather applied .*transition"}
  - c2: log-count {pattern: "weather applied .*transition"}
  - assert:
      - 'c1.log_count("weather applied .*transition") >= 1'
      - 'c2.log_count("weather applied .*transition") >= 1'
      # the two reads sit 1 to 3 s apart and a slot turns every 30 s: a seat read mid-blend names the previous sky as outgoing
      - c1.weather().current == c2.weather().current or c1.weather().current == c2.weather().outgoing or c1.weather().outgoing == c2.weather().current
      - c1.weather().current == 0x81a or c1.weather().current == 0x12f89
  # 3. an interior releases the override; the way out re-imposes the sky
  - c1: teleport {cell: "371de:Skyrim.esm", x: -4200, y: 850, z: 650, rot: [0, 0, 90]}
  - wait: 15
  - c1: log-count {pattern: "weather released"}
  - c1: weather {read: true}
  - c1: screenshot
  - assert:
      - 'c1.log_count("weather released") >= 1'
      - 'server.log_count("verb:weather. user [0-9]+ hears 0 for 371de") >= 1'
  - c1: teleport {cell: lab-spawn, x: 0, y: 0, z: 0, rot: [0, 0, 0]}
  - wait: 10
  - c1: log-count {pattern: "weather applied .*cut"}
  - c1: weather {read: true}
  - c2: weather {read: true}
  - c1: screenshot
  - assert:
      - 'c1.log_count("weather applied .*cut") >= 2'
      # the two reads sit 1 to 3 s apart and a slot turns every 30 s: a seat read mid-blend names the previous sky as outgoing
      - c1.weather().current == c2.weather().current or c1.weather().current == c2.weather().outgoing or c1.weather().outgoing == c2.weather().current
  # 3b. another exterior cell of the same worldspace keeps the override: no release, the same sky as c2
  - c1: teleport {cell: "3c:Skyrim.esm", x: 17225, y: -47204, z: -128, rot: [0, 0, 0]}
  - wait: 10
  - c1: log-count {pattern: "weather released"}
  - c1: weather {read: true}
  - c2: weather {read: true}
  - c1: screenshot
  - assert:
      - 'c1.log_count("weather released") == 1'
      # the two reads sit 1 to 3 s apart and a slot turns every 30 s: a seat read mid-blend names the previous sky as outgoing
      - c1.weather().current == c2.weather().current or c1.weather().current == c2.weather().outgoing or c1.weather().outgoing == c2.weather().current
  - c1: teleport {cell: lab-spawn, x: 0, y: 0, z: 0, rot: [0, 0, 0]}
  - wait: 5
  # 3c. a drift on c1's engine alone (SkyrimOvercastRain 0xc821f forced by the lab, accelerated) is re-forced to the server's word
  #     once the blend settles; the sky matches c2's again
  - c1: weather {form: 0xc821f}
  - wait: 10
  - c1: log-count {pattern: "weather applied .*re-applied 1"}
  - c1: weather {read: true}
  - c2: weather {read: true}
  - c1: screenshot
  - assert:
      - 'c1.log_count("weather applied .*re-applied 1") == 1'
      # the two reads sit 1 to 3 s apart and a slot turns every 30 s: a seat read mid-blend names the previous sky as outgoing
      - c1.weather().current == c2.weather().current or c1.weather().current == c2.weather().outgoing or c1.weather().outgoing == c2.weather().current
  # 4. a relaunched seat reads the sky at its login
  - c2: relaunch {until: gone}
  - c2: connect
  - wait: 15
  - c2: close-menu {name: MessageBoxMenu}
  - c1: weather {read: true}
  - c2: weather {read: true}
  - c2: screenshot
  - assert:
      - c2.weather().current == c1.weather().current or c2.weather().current == c1.weather().outgoing or c2.weather().outgoing == c1.weather().current
  # 5. a restart keeps the sky: the pick is the clock's
  - server: restart
  - wait: 25
  - c1: reconnect
  - c2: reconnect
  - wait: 15
  - c1: close-menu {name: MessageBoxMenu}
  - c2: close-menu {name: MessageBoxMenu}
  - c1: weather {read: true}
  - c2: weather {read: true}
  - c1: screenshot
  - c2: screenshot
  - c1: dump-state
  - c2: dump-state
  - assert:
      # the two reads sit 1 to 3 s apart and a slot turns every 30 s: a seat read mid-blend names the previous sky as outgoing
      - c1.weather().current == c2.weather().current or c1.weather().current == c2.weather().outgoing or c1.weather().outgoing == c2.weather().current
      - c1.weather().current == 0x81a or c1.weather().current == 0x12f89
artifacts: [server.log, c1.log, c2.log, screenshots]
