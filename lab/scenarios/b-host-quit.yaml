# b-host-quit (M3, docs/verbs/cell-host.md, the quitting-host row, ADR-047 D12 B;
# 2026-10-24): a host that quits through the game's own quit hands its village over at
# the grace, not at the stale rule's 9 s or the timeout's 24. Skyrim Platform thunks
# WinMain's one call to the engine's shutdown routine (every quit, the menus', Alt-F4's
# and the console's, stores Main::quitGame and passes there on the main thread with the
# network thread alive) and tears the client down first, so the disconnect datagram goes
# out before the engine's teardown and the server's leave is logged at once. Two seats
# under npcEnabled at Riverwood's landing, c1 hosting 0x9732 and c2 beside it; c1 quits
# through its console (the driver's detached `quit`: QuitGame, the same byte store), and
# the claims: the server's "user N left" line within 6 s of the quit step (the step returns
# before the driver types qqq and Enter, 0.2 to 1 s; the stale rule writes "silent ... stale"
# and never "left", so the line is the disconnect's), then 0x9732 c2's within 12 s (the
# leave, the 5 s grace, c2's load and the tick; the stale rule's pass lands at 9 to 10 s
# after the quit itself), Alvor live on c2, and the relaunched c1 back where it stood
# without taking the village from a live host. Measured as x-host-quit v4 20261025-012653
# and x-host-quit-plain 20261025-013410 on train-44 6cdc2b35: the leave line 1.2 s after
# the quit step, the grant 5.0 s after that, c1 online 27.1 s after its relaunch, both
# runs the same numbers (the first under the quit-path trace, the second without Frida).
# Known beside the claims: on 44 the game crashes inside its own teardown after the
# disconnect at every console quit tested (3 of 3), the server side whole; the read of
# that crash is cell-host.md's. Its own commit (rule 13).
id: b-host-quit
milestone: M3
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
  npcEnabled: true
  gameHour: 7.9
timeout_s: 600
steps:
  - c1: connect
  - c2: connect
  - wait: 10
  - c2: teleport {cell: lab-spawn, x: 0, y: -300, z: 0, rot: [0, 0, 0]}
  - c1: teleport {cell: "3c:Skyrim.esm", x: 17225, y: -47204, z: -128, rot: [0, 0, 0]}
  - wait: 25
  - assert:
      - server.host(0x9732).client == "c1"
  # the second seat arrives and stays: the candidate for the pass
  - c2: teleport {cell: "3c:Skyrim.esm", x: 17375, y: -47204, z: -128, rot: [0, 0, 180]}
  - wait: 20
  - assert:
      - server.host(0x9732).client == "c1"
  # the quit: the console's QuitGame, the byte every quit stores. numidium: the driver's quit (it types qqq), not
  # console {text: "qqq"}: the console step answers after the console's read and the game exits at the Enter, so it
  # would hang to its timeout and time the until below from there; quit answers first, then types
  - c1: quit
  # v2 (after 20261025-004815): the pass waits the 5 s grace after the leave (CellHostTest,
  # b-host-kill's 4.4 + 5), so the grant cannot come inside 4 s even with an instant leave; 8 s
  # holds a leave within a second plus the grace and c2's load, where the stale rule's pass
  # lands at 9 to 10 s. The leave's own timing is read from server.log's "user N left" line
  # against the quit step until a server-log fact exists.
  # v4: the leave itself, the claim D12-B makes: the server's "user N left" line within 6 s of
  # the quit step (numidium's server log-count fact, live in an until; the quit step returns
  # BEFORE the driver opens the console and types qqq and Enter, 0.2 to 1 s in 012653, then the
  # leave came about 5 ms after the quit flag once the seat's clock offset of 3.42 s was taken
  # out (the pcap: c1's netcode Disconnect datagram 0.2 ms before the server's "left" line);
  # the stale rule never writes "left", only "silent ... stale", so the line is the disconnect's);
  # then the grant at the grace: typing 1 + leave 0 + grace 5 + c2's load and the tick, about
  # 8.5 to 9.5 s after the step, inside 12 (numidium's number)
  - until: {within: 6, expect: ['server.log_count("user [0-9]+ left") >= 1']}
  - until: {within: 12, expect: [server.host(0x9732).client == "c2"]}
  - c2: npc-state {formId: 0x13482}
  - assert:
      - server.host(0x9732).client == "c2"
      - c2.npc_state(0x13482).aiEnabled == true
  # the quit seat comes back where it stood and must not take the village back
  - c1: relaunch {until: gone}
  - c1: connect
  - wait: 15
  - assert:
      - server.host(0x9732).client == "c2"
artifacts: [server.log, c1.log, c2.log, pcap]
