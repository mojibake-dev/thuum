# M5, the race permit (docs/verbs/character-creation.md, "The permit"): rotfern's race is test client 1's alone (Eli's call of
# 2026-11-01). The server restricts rotfern.esp's two races to profile 1 (server-settings.json restrictedRaces: aa00 rotfern,
# 19d08 rotfernRaceVampire); c1 is profile 1, c2 profile 2. On each seat's own CreateActor the server names the restricted
# races and the ones that profile may wear, and skymp5-client's RacePermitService reads them: its "restricted races" line on
# both seats, no E_RACE_PERMIT (a restricted id that is no race), and the hide (apocrypha 26ebe040, on parity e6c5d01a:
# race.clearRaceFlag(1) through Skyrim Platform's typed Race, after MakeUnplayable proved SKSE's script wrapper in 20261101-232833):
# two "taken off the menu" lines on c2 at login, none on c1 (x-race-permit-hide 20261102-023428 and 025940 green). The rule is the
# server's:
# 1. c1 picks rotfern's race in its menu (listed for it, and its recorded race on a playtest seat) and the server takes it; the
#    real-menu guard against refusing the permitted player, as a-rotfern.
# 2. c2's menu lacks the race, so lab-driver's race-pick misses through its presses and falls through to Actor.SetRace; the
#    menu's close sends rotfern's race and the server refuses it for profile 2: E_APPEARANCE_RACE once, the attempt recorded as
#    refused, c2's record and c1's view of c2 unchanged.
# Assertions are evaluated by lab-api only (ADR-009).
id: b-race-permit
milestone: M5
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
timeout_s: 900
steps:
  - c1: connect
  - c2: connect
  - c1: teleport {cell: lab-spawn, x: 0, y: -200, z: 0}
  - c2: teleport {cell: lab-spawn, x: 0, y: -450, z: 0}
  - wait: 10
  - c1: log-count {pattern: "restricted races"}
  - c2: log-count {pattern: "restricted races"}
  - c1: log-count {pattern: "taken off the menu"}
  - c2: log-count {pattern: "taken off the menu"}
  - c1: log-count {pattern: "E_RACE_PERMIT"}
  - c2: log-count {pattern: "E_RACE_PERMIT"}
  - assert:
      - 'server.log_count("SetRestrictedRacesSettings - 2 race") == 1'
      - 'c1.log_count("restricted races") >= 1'
      - 'c2.log_count("restricted races") >= 1'
      - 'c1.log_count("taken off the menu") == 0'
      - 'c2.log_count("taken off the menu") == 2'
      - 'c1.log_count("E_RACE_PERMIT") == 0'
      - 'c2.log_count("E_RACE_PERMIT") == 0'
  # 1. the permitted seat
  - c1: open-race-menu
  - wait: 6
  - c1: race-pick {race: "rotfern.esp:rotfern", max: 16}
  - wait: 2
  - c1: close-menu {name: "RaceSex Menu"}
  - wait: 6
  - c1: dump-state
  - c2: dump-state
  - assert:
      - server.actor(c1).appearanceAttempts == 1
      - server.actor(c1).lastAppearanceAllowed == true
      - server.actor(c1).lastAppearanceRaceId == form("rotfern.esp:rotfern")
      - server.actor(c1).raceId == form("rotfern.esp:rotfern")
      - c1.state.raceId == form("rotfern.esp:rotfern")
      - c2.view(c1).raceId == form("rotfern.esp:rotfern")
      - 'server.log_count("E_APPEARANCE_RACE") == 0'
  # 2. the other seat: the hidden race reaches the server through the driver's fallback alone, and the server refuses it
  - c2: open-race-menu
  - wait: 6
  - c2: race-pick {race: "rotfern.esp:rotfern", max: 16}
  - wait: 2
  - c2: close-menu {name: "RaceSex Menu"}
  - wait: 6
  - c1: dump-state
  - c2: dump-state
  - c2: screenshot
  - assert:
      - server.actor(c2).appearanceAttempts == 1
      - server.actor(c2).lastAppearanceAllowed == false
      - server.actor(c2).lastAppearanceRaceId == form("rotfern.esp:rotfern")
      - server.actor(c2).raceId != form("rotfern.esp:rotfern")
      - c1.view(c2).raceId != form("rotfern.esp:rotfern")
      - 'server.log_count("E_APPEARANCE_RACE") == 1'
artifacts: [server.log, c1.log, c2.log, screenshots]
