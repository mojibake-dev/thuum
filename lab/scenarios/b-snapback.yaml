# b-snapback (thuum docs/verbs/attributes.md, the hold on a server's raise;
# the snap-back of x-class-target2 20261018-103809 and 105815: a server-set
# rise in a player's Health reverted within about 2 s in 7 of 11 upward sets,
# the client's stale report taken as a fall and its later report of the set
# value cropped back down). Fork m2-snapback: a percentage the server RAISED
# holds against the client's reports until one reaches it. c1 is set to half
# Health, then to full; 4 s later (two client reports, which come every 2 s)
# the server and c1's own game both read full. Before the fix the server read
# the reverted value in most runs; the set downward is the control, never
# affected. Red by design until m2-snapback stages. Assertions are evaluated
# by lab-api only (ADR-009).
id: b-snapback
milestone: M2
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
timeout_s: 600
steps:
  - c1: connect
  - c2: connect
  - wait: 10
  - c1: teleport {cell: lab-spawn, x: 0, y: -300, z: 0, rot: [0, 0, 0]}
  - wait: 4
  # the control: a set downward sticks (a stale higher report is cropped)
  - c1: set-percentages {health: 0.5}
  - wait: 5
  - assert:
      - server.actor(c1).healthPercentage < 0.56
      - server.actor(c1).healthPercentage > 0.49
      - abs(c1.state.healthPercentage - server.actor(c1).healthPercentage) < 0.03
  # the raise: full, read 4 s later, two client reports past the set
  - c1: set-percentages {health: 1}
  - wait: 4
  - assert:
      - server.actor(c1).healthPercentage > 0.99
      - c1.state.healthPercentage > 0.99
  # and again from a lower start, with the stamina half as a second value
  - c1: set-percentages {health: 0.3, stamina: 0.3}
  - wait: 5
  - c1: set-percentages {health: 1, stamina: 1}
  - wait: 4
  - assert:
      - server.actor(c1).healthPercentage > 0.99
      - server.actor(c1).staminaPercentage > 0.99
      - c1.state.healthPercentage > 0.99
artifacts: [server.log, c1.log, c2.log]
