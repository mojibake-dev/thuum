id: b-npc-handoff-door-hosts
milestone: M3
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
  npcEnabled: true
  gameHour: 2.0
timeout_s: 3000
steps:
  - c1: connect
  - c2: connect
  - wait: 10
  # leg A (v17): P8's condition MADE server-side, at an hour when every engine keeps him home. His clean-world record stands in
  # his house (unhosted, so frozen); the clock is 2.x (his sleep package, 0x1cb15 DefaultSleepEditorLoc22x7 by 101556's read, 22:00 for
  # 420 min; the esm's 0x1b210 DefaultSleepEditorLoc24x8 is the 00:00 to 08:00 one; both sleep at his bed, so every engine's copy of
  # him settles there); c1 takes the street (9712 and 9731 hosted, the house unhosted) and its own engine's copy of
  # him reads indoors with no 3D (claimed: the stale copy's place). Then the server moves the RECORD to c1's feet (the console
  # table's MoveTo through the gamemode's labCommand: the actor's record teleported to the caller, ConsoleCommands.cpp
  # ExecuteMoveTo; the server's own move, no seat's report), so the record enters a cell c1 hosts and c1 is promoted while its
  # engine's copy stands in 133c7: P8's condition, made. On the parent the promoted seat's first report comes from the copy at the
  # bed before the gate's move lands ("(passes|follows|moves) 1348a into cell 133c7", the bounce, the record yanked home); on the fix
  # head the hold asks the move while the engine's copy stands at the bed (its ask line "asked the move at ..., the engine at (...)
  # in 133c7", the stale case's witness, claimed) and places the copy at the record (its placed line, claimed); the gate's "moved
  # to the record below" line is recorded only (v22). Then his sleep package walks him home by the street door 0x13423 under c1's
  # follow (D6; the door line "door 13423: ... walks it through to 133c7"), the record back in the house: recorded and claimed, no
  # visitor indoors, so no fight. No hour claim but the premise's.
  - assert:
      - server.ref(0x1348a).cell == "133c7:Skyrim.esm"
      - server.time().hour < 7.5
