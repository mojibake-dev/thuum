# b-npc-handoff-door-hosts (M3, docs/verbs/npc-handoff.md, ADR-047 D9's settle; v18 2026-11-03 after ADR-064's fresh review of v17
# (FIX FIRST: the shape sound and deterministic on every head, three claims that could never hold): the hold's "placed at the
# record" line never names the engine's pre-move cell (it prints only once the engine's cell IS the record's, so both read 3c), so
# the stale case's witness is the view's gate line at the create-word promotion ("promote gate 1348a: the engine at (...) in
# 133c7, the record at (...) in 3c; moved to the record below"), claimed, with the hold's "placed" line as the cure's witness and its
# parenthetical "(asked K time(s) ...)" with K >= 1 as the second (the copy stood away); server.actor(c1) is normalized to lab-spawn
# offsets while server.ref is absolute, so the record is claimed against the street spot in absolute units with bounds that admit
# his first steps home (x within 2000 of 21995, y within 2500 of -44935). Read from the code by the review and named here: the
# promotion is the CREATE WORD (the record's square change subscribes c1 as a listener and as the host, its CreateActor carries
# isHostedByOther false, remoteServer's create handler holds with the CreateActor's movement; no UpdateHoster covers a server-side
# move and no keyframe or Teleport relay reaches c1), the parent's first report after the server's MoveTo is swallowed by the
# teleport flag (ActionListener.cpp's kInfinityPos rule: one MovementValidation warn line on every head, not claimed), so the
# parent's bounce is the SECOND report's, 130 ms later, a race against the gate's move landing in about a second (P8), HYPOTHESIS
# until the parent run; the hold's move from an unloaded interior to a loaded exterior is unread until this run ("not placed" its
# witness, claimed absent). The head the gate plays is the system-1 merge candidate (m3-system1-r2, round five's hold lines).
# v17 2026-11-03 after ADR-064's fresh review of v16
# said BLOCKER on leg A's shape, three ways: a hosted cell never passes to a nearer seat in steady state (wire-rules cells.rs's
# consider: only inside the 5 s cold start; a host loses a cell by becoming ineligible, then the grace passes it), so v16's swap
# never happened; `approach {cell: record}` goes to the seat's own engine copy (runner.py reads the seat's npc-state), which by the
# leg's premise was the stale one; and the "stale copy indoors" was neither indoors (the visitor's own report carried him through
# the door to its far side) nor frozen (puppetService releases an unloaded puppet after 4 s, D11, and the schedule walks it). v17
# takes the review's deterministic shape: at 2.x every engine keeps him at his bed, the server moves the RECORD to the street
# seat's feet (the console table's MoveTo through labCommand), the seat's promotion meets its copy at the bed, and the hold's line
# naming the bed and the street is the stale case's witness; the parent's red is the stale copy's report into 133c7. No visitor
# indoors, so no fight and no no-combat claim in leg A; leg B keeps v16's and its exit until carries the fight as its own red
# ("hostility: 1348a hit ff00000[01]" == 0). The exit-hour claims are gone from leg A (the walk home is the sleep package's, waited
# on the street door's line). v16 2026-11-03 after 085226 (the swap probe v12 on
# round two) and 084329 (the settle-0 read) both stopped at the exit's until: Hod never walked out in 400 s because his COMBAT TARGET
# had become the visiting player inside his house (c2's console in 085226: "target 0 package 734cd" at the grant, then "target
# ff000001 package 734cd gaze 1348a" 23 s later; 070357's "Hod attacked the visiting player" reproduced), and combat holds him
# inside whatever his package says. The fight's cause is UNREAD (candidates: trespass in an owned interior; npc-fate's late fate or
# redress 1.4 s before, 070357's timing; the server's relayed hostility, ADR-023; system 1's or hostility-sync's row). So v16 claims
# NO COMBAT at the visit's premise and again right before the walk-out's until (inCombat false, combatTarget 0, no state line
# naming the visitor as his target), so a fight reads as the premise's red and never as the fix's; the state lines are recorded.
# v15 2026-11-03 after 084006 on round two 0238e3b8
# (RED on leg A's exit-hour claim alone; the four bounce claims held: the D9 pass at the house door was clean) and 084329 (the
# settle-0 read: Hod never walked out after a double promotion, P4's shape again): leg A REDESIGNED as the stale copy made on
# purpose. 084006 showed that a fresh seat's engine spawns him HOME at the house's load (no "moved ... into 133c7" and no create
# hold before the grant), so v14's leg A never reached P8's condition and its exit hour belonged to his day package 0x734cd (live on
# a fresh host at 17.x). v15's leg A: c1 takes the street; c2 visits the house (the grant, recorded hold lines, the no-bounce claims
# of v14's visit); c2 STAYS inside while 0x734cd walks him out by 13407 and the walk passes him to c1 (D9; v14's exit claims without
# the hour); c2's copy is then the stale one (an interior lists no exterior neighbours) and is CLAIMED indoors while c1 runs the
# record toward the mill for 30 s; then c2 approaches the record outdoors, the cell swaps to the strictly nearer seat and c2's
# promotion meets its stale copy: the hold's "placed at the record" line claimed, "not placed" absent, no pass, follow or move of
# him into 133c7 across the swap (the parent's red: the stale copy's first report), the record outdoors and within 2000 of its
# pre-swap place, c2 running him with 3D, c1's copy a puppet. Leg B is unchanged (the inn at 22:00 after the restart); 084006's
# load behaviour says a fresh seat's engine spawns him at his editor location, so leg B's grant meets a stale copy (the house's
# against the inn's record) by itself, HYPOTHESIS until its run. The swap probe is rewritten from this leg A with the roles swapped
# (v13). v14 2026-11-03, the re-check's two nits on v13
# (READY FOR THE GREENS at 70d36451): the settle drop's line ("report of 1348a into cell <interior> within the settle window")
# recorded beside the door count at each grant, a witness for the reader when the exit claim is red on the fix head (the return the
# settle swallowed), and the mutation sentence below; v13 after ADR-064's fresh review of v12 (FIX FIRST, applied as written): across each grant BOTH claims stand, v9's no pass, follow or move of him into an exterior cell
# and v12's no pass, follow or move of him BACK into the interior (baselines right before the teleport in, equal after the grant),
# and the door line is RECORDED at each grant. v12 had dropped the exit claim for the re-entry claim so a legitimate walk out by his
# day package would not read as the bounce; the review showed the tolerance does not exist (the same block claims the record's cell
# and the interior seat's 3D, so any exit before his hour is red in v9 and v12 alike) and that the exit line is the only witness
# where the fix head fails: it carries the settle, which drops the report back as a stale copy's sample for 1 s (no "into cell"
# line), and with the hold the seat promoted by that pass places its copy at the stale record outdoors, so no report back ever
# comes. What tells a walk from a jump is the door line: a walk logs "door 13407: 1348a's host ... walks it through to 3c" first, a
# jump logs none (055217 and 060106: no door line before their grant exits). If a working fix shows 0x734cd (HodSawmillSandbox8x11,
# 08:00 for 660 min; its conditions unread, P7 read 0x1e604's and 0x734ce's) walking him out once placed home, that is P4 refuted
# and a premise finding for leg A, not the bounce. The bounce's signature at a grant: the exit 180 ms after the word (055217), the
# return within about a second (36 ms by a pass back in 055217; 1.0 s by the follow's stale rule in 065955, "moves 1348a into cell
# 133c7" after the refused report back; 070357 the same shape, the record home again at its red assert). The claim set's red on the
# parent stands by 065955 (and 070357), whose failing claim is v13's exit claim verbatim; the re-entry claim's own red there is
# predicted from their result.json (the record home again at the red assert, so a return line exists), and a parent run under v13
# reads it when the chain has the slot. v11 after numidium's quick
# review of v10 (READY FOR THE RED RUN, three fixes before the greens): 17:00 to 19:00 lies inside the CONDITIONED sawmill window (08:00 for
# 660 min), so if a seat meets the mill's condition the sawmill package outranks the fallback and walks him out at a grant or before
# 19:00, a red with a working fix that would read as the grant bounce unless the door line were checked; so each premise block
# claims his package is neither sawmill package (0x1e604, 0x734ce) on the seat running him; the clock's numbers corrected (four runs
# fit hour = start + elapsed/180: the seats come online at 17.19 after a 35 s relaunch or 17.69 after a 124 s rollback, the
# interior seat's premise ends 17.56 to 18.06, the exit comes 169 to 259 s after the baselines and the 400 s until ends 141 to
# 231 s past 19:00); v10 after numidium's fresh review of v8 and v9: no build has ever shown the 08:00 exit (055217 logged no door
# walk for 400 s up to about 9.3 h, the hosts running Hod on DefaultEatEditorLoc6x1 0x1e618), and docs/engine/non-owning-seat.md
# P7 or P4 says why, both HYPOTHESIS (P7: the conditioned packages; P4: after a double promote the package does not take him
# out): his sawmill packages HodSawmillSawLog8x11
# 0x1e604 and HodSawmillLoadLog8x11 0x734ce are CONDITIONED (kGetVMScriptVariable on 0x71dfc's ::ResourceState_var, 2 and 0),
# so the 08:00 exit rests on the simulating seat's VM holding the mill script's state, while the inn package 0x35696 has no
# condition. Leg A's exit is therefore 19:00, the house-door walk toward the inn that reproduced the bounce in 052100: the clock
# starts at 17.0 (the numbers above), the hour is claimed between 17 and 18.9 at the premise's end and past 18.9 at the exit. Leg B's opening waits for his
# record in the inn (he walks there after leg A's exit, so at the restart he is in the inn or on his way under the street host's
# follow), within 200 s, and claims the follow's end at the visit's grant. The park is 27 cells from Riverwood's squares (not
# five). The proof is named right: on the parent the "now simulates" claim HOLDS at 5 s (he retries the door every 14.6 s), the
# reds are the pass back into the interior rising above its baseline and, since v9, the grant claims before that. v9 added the
# grant claims after 055217 (the bounce at the house seat's GRANT: 05:53:42.417 the grant, .597 "ff000000 passes 1348a into cell
# 9732, which another game hosts (D9)", .633 "ff000001 passes 1348a into cell 133c7 (D9)") and 060106 (the swap probe, roles
# swapped: 06:02:29.120 the grant, .158 the pass out, .205 the pass back): two for two at the grant, in both orientations, beside
# 052100's door-walk bounce ("door 13407: 1348a's host ff000000 walks it through to 3c" 05:22:16.593, the pass at 05:22:17.325,
# the pass back 56 ms later, the pair every 14 s). The reading (non-owning-seat.md P2, HYPOTHESIS): the promote places the new
# host's copy where its engine or its last sample had it, not at the record, so its first report moves the record there and
# the other side's indoor copy passes him back; the settle's half (b) would protect such a false exit, so the record must be
# imposed at EVERY promotion (a grant, a pass, a host's return) with its position sent reliably with or before the hoster word.
# Each leg claims, across EACH grant (the street seat's visit and the interior seat's entry), that no pass, follow or move of him
# into an exterior cell and none back into the interior was logged (baselines right before the teleport in, equal after the
# grant; the door line is counted for the reader, a walk's witness, and the settle drop's line, a swallowed return's), so the case goes red where it happens and a fix is tested
# at the grant too. v8 parked leg A's street seat at lab-spawn through the restart (a restart
# keeps the seats' places) and bounded the hour above; v7 made the house door leg A after 051454 (no bounce, no pass, fresh
# seats, hour 19.94) and 052100; the difference between those two runs is unexplained (orientation or hour). The exterior cell
# claim of v5 and v6 is gone (the record outdoors and the 150-unit bound carry it).
# The case: a resident leaving a hosted interior for a street ANOTHER live seat hosts stays with the street's host, on both
# screens. Playtest 41 (02:08Z, Hod leaving the Sleeping Giant by its inn-side door 0x13419, Prisoner hosting the inn and rotfern
# the street): the pass promoted the street's game with its copy still inside, its first report handed him straight back, and the
# two games traded him twice a second ("hod just tried to leave the sleeping giant inn... cannot seem to"). The fix (fork
# m3-handoff-settle): the passing report goes to the new host reliably ahead of the hoster word, so its promote places the copy at
# the door's far side; and the new host's report back into the cell the actor came from within handoffPassSettleMs is dropped as
# a stale copy's sample (verdict Stale), never a pass; the grant case above is its open gap.
# Hod 0x1348a (base 0x1347d; lab/esm.py on the lab's Skyrim.esm, numidium's read): the sawmill's packages 08:00 to 19:00
# (conditioned, above), HodSleepingGiant19x3 0x35696 19:00 to 22:00 (the inn, unconditioned), the fallback sandbox near his editor
# location 0x1b217 from 22:00, DefaultSleepEditorLoc24x8 0x1b210 00:00 to 08:00, DefaultEatEditorLoc6x1 at 06:00; his clean-world
# record stands in his house 0x133c7 at (-298.6, -40.6, 0). At timeScale 20 a game hour is 3 real minutes; the server's clock
# runs on through the seats' connect and rollback (0.3 to 0.7 h from a start to the seats' landing), hence the upper bounds on
# the hour at each premise's end.
# Doors (lab/esm.py door): 0x13407 is the house's inside door Hod leaves by, 0x13423 its street-side door in 0x9731 at
# (23556, -47255, -19) with the landing inside 0x133c7 at (-506, -177, 0) facing north; 0x13424 is the inn's street-side door in
# 0x9712 at (23320, -44530, -8), its landing inside 0x133c6 at (-250, -360, 0) facing north; 0x13419 is the inn-side door he
# leaves by, its landing on the street at (23260, -44476, -8). The street's seat at (21995, -44935) hosts 0x9712 and 0x9731 by
# its grid (051454, 052100, 055217: all held).
# Per leg: the premise in order (his record in the interior; the street seat's visit, its grant with no exit and no re-entry logged across it (the door line counted),
# his 3D on it, its exit and the interior unhosted; the street seat hosting 9712 and 9731 with its copy of him indoors and no
# 3D; the interior seat's entry, its grant with no exit and no re-entry logged across it (the door line counted), his 3D and AI on it; the hour inside its bounds), the
# counts read against baselines snapshotted then (the door line first), the exit waited on the pass line itself, then at 5 s the
# counts first with the hour (the door walk's line beyond its baseline, one more "now simulates 1348a in cell 97xx" than the
# baseline, no pass, follow or move of him back into the interior beyond the baseline), then the two seats read back to back
# with the street's seat last and the engine and position claims with no log count among them (the record outdoors, the
# street's seat running him loaded within 150 units of the record both ways, the interior's seat with no 3D of him and its copy
# out of the interior); at 65 s the counts again and nobody's copy in the interior. Informational: "moved 1348a into 3c (the
# engine had it in <interior>", formView's line at the promotion. Mutation: leg A on the parent; the swap probe
# x-handoff-door-hosts-swap v11 plays the house door with the roles swapped on the parent (a run stops at its first red, so the
# scenario's second leg never reaches the parent). Its own commit (rule 13); ADR-064's fresh review before the gate plays it.
id: b-npc-handoff-door-hosts
milestone: M3
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
  npcEnabled: true
  gameHour: 2.0
timeout_s: 3000
steps:
  - c1: connect
  - c2: connect
  - wait: 10
  # leg A (v17): P8's condition MADE server-side, at an hour when every engine keeps him home. His clean-world record stands in
  # his house (unhosted, so frozen); the clock is 2.x (DefaultSleepEditorLoc24x8 0x1b210, 00:00 to 08:00: every engine's copy of
  # him is at his bed, loaded or not); c1 takes the street (9712 and 9731 hosted, the house unhosted) and its own engine's copy of
  # him reads indoors with no 3D (claimed: the stale copy's place). Then the server moves the RECORD to c1's feet (the console
  # table's MoveTo through the gamemode's labCommand: the actor's record teleported to the caller, ConsoleCommands.cpp
  # ExecuteMoveTo; the server's own move, no seat's report), so the record enters a cell c1 hosts and c1 is promoted while its
  # engine's copy stands in 133c7: P8's condition, made. On the parent the promoted seat's first report comes from the copy at the
  # bed before the gate's move lands ("(passes|follows|moves) 1348a into cell 133c7", the bounce, the record yanked home); on the fix
  # head the hold places the copy at the record first and its line names both places ("the engine at (...) in 133c7, the record at
  # (...) in 3c"), the stale case's witness, claimed. Then his sleep package walks him home by the street door 0x13423 under c1's
  # follow (D6; the door line "door 13423: ... walks it through to 133c7"), the record back in the house: recorded and claimed, no
  # visitor indoors, so no fight. No hour claim but the premise's.
  - assert:
      - server.ref(0x1348a).cell == "133c7:Skyrim.esm"
      - server.time().hour < 7.5
  - c1: teleport {cell: "3c:Skyrim.esm", x: 21995, y: -44935, z: -128, rot: [0, 0, 180]}
  - wait: 15
  - c1: npc-state {formId: 0x1348a}
  - assert:
      - server.host(0x9712).client == "c1"
      - server.host(0x9731).client == "c1"
      - server.host(0x133c7).hosted == false
      # the stale copy's place: c1's engine has him at his bed, unloaded
      - c1.npc_state(0x1348a).cell == 0x133c7
      - c1.npc_state(0x1348a).is3DLoaded == false
  # the baselines: no move of him into the house or an exterior cell yet, the door and settle lines, c1's place
  - server: log-count {pattern: "(passes|follows|moves) 1348a into cell 97"}
  - server: log-count {pattern: "(passes|follows|moves) 1348a into cell 133c7"}
  - server: log-count {pattern: "door 13423: 1348a.s host .* walks it through to 133c7"}
  - server: log-count {pattern: "report of 1348a into cell 133c7 within the settle window"}
  - server: snapshot {name: back_a1, of: 'server.log_count("(passes|follows|moves) 1348a into cell 133c7")'}
  - server: snapshot {name: door_a0, of: 'server.log_count("door 13423: 1348a.s host .* walks it through to 133c7")'}
  # the move: the record to c1's feet; c1 is promoted (the word) with its copy at the bed
  - c1: server-console {name: MoveTo, args: [0x1348a, 0x14]}
  - wait: 8
  - c1: npc-state {formId: 0x1348a}
  - c1: log-count {pattern: "hold 1348a: placed at the record"}
  - c1: log-count {pattern: "hold 1348a: placed at the record after [0-9]+ ms .asked [1-9]"}
  - c1: log-count {pattern: "hold 1348a: not placed"}
  - c1: log-count {pattern: "promote gate 1348a"}
  - c1: log-count {pattern: "promote gate 1348a: the engine at .* in 133c7, the record at .* in 3c; moved to the record below"}
  - c1: log-count {pattern: "moved 1348a into"}
  - server: log-count {pattern: "(passes|follows|moves) 1348a into cell 97"}
  - server: log-count {pattern: "report of 1348a into cell 133c7 within the settle window"}
  - c1: screenshot
  - assert:
      # the record outdoors near the street spot (absolute units; his first steps home admitted) and no report yanked it home
      - server.ref(0x1348a).cell == "3c:Skyrim.esm"
      - 'abs(server.ref(0x1348a).x - 21995) < 2000'
      - 'abs(server.ref(0x1348a).y + 44935) < 2500'
      - 'server.log_count("(passes|follows|moves) 1348a into cell 133c7") == snapshot("back_a1")'
      # the stale case met: the gate's line at the create-word promotion names the bed and the street; cured: the hold placed
      # the copy, having asked at least once (the copy stood away), and nothing timed out
      - 'c1.log_count("promote gate 1348a: the engine at .* in 133c7, the record at .* in 3c; moved to the record below") >= 1'
      - 'c1.log_count("hold 1348a: placed at the record") >= 1'
      - 'c1.log_count("hold 1348a: placed at the record after [0-9]+ ms .asked [1-9]") >= 1'
      - 'c1.log_count("hold 1348a: not placed") == 0'
      # c1 runs him outdoors, its copy within 150 of the record both ways
      - c1.npc_state(0x1348a).is3DLoaded == true
      - c1.npc_state(0x1348a).aiEnabled == true
      - c1.npc_state(0x1348a).cell != 0x133c7
      - 'c1.npc_state(0x1348a).x - server.ref(0x1348a).x < 150'
      - 'server.ref(0x1348a).x - c1.npc_state(0x1348a).x < 150'
      - 'c1.npc_state(0x1348a).y - server.ref(0x1348a).y < 150'
      - 'server.ref(0x1348a).y - c1.npc_state(0x1348a).y < 150'
  # the walk home: his sleep package takes him back in by the street door under c1's follow (D6), the record follows him home
  - until: {within: 240, expect: ['server.log_count("door 13423: 1348a.s host .* walks it through to 133c7") > snapshot("door_a0")']}
  - wait: 8
  - c1: npc-state {formId: 0x1348a}
  - server: log-count {pattern: "(passes|follows|moves) 1348a into cell 133c7"}
  - server: log-count {pattern: "(passes|follows|moves) 1348a into cell 97"}
  - c1: screenshot
  - assert:
      - server.ref(0x1348a).cell == "133c7:Skyrim.esm"
      - server.follow(0x1348a).following == true
      - server.follow(0x1348a).client == "c1"
      - c1.npc_state(0x1348a).cell == 0x133c7
  # leg B: the roles swapped at the inn's door on a restarted clock (the restart forgets the hosts and the follows; the
  # server's log and its counts stand, and so do the world and the seats' places: so leg A's street seat parks at lab-spawn
  # first, 27 cells from Riverwood's squares, and comes back only to enter the inn, b-npc-handoff-night's shape)
  - c2: teleport {cell: lab-spawn, x: 0, y: -300, z: 0, rot: [0, 0, 0]}
  - wait: 8
  - server: restart {gameHour: 20.0}
  - c1: connect
  - c2: connect
  - wait: 10
  # leg B, the inn door at 22:00: the restart kept the world, so his record is in the inn (leg A's exit walked him there) or on
  # his way; c2 waits at lab-spawn through the restart, so c1 alone lands on the street and hosts his cell, and the inn package
  # finishes his walk under c1's follow if he has not arrived
  - c1: teleport {cell: "3c:Skyrim.esm", x: 21995, y: -44935, z: -128, rot: [0, 0, 180]}
  - wait: 20
  - assert:
      - server.host(0x9712).client == "c1"
      - server.host(0x9731).client == "c1"
  - until: {within: 200, expect: [server.ref(0x1348a).cell == "133c6:Skyrim.esm"]}
  # the premise, claimed: the street's seat visits the interior first (it hosts it, so Hod's AI may step while it looks), sees
  # him with 3D, then leaves for the street; the interior unhosts behind it, and its engine's copy of him reads indoors with no
  # 3D (playtest 41's shape, the bounce's mechanism, whatever its cause). Across the visit's grant no pass, follow or move of
  # him into an exterior cell (055217's and 060106's grant promotions put him outdoors from a stale placement) and none BACK
  # into the interior (the stale copy's false exit comes back: 36 ms by a pass back in 055217, 1.0 s by the follow's stale rule
  # in 065955); the door line and the settle drop's line counted beside them (a walk logs the door first, a jump logs none; the
  # settle line is a return the server swallowed)
  - server: log-count {pattern: "(passes|follows|moves) 1348a into cell 97"}
  - server: log-count {pattern: "(passes|follows|moves) 1348a into cell 133c6"}
  - server: log-count {pattern: "door 13419: 1348a.s host .* walks it through to 3c"}
  - server: log-count {pattern: "report of 1348a into cell 133c6 within the settle window"}
  - server: snapshot {name: out_visit_b, of: 'server.log_count("(passes|follows|moves) 1348a into cell 97")'}
  - server: snapshot {name: back_visit_b, of: 'server.log_count("(passes|follows|moves) 1348a into cell 133c6")'}
  - c1: teleport {cell: "133c6:Skyrim.esm", x: -250, y: -360, z: 0, rot: [0, 0, 0]}
  - wait: 5
  - c1: move {dy: 150, duration_s: 2}
  - until: {within: 60, expect: [server.host(0x133c6).client == "c1"]}
  - wait: 8
  - c1: npc-state {formId: 0x1348a}
  - server: log-count {pattern: "door 13419: 1348a.s host .* walks it through to 3c"}
  - server: log-count {pattern: "report of 1348a into cell 133c6 within the settle window"}
  - assert:
      - server.ref(0x1348a).cell == "133c6:Skyrim.esm"
      - c1.npc_state(0x1348a).is3DLoaded == true
      - c1.npc_state(0x1348a).package != 0x1e604
      - c1.npc_state(0x1348a).package != 0x734ce
      - server.follow(0x1348a).following == false
      - 'server.log_count("(passes|follows|moves) 1348a into cell 97") == snapshot("out_visit_b")'
      - 'server.log_count("(passes|follows|moves) 1348a into cell 133c6") == snapshot("back_visit_b")'
  - c1: teleport {cell: "3c:Skyrim.esm", x: 21995, y: -44935, z: -128, rot: [0, 0, 180]}
  - until: {within: 60, expect: [server.host(0x133c6).hosted == false]}
  - wait: 15
  - c1: npc-state {formId: 0x1348a}
  - assert:
