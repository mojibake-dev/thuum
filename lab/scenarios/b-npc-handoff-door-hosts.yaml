# b-npc-handoff-door-hosts (M3, docs/verbs/npc-handoff.md, ADR-047 D9's settle; v2 2026-11-03 after the
# fresh review's seven findings on v1 019b0cd3): a resident leaving a hosted interior for a street ANOTHER
# live seat hosts stays with the street's host, on both screens. Playtest 41 (02:08Z, Hod 0x1348a at the
# Sleeping Giant's door 0x13419, Prisoner hosting the inn and rotfern the street): the pass promoted the
# street's game with its copy still inside, its first report handed him straight back, and the two games
# traded him twice a second ("hod just tried to leave the sleeping giant inn... cannot seem to"). The fix
# (fork m3-handoff-settle): the passing report goes to the new host reliably ahead of the hoster word, so
# its promote places the copy at the door's far side; and the new host's report back into the cell within
# PASS_SETTLE_MS is dropped as a stale copy's sample (verdict Stale), never a pass. The gate never held two
# hosts on a door's two sides (the audit's case 3 on npc-handoff). v1 played the other direction (a walk
# INTO a hosted house), which already worked before the fix (playtest 37's finding 39), so it could not go
# red on the unfixed server; v2 is the playtest's own case, in both roles.
# Shape: the inn's seat stands at the landing of the inn's door 0x13424 (lab/esm.py door: (-250, -360, 0)
# in 0x133c6, two steps into the room so the landing stays clear), hosting 0x133c6; the street's seat
# stands on Riverwood's road in 0x9712 (b-npc-handoff-cross's c1 spot) and hosts it; the clock at 22.0,
# when Hod drinks at the inn and leaves for bed around midnight (the premise asserts his record indoors
# first; his exit hour is the engine's, read from the run). Leg A: c2 inside, c1 outside. Leg B: a
# restart with the same clock, the roles swapped. Claims per leg: the premise (both hosts, his record and
# 3D under the inn's seat, no copy loaded on the street's seat, no pass of him yet); after the exit, one
# "now simulates 1348a in cell 9712" line in leg A and never one for 133c6, no pass, follow or move of
# him back into 133c6 at any time, his record outdoors 60 s on, the street's seat running him loaded in
# 0x9712 within 150 units of the record both ways, the inn's seat running nothing. Reads for the header
# after the runs: how long after the pass the "dropped as a stale copy's sample" line came (PASS_SETTLE_MS
# is UNMEASURED; cells.rs names this scenario as its sizing). Mutation: the same run on the fix's parent
# union-srv-3 35509f7a must go red on the 133c6 counts (the diff has no kill switch). Its own commit
# (rule 13); ADR-064's fresh review before the gate plays it.
id: b-npc-handoff-door-hosts
milestone: M3
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
  npcEnabled: true
  gameHour: 22.0
timeout_s: 3600
steps:
  # leg A: c2 hosts the inn from inside, c1 the street
  - c1: connect
  - c2: connect
  - wait: 10
  - c1: teleport {cell: "3c:Skyrim.esm", x: 21995, y: -44935, z: -128, rot: [0, 0, 180]}
  - c2: teleport {cell: "133c6:Skyrim.esm", x: -250, y: -360, z: 0, rot: [0, 0, 0]}
  - wait: 5
  - c2: move {dy: 150, duration_s: 2}
  - wait: 20
  - assert:
      - server.host(0x9712).client == "c1"
      - server.host(0x133c6).client == "c2"
  # the premise: Hod indoors under the inn's seat, loaded and run there, unloaded on the street's seat, no pass yet
  - until: {within: 600, expect: [server.ref(0x1348a).cell == "133c6:Skyrim.esm"]}
  - c1: npc-state {formId: 0x1348a}
  - c2: npc-state {formId: 0x1348a}
  - assert:
      - c2.npc_state(0x1348a).is3DLoaded == true
      - c2.npc_state(0x1348a).aiEnabled == true
      - c1.npc_state(0x1348a).is3DLoaded == false
      - 'server.log_count("now simulates 1348a in cell 9712") == 0'
  # the exit: his schedule takes him out through 0x13419; c2's engine walks him, its report from the street passes him to c1
  # (D9), c1's promote stands him at the door's far side (the passing report imposed ahead of the word), and his first
  # reports from the street stay c1's
  - until: {within: 1500, expect: [server.ref(0x1348a).cell == "3c:Skyrim.esm"]}
  - wait: 5
  - c1: npc-state {formId: 0x1348a}
  - c2: npc-state {formId: 0x1348a}
  - assert:
      - 'server.log_count("now simulates 1348a in cell 9712") == 1'
  - wait: 60
  - c1: npc-state {formId: 0x1348a}
  - c2: npc-state {formId: 0x1348a}
  - c1: screenshot
  - c2: screenshot
  - assert:
      # one hand-off out and none back: a second "now simulates" line, or any pass, follow or move of him back into the inn,
      # is the ping-pong (a bounce under D22's margin logs "follows ... within the pass margin", so the three verbs are read)
      - 'server.log_count("now simulates 1348a in cell 9712") == 1'
      - 'server.log_count("now simulates 1348a in cell 133c6") == 0'
      - 'server.log_count("(passes|follows|moves) 1348a into cell 133c6") == 0'
      - server.ref(0x1348a).cell == "3c:Skyrim.esm"
      # the street's host runs him, loaded, in the street's cell, where the record stands; the inn's seat runs nothing
      - c1.npc_state(0x1348a).is3DLoaded == true
      - c1.npc_state(0x1348a).aiEnabled == true
      - c1.npc_state(0x1348a).cell == 0x9712
      - c1.npc_state(0x1348a).x - server.ref(0x1348a).x < 150
      - server.ref(0x1348a).x - c1.npc_state(0x1348a).x < 150
      - c1.npc_state(0x1348a).y - server.ref(0x1348a).y < 150
      - server.ref(0x1348a).y - c1.npc_state(0x1348a).y < 150
      - c2.npc_state(0x1348a).aiEnabled == false
  # leg B: the roles swapped on a fresh clock (the restart forgets the hosts and the follows; both reconnect; c1 inside the
  # inn, c2 on the street). The log counts of leg A stand, so leg B's claims read the inn's counts (still none) and the
  # seats' own states rather than the street's count
  - server: restart {gameHour: 22.0}
  - c1: connect
  - c2: connect
  - wait: 10
  - c2: teleport {cell: "3c:Skyrim.esm", x: 21995, y: -44935, z: -128, rot: [0, 0, 180]}
  - c1: teleport {cell: "133c6:Skyrim.esm", x: -250, y: -360, z: 0, rot: [0, 0, 0]}
  - wait: 5
  - c1: move {dy: 150, duration_s: 2}
  - wait: 20
  - assert:
      - server.host(0x9712).client == "c2"
      - server.host(0x133c6).client == "c1"
  - until: {within: 600, expect: [server.ref(0x1348a).cell == "133c6:Skyrim.esm"]}
  - c1: npc-state {formId: 0x1348a}
  - c2: npc-state {formId: 0x1348a}
  - assert:
      - c1.npc_state(0x1348a).is3DLoaded == true
      - c1.npc_state(0x1348a).aiEnabled == true
      - c2.npc_state(0x1348a).is3DLoaded == false
  - until: {within: 1500, expect: [server.ref(0x1348a).cell == "3c:Skyrim.esm"]}
  - wait: 65
  - c1: npc-state {formId: 0x1348a}
  - c2: npc-state {formId: 0x1348a}
  - c1: screenshot
  - c2: screenshot
  - assert:
      - 'server.log_count("now simulates 1348a in cell 133c6") == 0'
      - 'server.log_count("(passes|follows|moves) 1348a into cell 133c6") == 0'
      - server.ref(0x1348a).cell == "3c:Skyrim.esm"
      - c2.npc_state(0x1348a).is3DLoaded == true
      - c2.npc_state(0x1348a).aiEnabled == true
      - c2.npc_state(0x1348a).cell == 0x9712
      - c2.npc_state(0x1348a).x - server.ref(0x1348a).x < 150
      - server.ref(0x1348a).x - c2.npc_state(0x1348a).x < 150
      - c2.npc_state(0x1348a).y - server.ref(0x1348a).y < 150
      - server.ref(0x1348a).y - c2.npc_state(0x1348a).y < 150
      - c1.npc_state(0x1348a).aiEnabled == false
artifacts: [server.log, c1.log, c2.log, screenshots]
