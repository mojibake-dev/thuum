# b-npc-handoff-door-hosts (M3, docs/verbs/npc-handoff.md, ADR-047 D9's settle; v9 2026-11-03 after v7's leg A on the parent,
# 20261103-055217 (union-srv-3 35509f7a), red at the exit until with NO door walk (step 24's door-13407 count 0) and the bounce
# at a GRANT instead: 05:53:42.417 c1 granted 133c7 at epoch 2, 05:53:42.597 "ff000000 passes 1348a into cell 9732, which
# another game hosts (D9)" (c1's FIRST report as the house's new host put Hod outdoors), 05:53:42.633 "ff000001 passes 1348a
# into cell 133c7 (D9)" (c2's indoor copy passed him back), then only his speech and state lines for 400 s. numidium's reading
# (HYPOTHESIS): the promote at the grant placed c1's copy at the LAST RELAYED SAMPLE (the outdoor one from c2's follow at
# 05:53:05.698 during its visit, when Hod stepped out and back in: "follows 1348a into cell 9713 (D6)", "may not move 1348a to
# cell 133c7", "moves 1348a into cell 133c7, which it hosts"), not at the record (indoors since 05:53:06.767): the stale
# placement's mechanism at a grant rather than a D9 pass. The settle's half (b) would protect that false exit (c2's report back
# came 36 ms after it, inside the window), so the record must be imposed at EVERY promotion (a grant, a pass, a host's return)
# with the record's position sent reliably with or before the hoster word: ADR-064 system 1's model (a reference's life on a
# non-owning seat), which comes before more settle code. So v9 claims no pass, follow or move of him into an exterior cell
# across EACH grant (the street seat's visit and the interior seat's entry: a baseline right before the teleport in, equal
# after the grant), so this case goes red where it happens, and on a fix it tests the grant's imposition. v8 after numidium's
# fresh review of v7 1c8f3455: leg B gave the street to the wrong seat (a restart keeps the seats' places, so the street seat of leg A took 0x9712
# and 0x9731 again at its reconnect before the other landed on the same square at the same ring; cells.rs `consider` hands a cell
# to a strictly nearer ring alone), so leg A's street seat now parks at lab-spawn before the restart, as b-npc-handoff-night's
# shape does, and comes back only to enter the inn; the hour claims gained their upper bound (a late clock after a long rollback
# could put his exit before the baselines and make the fix's run red at the exit until, which would read as the fix failing);
# the clock starts at 6.0; the header names the mutation's proof and corrects its cause. v7 after v6's two red runs on the fix's
# parent union-srv-3 35509f7a (numidium's reads): leg A (20261103-051454; c2 the house's seat, c1 the street's, hour 19.94 at the
# premise) was red at its premise with NO pass logged at his house door, Hod already in the inn when the first until began; the
# swap probe (20261103-052100; c1 the house's seat, c2 the street's, hour 19.49, both games relaunched for the run) REPRODUCED
# THE BUG at the house door: "door 13407: 1348a's host ff000000 walks it through to 3c" 05:22:16.593, "ff000000 passes 1348a into
# cell 9731 (D9)" and "ff000001 now simulates 1348a in cell 9731" 05:22:17.325, "ff000001 passes 1348a into cell 133c7 (D9)" 56 ms
# later and "ff000000 now simulates 1348a in cell 133c7", the pair again at 05:22:31.9, 05:22:45.9, 05:23:34.7 and 05:23:48.6,
# Hod retrying his door every 14 s and never getting out. The difference between the two runs is UNEXPLAINED (the seats'
# orientation, or the hour): a stale indoor model of him on the street seat's engine was the first reading, and 052100's fresh
# games refute it as the whole cause (c2 went straight to the street and bounced him all the same). Each leg keeps the street
# seat's visit of the interior as a CLAIMED premise all the same: its copy of him indoors with no 3D at the exit is playtest 41's
# shape and the bounce's mechanism, so the claim tells the reader what the run's street seat held, whatever the cause turns out
# to be. The house door reproduces the bug at any hour his package leaves the house, with no wait for 22:00, and 052100's bounce
# came 56 ms after the pass, inside the 1 s settle as well as being the placement's case.
# Leg A is the house door at 08:00 (the sawmill package ends his night at home, DefaultSleepEditorLoc24x8 00:00 to 08:00 with a
# meal at 06:00; the clock starts at 6.0 so the visit finds him home and the exit comes two to three real minutes after the
# house's seat hosts him), c2 the street's seat and c1 the house's (052100's orientation). Leg B is the inn door at 22:00,
# playtest 41's own (a restart at 20.0 keeps the world: he is at the mill or on his way; c2 parked at lab-spawn through the
# restart, c1 lands on the street alone, hosts his cell, and his inn package walks him into the unhosted inn under c1's follow,
# claimed; c1 then visits the inn, the grant ends the follow, it leaves; c2 enters the inn from lab-spawn and hosts him; at 22:00
# the fallback sandbox near his editor location walks him out by 0x13419), c1 the street's seat and c2 the inn's. The exterior
# cell claim of v5 and v6 (0x9712 or 0x9731) is gone: the record outdoors and the street seat's copy within 150 units of it carry
# the point, and at the 5 s read his exterior cell depends on his pace.
# The case: a resident leaving a hosted interior for a street ANOTHER live seat hosts stays with the street's host, on both
# screens. Playtest 41 (02:08Z, Hod leaving the Sleeping Giant by its inn-side door 0x13419, Prisoner hosting the inn and rotfern
# the street): the pass promoted the street's game with its copy still inside, its first report handed him straight back, and the
# two games traded him twice a second ("hod just tried to leave the sleeping giant inn... cannot seem to"). The fix (fork
# m3-handoff-settle): the passing report goes to the new host reliably ahead of the hoster word, so its promote places the copy at
# the door's far side; and the new host's report back into the cell the actor came from within handoffPassSettleMs is dropped as
# a stale copy's sample (verdict Stale), never a pass.
# Hod 0x1348a (base 0x1347d; lab/esm.py on the lab's Skyrim.esm, numidium's read): the sawmill's packages 08:00 to 19:00
# (0x1e604, 0x734ce, 0x734cd), HodSleepingGiant19x3 0x35696 19:00 to 22:00 (the inn), the fallback sandbox near his editor
# location 0x1b217 from 22:00, DefaultSleepEditorLoc24x8 0x1b210 00:00 to 08:00, DefaultEatEditorLoc6x1 at 06:00; his clean-world
# record stands in his house 0x133c7 at (-298.6, -40.6, 0). At timeScale 20 a game hour is 3 real minutes; the server's clock
# runs on through the seats' connect and rollback (0.3 to 0.7 h from a start to the seats' landing: 051454 read 19.94 at its
# premise from a 19.0 start after a 121 s rollback, 052100 19.49), hence the upper bounds on the hour at each premise's end.
# Doors (lab/esm.py door): 0x13407 is the house's inside door Hod leaves by, 0x13423 its street-side door in 0x9731 at
# (23556, -47255, -19) with the landing inside 0x133c7 at (-506, -177, 0) facing north; 0x13424 is the inn's street-side door in
# 0x9712 at (23320, -44530, -8), its landing inside 0x133c6 at (-250, -360, 0) facing north; 0x13419 is the inn-side door he
# leaves by, its landing on the street at (23260, -44476, -8). The street's seat at (21995, -44935) hosts 0x9712 and 0x9731 by
# its grid (051454 and 052100: both held); for leg B the mill must lie inside its grid too, or his AI never runs there and the
# until for the inn shows it.
# Per leg: the premise in order (his record in the interior; the street seat's visit, its grant, his 3D on it, its exit and the
# interior unhosted; the street seat hosting 9712 and 9731 with its copy of him indoors and no 3D; the interior seat's entry, its
# grant, his 3D and AI on it; the hour inside its bounds), the counts read against baselines snapshotted then (the door line
# first), the exit waited on the pass line itself, then at 5 s the counts first with the hour (the door walk's line beyond its
# baseline, one more "now simulates 1348a in cell 97xx" than the baseline, no pass, follow or move of him back into the interior
# beyond the baseline), then the two seats read back to back with the street's seat last and the engine and position claims
# with no log count among them (the record outdoors, the street's seat running him loaded within 150 units of the record both
# ways, the interior's seat with no 3D of him and its copy out of the interior); at 65 s the counts again and nobody's copy in
# the interior. Informational: "moved 1348a into 3c (the engine had it in <interior>", formView's line at the promotion.
# Mutation: leg A on the parent, and THE PROOF IS THE COUNTS BLOCK AT 5 S GOING RED: one more "now simulates 1348a in cell 97xx"
# than the baseline fails as the bounce passes him back and forth (052100: the pass at 05:22:17.325, the bounce 56 ms later, the
# pair again every 14 s), and "passes 1348a into cell 133c7" rises above its baseline; a red only at the engine block (the street
# seat's copy far from the record) is not the bounce and reads as a premise or an engine finding. The swap probe
# x-handoff-door-hosts-swap v6 plays the house door with the roles swapped on the parent (a run stops at its first red, so the
# scenario's second leg never reaches the parent). Its own commit (rule 13); ADR-064's fresh review before the gate plays it.
id: b-npc-handoff-door-hosts
milestone: M3
clients: [c1, c2]
server:
  snapshot: clean
  netem: null
  npcEnabled: true
  gameHour: 6.0
timeout_s: 3000
steps:
  - c1: connect
  - c2: connect
  - wait: 10
  # leg A, the house door at 08:00: his clean-world record stands in his house (unhosted, so frozen) before any seat hosts it
  - assert:
      - server.ref(0x1348a).cell == "133c7:Skyrim.esm"
  # the premise, claimed: the street's seat visits the interior first (it hosts it, so Hod's AI may step while it looks), sees
  # him with 3D, then leaves for the street; the interior unhosts behind it, and its engine's copy of him reads indoors with no
  # 3D (playtest 41's shape, the bounce's mechanism, whatever its cause). Across the visit's grant no pass, follow or move of
  # him into an exterior cell (055217's grant promotion put him outdoors from a stale placement)
  - server: log-count {pattern: "(passes|follows|moves) 1348a into cell 97"}
  - server: snapshot {name: out_visit_a, of: 'server.log_count("(passes|follows|moves) 1348a into cell 97")'}
  - c2: teleport {cell: "133c7:Skyrim.esm", x: -506, y: -177, z: 0, rot: [0, 0, 0]}
  - wait: 5
  - c2: move {dy: 150, duration_s: 2}
  - until: {within: 60, expect: [server.host(0x133c7).client == "c2"]}
  - wait: 8
  - c2: npc-state {formId: 0x1348a}
  - assert:
      - server.ref(0x1348a).cell == "133c7:Skyrim.esm"
      - c2.npc_state(0x1348a).is3DLoaded == true
      - server.follow(0x1348a).following == false
      - 'server.log_count("(passes|follows|moves) 1348a into cell 97") == snapshot("out_visit_a")'
  - c2: teleport {cell: "3c:Skyrim.esm", x: 21995, y: -44935, z: -128, rot: [0, 0, 180]}
  - until: {within: 60, expect: [server.host(0x133c7).hosted == false]}
  - wait: 15
  - c2: npc-state {formId: 0x1348a}
  - assert:
      - server.host(0x9712).client == "c2"
      - server.host(0x9731).client == "c2"
      - server.ref(0x1348a).cell == "133c7:Skyrim.esm"
      - c2.npc_state(0x1348a).is3DLoaded == false
      - c2.npc_state(0x1348a).cell == 0x133c7
      - server.time().hour >= 6.0
  # the interior's seat enters by the same landing, is granted the interior and runs him: his 3D and AI there, the street
  # seat's copy still indoors with no 3D; across its grant no pass, follow or move of him into an exterior cell (055217: the
  # new host's first report put him outdoors 180 ms after the grant, the bounce's mechanism at a grant); the hour still short
  # of his exit (a late clock would put the exit before the baselines and the fix's run red at the exit until)
  - server: log-count {pattern: "(passes|follows|moves) 1348a into cell 97"}
  - server: snapshot {name: out_grant_a, of: 'server.log_count("(passes|follows|moves) 1348a into cell 97")'}
  - c1: teleport {cell: "133c7:Skyrim.esm", x: -506, y: -177, z: 0, rot: [0, 0, 0]}
  - wait: 5
  - c1: move {dy: 150, duration_s: 2}
  - until: {within: 90, expect: [server.host(0x133c7).client == "c1"]}
  - wait: 10
  - c2: npc-state {formId: 0x1348a}
  - c1: npc-state {formId: 0x1348a}
  - assert:
      - 'server.log_count("(passes|follows|moves) 1348a into cell 97") == snapshot("out_grant_a")'
      - server.ref(0x1348a).cell == "133c7:Skyrim.esm"
      - c1.npc_state(0x1348a).is3DLoaded == true
      - c1.npc_state(0x1348a).aiEnabled == true
      - c2.npc_state(0x1348a).is3DLoaded == false
      - c2.npc_state(0x1348a).cell == 0x133c7
      - server.time().hour >= 6.0
      - server.time().hour < 7.8
  # the baselines, the door line first (if his exit fell between the reads, the door claim is the one that would read false
  # with the fix working): what the log already counts before the exit
  - server: log-count {pattern: "door 13407: 1348a.s host .* walks it through to 3c"}
  - server: log-count {pattern: "now simulates 1348a in cell 97"}
  - server: log-count {pattern: "passes 1348a into cell 133c7"}
  - server: log-count {pattern: "(passes|follows|moves) 1348a into cell 133c7"}
  - server: snapshot {name: door_a, of: 'server.log_count("door 13407: 1348a.s host .* walks it through to 3c")'}
  - server: snapshot {name: street_a, of: 'server.log_count("now simulates 1348a in cell 97")'}
  - server: snapshot {name: back_a, of: 'server.log_count("passes 1348a into cell 133c7")'}
  - server: snapshot {name: into_a, of: 'server.log_count("(passes|follows|moves) 1348a into cell 133c7")'}
  # the exit: his package takes him out by 13407 (the server's "door 13407: ... walks it through to 3c" line); the interior
  # host's report from the street passes him to the street's host (D9, "now simulates 1348a in cell 97xx"); the wait is on
  # that pass line, not on the cell
  - until: {within: 400, expect: ['server.log_count("now simulates 1348a in cell 97") > snapshot("street_a")']}
  - wait: 5
  # the counts first (each server.log_count re-reads the whole log) with the hour (the pass was his package's exit), then the
  # two seats read back to back with the street's seat last, then the engine and position claims with no log count among them;
  # on the parent THIS block is the bounce's red (one more "now simulates" and a pass back into the interior)
  - assert:
      - 'server.log_count("door 13407: 1348a.s host .* walks it through to 3c") > snapshot("door_a")'
      - 'server.log_count("now simulates 1348a in cell 97") == snapshot("street_a") + 1'
      - 'server.log_count("passes 1348a into cell 133c7") == snapshot("back_a")'
      - 'server.log_count("(passes|follows|moves) 1348a into cell 133c7") == snapshot("into_a")'
      - server.time().hour >= 7.9
  - c1: npc-state {formId: 0x1348a}
  - c2: npc-state {formId: 0x1348a}
  - assert:
      - server.ref(0x1348a).cell == "3c:Skyrim.esm"
      - c2.npc_state(0x1348a).is3DLoaded == true
      - c2.npc_state(0x1348a).aiEnabled == true
      - c2.npc_state(0x1348a).x - server.ref(0x1348a).x < 150
      - server.ref(0x1348a).x - c2.npc_state(0x1348a).x < 150
      - c2.npc_state(0x1348a).y - server.ref(0x1348a).y < 150
      - server.ref(0x1348a).y - c2.npc_state(0x1348a).y < 150
      - c1.npc_state(0x1348a).is3DLoaded == false
      - c1.npc_state(0x1348a).cell != 0x133c7
  - c2: screenshot
  - c1: screenshot
  # informational: whether the street seat's copy was moved at the promotion (formView's own line, narrowed to this interior)
  - c2: log-count {pattern: "moved 1348a into 3c .the engine had it in 133c7"}
  # the settle, 65 s on: one hand-off out and none back (a second "now simulates" line, or any pass, follow or move of him back
  # into the interior beyond the baseline, is the ping-pong; a bounce under D22's margin logs "follows ... within the pass
  # margin", so the three verbs are read); his package takes him on, so no cell is claimed but "not the interior"
  - wait: 60
  - c2: npc-state {formId: 0x1348a}
  - c1: npc-state {formId: 0x1348a}
  - assert:
      - 'server.log_count("now simulates 1348a in cell 97") == snapshot("street_a") + 1'
      - 'server.log_count("passes 1348a into cell 133c7") == snapshot("back_a")'
      - 'server.log_count("(passes|follows|moves) 1348a into cell 133c7") == snapshot("into_a")'
      - server.ref(0x1348a).cell != "133c7:Skyrim.esm"
      - c2.npc_state(0x1348a).cell != 0x133c7
      - c1.npc_state(0x1348a).cell != 0x133c7
  - c2: screenshot
  - c1: screenshot
  # leg B: the roles swapped at the inn's door on a restarted clock (the restart forgets the hosts and the follows; the
  # server's log and its counts stand, and so do the world and the seats' places: so leg A's street seat parks at lab-spawn
  # first, five squares out, and comes back only to enter the inn, b-npc-handoff-night's shape)
  - c2: teleport {cell: lab-spawn, x: 0, y: -300, z: 0, rot: [0, 0, 0]}
  - wait: 8
  - server: restart {gameHour: 20.0}
  - c1: connect
  - c2: connect
  - wait: 10
  # leg B, the inn door at 22:00: the restart kept the world, so his record is at the mill or on his way (anywhere but the inn);
  # c2 waits at lab-spawn through the restart, so c1 alone lands on the street, hosts his cell, and his inn package walks him
  # into the unhosted inn under c1's follow
  - assert:
      - server.ref(0x1348a).cell != "133c6:Skyrim.esm"
  - c1: teleport {cell: "3c:Skyrim.esm", x: 21995, y: -44935, z: -128, rot: [0, 0, 180]}
  - wait: 20
  - assert:
      - server.host(0x9712).client == "c1"
      - server.host(0x9731).client == "c1"
  - until: {within: 300, expect: [server.ref(0x1348a).cell == "133c6:Skyrim.esm"]}
  - assert:
      - server.follow(0x1348a).following == true
      - server.follow(0x1348a).client == "c1"
  # the premise, claimed: the street's seat visits the interior first (it hosts it, so Hod's AI may step while it looks), sees
  # him with 3D, then leaves for the street; the interior unhosts behind it, and its engine's copy of him reads indoors with no
  # 3D (playtest 41's shape, the bounce's mechanism, whatever its cause). Across the visit's grant no pass, follow or move of
  # him into an exterior cell (055217's grant promotion put him outdoors from a stale placement)
  - server: log-count {pattern: "(passes|follows|moves) 1348a into cell 97"}
  - server: snapshot {name: out_visit_b, of: 'server.log_count("(passes|follows|moves) 1348a into cell 97")'}
  - c1: teleport {cell: "133c6:Skyrim.esm", x: -250, y: -360, z: 0, rot: [0, 0, 0]}
  - wait: 5
  - c1: move {dy: 150, duration_s: 2}
  - until: {within: 60, expect: [server.host(0x133c6).client == "c1"]}
  - wait: 8
  - c1: npc-state {formId: 0x1348a}
  - assert:
      - server.ref(0x1348a).cell == "133c6:Skyrim.esm"
      - c1.npc_state(0x1348a).is3DLoaded == true
      - server.follow(0x1348a).following == false
      - 'server.log_count("(passes|follows|moves) 1348a into cell 97") == snapshot("out_visit_b")'
  - c1: teleport {cell: "3c:Skyrim.esm", x: 21995, y: -44935, z: -128, rot: [0, 0, 180]}
  - until: {within: 60, expect: [server.host(0x133c6).hosted == false]}
  - wait: 15
  - c1: npc-state {formId: 0x1348a}
  - assert:
      - server.host(0x9712).client == "c1"
      - server.host(0x9731).client == "c1"
      - server.ref(0x1348a).cell == "133c6:Skyrim.esm"
      - c1.npc_state(0x1348a).is3DLoaded == false
      - c1.npc_state(0x1348a).cell == 0x133c6
      - server.time().hour >= 20
  # the interior's seat enters by the same landing, is granted the interior and runs him: his 3D and AI there, the street
  # seat's copy still indoors with no 3D; across its grant no pass, follow or move of him into an exterior cell (055217: the
  # new host's first report put him outdoors 180 ms after the grant, the bounce's mechanism at a grant); the hour still short
  # of his exit (a late clock would put the exit before the baselines and the fix's run red at the exit until)
  - server: log-count {pattern: "(passes|follows|moves) 1348a into cell 97"}
  - server: snapshot {name: out_grant_b, of: 'server.log_count("(passes|follows|moves) 1348a into cell 97")'}
  - c2: teleport {cell: "133c6:Skyrim.esm", x: -250, y: -360, z: 0, rot: [0, 0, 0]}
  - wait: 5
  - c2: move {dy: 150, duration_s: 2}
  - until: {within: 90, expect: [server.host(0x133c6).client == "c2"]}
  - wait: 10
  - c1: npc-state {formId: 0x1348a}
  - c2: npc-state {formId: 0x1348a}
  - assert:
      - 'server.log_count("(passes|follows|moves) 1348a into cell 97") == snapshot("out_grant_b")'
      - server.ref(0x1348a).cell == "133c6:Skyrim.esm"
      - c2.npc_state(0x1348a).is3DLoaded == true
      - c2.npc_state(0x1348a).aiEnabled == true
      - c1.npc_state(0x1348a).is3DLoaded == false
      - c1.npc_state(0x1348a).cell == 0x133c6
      - server.time().hour >= 20
      - server.time().hour < 21.8
  # the baselines, the door line first (if his exit fell between the reads, the door claim is the one that would read false
  # with the fix working): what the log already counts before the exit
  - server: log-count {pattern: "door 13419: 1348a.s host .* walks it through to 3c"}
  - server: log-count {pattern: "now simulates 1348a in cell 97"}
  - server: log-count {pattern: "passes 1348a into cell 133c6"}
  - server: log-count {pattern: "(passes|follows|moves) 1348a into cell 133c6"}
  - server: snapshot {name: door_b, of: 'server.log_count("door 13419: 1348a.s host .* walks it through to 3c")'}
  - server: snapshot {name: street_b, of: 'server.log_count("now simulates 1348a in cell 97")'}
  - server: snapshot {name: back_b, of: 'server.log_count("passes 1348a into cell 133c6")'}
  - server: snapshot {name: into_b, of: 'server.log_count("(passes|follows|moves) 1348a into cell 133c6")'}
  # the exit: his package takes him out by 13419 (the server's "door 13419: ... walks it through to 3c" line); the interior
  # host's report from the street passes him to the street's host (D9, "now simulates 1348a in cell 97xx"); the wait is on
  # that pass line, not on the cell
  - until: {within: 600, expect: ['server.log_count("now simulates 1348a in cell 97") > snapshot("street_b")']}
  - wait: 5
  # the counts first (each server.log_count re-reads the whole log) with the hour (the pass was his package's exit), then the
  # two seats read back to back with the street's seat last, then the engine and position claims with no log count among them;
  # on the parent THIS block is the bounce's red (one more "now simulates" and a pass back into the interior)
  - assert:
      - 'server.log_count("door 13419: 1348a.s host .* walks it through to 3c") > snapshot("door_b")'
      - 'server.log_count("now simulates 1348a in cell 97") == snapshot("street_b") + 1'
      - 'server.log_count("passes 1348a into cell 133c6") == snapshot("back_b")'
      - 'server.log_count("(passes|follows|moves) 1348a into cell 133c6") == snapshot("into_b")'
      - server.time().hour >= 21.9
  - c2: npc-state {formId: 0x1348a}
  - c1: npc-state {formId: 0x1348a}
  - assert:
      - server.ref(0x1348a).cell == "3c:Skyrim.esm"
      - c1.npc_state(0x1348a).is3DLoaded == true
      - c1.npc_state(0x1348a).aiEnabled == true
      - c1.npc_state(0x1348a).x - server.ref(0x1348a).x < 150
