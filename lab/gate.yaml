# ADR-030's merge gate (docs/DECISIONS.md). `just verb-merge <branch> <scenario>...`
# runs `always`, the scenarios named on its command line (the merging verb's own
# and those of the verbs the branch touched), and `watch`: the scenarios with an
# open ADR-027 watch item, each named with the verb doc that holds the item; take
# one out in the commit that closes its item. The full sweep is the nightly's.
# `pending`: committed scenarios red by design until their verb's fix lands, each
# named with the verb doc that holds the fix. The full sweep ("all": the nightly,
# layer-merge's gate) leaves them out; a merge that names one still runs it; take
# one out in the commit whose T3 turns it green.
# m2-close (docs/M2-CLOSE.md): the set whose green closes M2 is "all" on the m2-train-30
# stage under the merged layer, `pending` emptied of the four the train carries (b-snapback
# stays: its fix is the train after twenty-eight): `just sweep m2-close`, or the nightly over
# that stage, cited by GATE_SET at the train's merge (ADR-042).
always: [smoke-two-players, a-restart-persistence, b-duel]   # M0's floor, M1's exit, M2's exit (server-authoritative damage between two players, 2026-10-14)
watch:
  - b-npc-death        # docs/verbs/npc-fate.md:2033, red four times on its restart leg in 52's cut gate, restage and gate and 54's gate (three premises fixed 86d340b, c1f44fb, b8c494f; the fourth H-54e, a corpse moved on its host's engine, 190413, green in 54's rest 202429) (2026-10-27)
  - b-npc-stream-voice # docs/verbs/npc-stream.md:1907, red once in 54's gate (the listener placed 74 units off a point in an obstacle, past the judge's 64; tolerance 150 c70e828, green in the rest 203422) (2026-10-27)
  - b-npc-caster       # docs/verbs/npc-stream.md, the watch item of 53's chain: red at 051558 (the read before the first cast) and 064325 (the mage killed before a cast end), green on the rerun 065950; the until and the hardened record are in the scenario (bf15433, 34cbc19) (00:08 PDT 2026-10-28)
  - c-riverwood        # docs/verbs/cell-host.md, M3's exit: red once on its restart leg in the union's sweep (211911: Alvor's restored record (27.8, 72.4) from its pre-restart snapshot against a 64 bound; the hand-off and the schedules held), green throughout on the rerun 212353; the write-behind save's lag at a restart, HYPOTHESIS (TickSaveStorage: one batch in flight, the next waits); closes on a green gate or a graceful stop that flushes (2026-10-30, thuum-magnus)
pending:
  - b-npc-headshot-host  # lab-driver cannot aim: look and look-at leave the heading at the approach's, so a shot flies at the RECORD's point and misses a body 26 units off (54's gate 20261027-192858, every look-at heading equal to its approach's; v9's green 104716 was luck); the headshot path's claims held whenever a shot landed; un-pend with numidium's driver aim fix after the ladder, proved by a probe (2026-10-27, thuum-magnus)
  - b-push               # docs/verbs/push.md: under the essentials layer c2 ragdolls where it stands and is never thrown (y -206 against under -650 in 20261021-165252-b-push, the m2-close sweep; -157 in 20261021-123016 on train-30's stage), the layer's refused second Ragdoll, cause unread (x-push-knock-frida); carried to M3 by name (ADR-042b)
  - b-formdesc-world     # ADR-043 (docs/DECISIONS.md), a world saved in the raw shape loaded under the layer's order: slice one's re-base holds on m2-train-30 44372078's stage (20261021-004815: server.log's version-2 write, world-after), red on its headParts row alone, an ADR-026 derivation gap (a preset's Skyrim.esm hair beside the race's), carried, so it stays pending (thuum-magnus, 2026-10-20)
  - b-body-loot          # docs/verbs/npc-fate.md:891: needs the D37 layer, Death Drop Overhaul out of the load order (Eli's D37 B), which never reached main (layer-d37-ddo-out dd2550c6, carried by apocrypha/layer-souls); with DDO loaded the engine drops some of the fate's rolled gear at death and not other (x-body-loot v3 and v4 the shield 0x13914; in the pass sweep 20261030-164127 the rolled weapon 79760 at 174118 and 77495 at 174322, red, while 174522's rolled SteelSword 0x13989 stayed, green), so its verdict follows the roll until DDO is out; take it out in layer-souls' merge, whose gate plays it after the clone's deletion of DeathDropOverhaul.dll is read (2026-10-30, numidium with apocrypha)
  - b-spell-placed-wall  # docs/verbs/spell-placed-object.md (D70): the server's copy stands 75 to 88 units from the caster's own wall, claim 3 red three times on the union 0e23c820 (204953, 205125 relaunched, 205303 cold; the engine places the wall at the caster's aim, HYPOTHESIS), so Raise Wall's copies are off for the merge (spellPlacedObjects emptied in both deploy settings, the verb's kill switch) and the other seat sees no wall (playtest 39's declared limit); un-pend with the caster-reported pose train (the verb doc's shape A), whose stage proves it (thuum-magnus, 2026-10-30)
  - c-dungeon-enemies    # docs/verbs/npc-fate.md (D71): the non-host's engine never opens a body the server admitted it to (claim 5's first menuOpen, red three times on the union 0e23c820: 210543, 210957 relaunched, 211413 cold; the body released from the puppet state at its death with the AI left off, PuppetApi.cpp Promote's dead branch; the server's admission is harmless, the handler's give-up releases it); M3's exit scenario, so M3 stays open; the cause read by x-body-open-guest (by path), the fix the train after, whose gate plays this (thuum-magnus, 2026-10-30)
