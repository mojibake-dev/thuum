# ADR-030's merge gate (docs/DECISIONS.md). `just verb-merge <branch> <scenario>...`
# runs `always`, the scenarios named on its command line (the merging verb's own
# and those of the verbs the branch touched), and `watch`: the scenarios with an
# open ADR-027 watch item, each named with the verb doc that holds the item; take
# one out in the commit that closes its item. The full sweep is the nightly's.
# `pending`: committed scenarios red by design until their verb's fix lands, each
# named with the verb doc that holds the fix. The full sweep ("all": the nightly,
# layer-merge's gate) leaves them out; a merge that names one still runs it; take
# one out in the commit whose T3 turns it green.
# m2-close (docs/M2-CLOSE.md): the set whose green closes M2 is "all" on the m2-train-30
# stage under the merged layer, `pending` emptied of the four the train carries (b-snapback
# stays: its fix is the train after twenty-eight): `just sweep m2-close`, or the nightly over
# that stage, cited by GATE_SET at the train's merge (ADR-042).
always: [smoke-two-players, a-restart-persistence, b-duel]   # M0's floor, M1's exit, M2's exit (server-authoritative damage between two players, 2026-10-14)
watch:
  - a-melee-reach      # docs/verbs/melee-reach.md:141, red once in the m2-god sweep (2026-10-10)
  - a-racemenu         # docs/verbs/racemenu-sync.md:746, a figure's head scale after a reconnect (2026-10-09)
  - b-spell            # docs/verbs/spell-cast.md:394, red once in the m2-stagger sweep (2026-10-11)
  - b-invis-recast     # docs/verbs/self-cast.md:104, a 120 s guest-agent stall spaced the casts past the spell's 30 s (2026-10-18)
  - b-cell-host        # docs/verbs/cell-host.md:982, red once at the restart's assert in the 50b merge gate (D18-B meeting the old fixed wait; the premise fixed the same evening) (2026-10-26)
  - b-npc-handoff-cross # docs/verbs/npc-handoff.md:668, red once at a login re-split in the stream's merge gate, and the pass thrash D36's brake answers (2026-10-26)
pending:
  - b-push               # docs/verbs/push.md: under the essentials layer c2 ragdolls where it stands and is never thrown (y -206 against under -650 in 20261021-165252-b-push, the m2-close sweep; -157 in 20261021-123016 on train-30's stage), the layer's refused second Ragdoll, cause unread (x-push-knock-frida); carried to M3 by name (ADR-042b)
  - b-formdesc-world     # ADR-043 (docs/DECISIONS.md), a world saved in the raw shape loaded under the layer's order: slice one's re-base holds on m2-train-30 44372078's stage (20261021-004815: server.log's version-2 write, world-after), red on its headParts row alone, an ADR-026 derivation gap (a preset's Skyrim.esm hair beside the race's), carried, so it stays pending (thuum-magnus, 2026-10-20)
