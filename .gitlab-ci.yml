# GitLab CI for the thuum superproject (ADR-016). Jobs run only on the dedicated
# sky-ci VM, on its light lane (tag `sky-light`: a second runner there since
# 2026-10-13, one job at a time, 1 CPU and 1 GB, so these alpine, python and
# node jobs no longer queue behind the fork's builds on the `sky` lane; a
# heavier job here would be OOM-killed by design). The estate's own runner
# never executes this project.
# Image: alpine plus a pinned `just` release binary downloaded in before_script.
# Kept deliberately small: this repo holds docs, lab software, and config; the
# Rust and C++ pipelines live in the skymp fork's own .gitlab-ci.yml.
#
# The GitLab merge request approval rule that names Eli as the required
# approver for lab/scenarios/ is configured in the project settings, not here.

stages: [lint, gate, windows]

variables:
  GIT_SUBMODULE_STRATEGY: none
  JUST_VERSION: "1.58.0"

.base:
  image: alpine:3.20
  tags: [sky-light]
  before_script:
    - apk add --no-cache git curl python3
    - curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C /usr/local/bin just

# Rule 11 (no em dash) across the docs, config, and scenarios, and the justfile must parse.
docs-lint:
  extends: .base
  stage: lint
  script:
    - |
      python3 - <<'PY'
      import pathlib, sys
      skip = {".git", "skymp", "CommonLibSSE-NG", "node_modules", "target"}
      exts = {".md", ".yaml", ".yml", ".json"}
      bad = []
      for p in pathlib.Path(".").rglob("*"):
          if any(part in skip for part in p.parts):
              continue
          if p.is_file() and (p.suffix in exts or p.name == "justfile"):
              for n, line in enumerate(p.read_text(encoding="utf-8", errors="replace").splitlines(), 1):
                  if chr(0x2014) in line:
                      bad.append(f"{p}:{n}: {line.strip()}")
      if bad:
          print("em dash found (rule 11):")
          print("\n".join(bad))
          sys.exit(1)
      print("no em dash")
      PY
    # a T3 box may not be ticked over an open engine claim (ADR-064 decision 1; lab/tools/verb-lint.py)
    - python3 lab/tools/verb-lint.py docs/verbs
    - just --list
    # ADR-065 decision 1: every row of docs/STATE.md declares a Rung (lab/state.py); the regeneration check against CommonLib's
    # flags runs locally as `just state-check`, since CI checks out no submodule
    - python3 lab/state.py --out docs/STATE.md --lint-only

# Lab tooling unit tests (addr.py, later ledger.py and lab-api). The fixture
# tests skip without the CommonLibSSE-NG submodule; synthetic ones always run.
lab-tests:
  extends: .base
  stage: lint
  rules: &lab-changes
    # a docs-only push skips the suites (69 jobs once queued on the one light lane, 2026-10-20);
    # anything under lab/ (scenarios too: the suites parse them) or this file runs them
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - changes: [lab/**/*, .gitlab-ci.yml]
  script:
    - apk add --no-cache nodejs
    - python3 -m unittest discover -s lab/tests -v
    - node --test lab/gamemode/gamemode.test.js

# lab-api's own tests need its dependencies; uv's image carries Python 3.12.
labapi-tests:
  stage: lint
  tags: [sky-light]
  image: ghcr.io/astral-sh/uv:python3.12-alpine
  rules: *lab-changes
  script:
    - uv run --project lab/labapi python -m unittest discover -s lab/tests -v

# ADR-064 decision 3's two-seat contract, the rules a parser can check (lab/tools/scenario-lint.py): a claim that cannot
# fail, a relaunch premise the deploy lacks, a ticked verb whose two-seat scenario leaves a seat out. It reads the
# scenarios with lab-api's parser, so uv's image; a verb doc's tick runs it too.
scenario-lint:
  stage: lint
  tags: [sky-light]
  image: ghcr.io/astral-sh/uv:python3.12-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - changes: [lab/**/*, docs/verbs/**/*, .gitlab-ci.yml]
  script:
    - uv run --project lab/labapi python lab/tools/scenario-lint.py

# lab-api image, pushed to the sky-ci registry that sky-srv pulls from
# (10.10.70.12:5000; localhost:5000 from a host-socket job). Tags: the commit
# and latest.
labapi-image:
  stage: gate
  tags: [sky-light]
  image: docker:27
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: [lab/labapi/**/*]
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - docker build --build-arg "LABAPI_VERSION=$CI_COMMIT_SHORT_SHA" -t "localhost:5000/thuum/lab-api:$CI_COMMIT_SHORT_SHA" lab/labapi
    - docker tag "localhost:5000/thuum/lab-api:$CI_COMMIT_SHORT_SHA" localhost:5000/thuum/lab-api:latest
    - docker push "localhost:5000/thuum/lab-api:$CI_COMMIT_SHORT_SHA"
    - docker push localhost:5000/thuum/lab-api:latest

# The lab-driver bundle, kept as a job artifact for the client template.
driver-build:
  stage: lint
  tags: [sky-light]
  image: node:22-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - changes: [lab/driver/**/*, .gitlab-ci.yml]
  script:
    - cd lab/driver && npm ci && npm run build
  artifacts:
    paths: [lab/driver/build/lab-driver.js]
    expire_in: 3 months

# ADR-009 / ADR-016 / ADR-031: a scenario or reference change travels alone. Fail the
# pipeline if any commit in it touches lab/scenarios/*.yaml or lab/references/* together
# with any other path: on a merge request
# the commits since its base, on a push to main the commits the push brought (the
# repo commits straight to main, so until 2026-10-13 this gate never ran).
# The two Windows jobs (sky-build, VM 720, tag `windows`, the fork's shell runner with pwsh, the one Windows lane), one
# template: their own last stage, so nothing in lint or gate waits on them or skips for them, a 90 min timeout, and
# thuum's own vcpkg clone at the fork's pinned commit in D:/thuum-vcpkg (re-cloned when a clone never finished,
# re-bootstrapped when the pin moves; the fork's binary cache read only, thuum's own writable). A job runs on main when
# a push changes its sources and is offered as a manual job on a branch that differs from main there (compare_to);
# schedules, web and API pipelines never run it (numidium's rules review, 2026-11-06). Each layer row of source ci
# takes one of their artifacts, so a merged row never carries files no pipeline can rebuild.
.thuum-windows:
  stage: windows
  tags: [windows]
  timeout: 90m
  variables:
    GIT_DEPTH: "1"
    VCPKG_COMMIT: cb2981c4e03d421fa03b9bb5044cd1986180e7e4
    VCPKG_BINARY_SOURCES: "clear;files,D:/vcpkg-bincache,read;files,D:/thuum-vcpkg-bincache,readwrite"
    VCPKG_FEATURE_FLAGS: "manifests"
  before_script:
    - New-Item -ItemType Directory -Force D:/thuum-vcpkg-bincache | Out-Null
    - |
      if (-not (Test-Path D:/thuum-vcpkg/.thuum-clone-ok)) {
        if (Test-Path D:/thuum-vcpkg) { Remove-Item -Recurse -Force D:/thuum-vcpkg }
        git clone --quiet https://github.com/microsoft/vcpkg.git D:/thuum-vcpkg; if ($LASTEXITCODE) { exit 1 }
        New-Item -ItemType File D:/thuum-vcpkg/.thuum-clone-ok | Out-Null
      }
      git -C D:/thuum-vcpkg fetch --quiet origin $env:VCPKG_COMMIT; if ($LASTEXITCODE) { exit 1 }
      git -C D:/thuum-vcpkg checkout --quiet $env:VCPKG_COMMIT; if ($LASTEXITCODE) { exit 1 }
      $boot = 'D:/thuum-vcpkg/.thuum-bootstrap-commit'
      if (-not (Test-Path D:/thuum-vcpkg/vcpkg.exe) -or -not (Test-Path $boot) -or ((Get-Content $boot -Raw).Trim() -ne $env:VCPKG_COMMIT)) {
        & D:/thuum-vcpkg/bootstrap-vcpkg.bat -disableMetrics; if ($LASTEXITCODE) { exit 1 }
        Set-Content -Path $boot -Value $env:VCPKG_COMMIT
      }

# Rotfern's Fixes, the engine-fixes DLL (lab/rotferns-fixes, docs/research/terrain-upgrade-crash.md, ADR-069). Enabled by the
# project variable ROTFERNS_FIXES_BUILD_WINDOWS=1 (core). Only the CommonLibSSE-NG submodule is checked out.
rotferns-fixes-build:
  extends: .thuum-windows
  variables:
    GIT_SUBMODULE_STRATEGY: normal
    GIT_SUBMODULE_PATHS: CommonLibSSE-NG
  rules:
    - if: $ROTFERNS_FIXES_BUILD_WINDOWS != "1"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [lab/rotferns-fixes/**/*, CommonLibSSE-NG]
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
      changes:
        paths: [lab/rotferns-fixes/**/*, CommonLibSSE-NG]
        compare_to: refs/heads/main
      when: manual
      allow_failure: true
  script:
    - |
      cmake -S lab/rotferns-fixes -B lab/rotferns-fixes/build -G "Visual Studio 17 2022" -A x64 `
        -DCMAKE_TOOLCHAIN_FILE=D:/thuum-vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
      if ($LASTEXITCODE) { exit 1 }
    - cmake --build lab/rotferns-fixes/build --config Release; if ($LASTEXITCODE) { exit 1 }
    - cmake --install lab/rotferns-fixes/build --config Release --prefix lab/rotferns-fixes/dist; if ($LASTEXITCODE) { exit 1 }
    - Get-ChildItem -Recurse lab/rotferns-fixes/dist | ForEach-Object { "{0}`t{1}" -f $_.Length, $_.FullName }
  artifacts:
    name: rotferns-fixes
    paths: [lab/rotferns-fixes/dist]
    # an essentials row of source ci names this job, so its artifact must outlive the default
    expire_in: never

# CBBE SFW Edition's bodies and outfits with morph files (lab/bodyslide, docs/MODS.md), BodySlide 6.1.0 run headless with the
# shipped preset. Its inputs are the two Nexus archives lab/bodyslide/inputs.tsv names, in sky-build's D:\thuum-inputs
# (lab/tools/bodyslide-inputs.sh), never in this repo; build.ps1 checks their md5. 7-Zip is vcpkg's own. Enabled by the
# project variable SFW_BODYSLIDE_BUILD_WINDOWS=1 (core). No submodule.
cbbe-sfw-bodyslide-build:
  extends: .thuum-windows
  variables:
    GIT_SUBMODULE_STRATEGY: none
  rules:
    - if: $SFW_BODYSLIDE_BUILD_WINDOWS != "1"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [lab/bodyslide/**/*]
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
      changes:
        paths: [lab/bodyslide/**/*]
        compare_to: refs/heads/main
      when: manual
      allow_failure: true
  script:
    - $sevenZip = (& D:/thuum-vcpkg/vcpkg.exe fetch 7zip | Select-Object -Last 1).Trim(); if (-not (Test-Path $sevenZip)) { exit 1 }
    - '& lab/bodyslide/build.ps1 -Inputs D:\thuum-inputs -Work D:\thuum-bodyslide -Out "$PWD\lab\bodyslide\dist" -SevenZip $sevenZip'
  artifacts:
    name: cbbe-sfw-bodyslide
    paths: [lab/bodyslide/dist]
    expire_in: never

# rotfern's eyes (thuum D-E1, lab/rotfern-eyes): the companion plugin, then its script compiled with the Creation Kit's own
# PapyrusCompiler.exe. The plugin is Python's (build_esp.py, the same bytes every run), so the Linux lane writes it; the Windows
# job takes it by `needs`, compiles RotfernEyesAlias.psc and publishes both as one artifact, which the layer's ci row names. The
# compiler's inputs are licensed or third-party and come from core's /persist/ck (sky-build's address only, MANUAL-STEPS 14e),
# checked against its SHA256SUMS: the CK's Papyrus Compiler, Bethesda's own Scripts.zip and SKSE64 2.2.6's script sources. SKSE's
# come first on the import path, since HeadPart, Actor.ChangeHeadPart and ActorBase.GetNthHeadPart are declared only there (core,
# 2026-11-09). They are unpacked in D:\thuum-papyrus-work, outside the checkout, so they never reach an artifact, and removed after.
# The Windows job is enabled by the project variable ROTFERN_EYES_BUILD_WINDOWS=1 (core).
rotfern-eyes-esp:
  extends: .base
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [lab/rotfern-eyes/**/*]
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
      changes:
        paths: [lab/rotfern-eyes/**/*]
        compare_to: refs/heads/main
  script:
    - python3 lab/rotfern-eyes/build_esp.py lab/rotfern-eyes/dist/RotfernEyes.esp
  artifacts:
    name: rotfern-eyes-esp
    paths: [lab/rotfern-eyes/dist]
    expire_in: 1 week

rotfern-eyes-build:
  extends: .thuum-windows
  variables:
    GIT_SUBMODULE_STRATEGY: none
  needs:
    - job: rotfern-eyes-esp
      artifacts: true
  rules:
    - if: $ROTFERN_EYES_BUILD_WINDOWS != "1"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [lab/rotfern-eyes/**/*]
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
      changes:
        paths: [lab/rotfern-eyes/**/*]
        compare_to: refs/heads/main
      when: manual
      allow_failure: true
  script:
    - |
      $work = 'D:\thuum-papyrus-work'
      if (Test-Path $work) { Remove-Item -Recurse -Force $work }
      New-Item -ItemType Directory -Force $work | Out-Null
      $base = 'https://thuum.gaussing.tv/persist/ck'
      & curl.exe -sS -f -o "$work\SHA256SUMS" "$base/SHA256SUMS"; if ($LASTEXITCODE) { exit 1 }
      $want = @{}
      foreach ($line in Get-Content "$work\SHA256SUMS") { if ($line.Trim()) { $h, $n = $line.Trim() -split '\s+', 2; $want[$n.TrimStart('*')] = $h.ToLower() } }
      foreach ($n in @('papyrus-compiler-ck.zip', 'vanilla-scripts.zip', 'skse64-2.2.6-scripts-source.zip')) {
        if (-not $want.ContainsKey($n)) { throw "SHA256SUMS names no $n" }
        & curl.exe -sS -f -o "$work\$n" "$base/$n"; if ($LASTEXITCODE) { exit 1 }
        $got = (Get-FileHash -Algorithm SHA256 "$work\$n").Hash.ToLower()
        if ($got -ne $want[$n]) { throw "$n sha256 $got is not $($want[$n])" }
        "input ok: $n"
      }
      $sevenZip = (& D:/thuum-vcpkg/vcpkg.exe fetch 7zip | Select-Object -Last 1).Trim(); if (-not (Test-Path $sevenZip)) { exit 1 }
      foreach ($pair in @(@('papyrus-compiler-ck.zip', 'ck'), @('vanilla-scripts.zip', 'vanilla'), @('skse64-2.2.6-scripts-source.zip', 'skse'))) {
        & $sevenZip x -y "-o$work\$($pair[1])" "$work\$($pair[0])" | Out-Null; if ($LASTEXITCODE) { throw "7z $($pair[0]) $LASTEXITCODE" }
      }
      $compiler = "$work\ck\Papyrus Compiler\PapyrusCompiler.exe"
      if (-not (Test-Path $compiler)) { throw "no PapyrusCompiler.exe in the CK archive" }
      Copy-Item "$work\ck\TESV_Papyrus_Flags.flg" "$work\vanilla\Source\Scripts\"
      $out = "$PWD\lab\rotfern-eyes\dist\Scripts"
      New-Item -ItemType Directory -Force $out | Out-Null
      $imports = "$work\skse\Source\Scripts;$work\vanilla\Source\Scripts;$PWD\lab\rotfern-eyes\src"
      & $compiler 'RotfernEyesAlias.psc' "-f=TESV_Papyrus_Flags.flg" "-i=$imports" "-o=$out"
      $code = $LASTEXITCODE
      Remove-Item -Recurse -Force $work
      if ($code) { throw "PapyrusCompiler exit $code" }
      foreach ($f in @("$out\RotfernEyesAlias.pex", "$PWD\lab\rotfern-eyes\dist\RotfernEyes.esp")) { if (-not (Test-Path $f)) { throw "no $f" } }
      Get-ChildItem -Recurse -File lab/rotfern-eyes/dist | ForEach-Object { "{0}`t{1}`t{2}" -f $_.Length, (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.FullName }
  artifacts:
    name: rotfern-eyes
    paths: [lab/rotfern-eyes/dist]
    # the layer's ci row names this job, so its artifact must outlive the default
    expire_in: never

scenario-gate:
  extends: .base
  stage: gate
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
  script:
    - |
      python3 - <<'PY'
      import os, re, subprocess, sys
      base = os.environ.get("CI_MERGE_REQUEST_DIFF_BASE_SHA") or os.environ.get("CI_COMMIT_BEFORE_SHA", "")
      if not base or set(base) <= {"0"}:
          print("no base commit to compare against (a new branch or an API pipeline); nothing checked")
          sys.exit(0)
      commits = subprocess.check_output(["git", "rev-list", f"{base}..HEAD"], text=True).split()
      pat = re.compile(r"^lab/(scenarios/.*\.ya?ml|references/.*)$")
      bad = 0
      for c in commits:
          files = subprocess.check_output(["git", "diff-tree", "--no-commit-id", "--name-only", "-r", c], text=True).split()
          scen = [f for f in files if pat.match(f)]
          other = [f for f in files if not pat.match(f)]
          if scen and other:
              bad += 1
              print(f"commit {c} mixes scenario YAML with other files:")
              for f in files:
                  print("  ", f)
      if bad:
          sys.exit(1)
      print(f"{len(commits)} commits checked, none mixes scenarios with code")
      PY
